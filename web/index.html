<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vivieen</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0b0d10;color:#f2efe9;
  font:400 15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,sans-serif;overflow:hidden}
#stage{position:fixed;inset:0}
canvas{width:100%;height:100%;display:block;
  /* Touch: a held finger must be a gesture, never a text-selection loupe
     or a scroll - the head-hold talk dies otherwise (iOS, 2026-08-02). */
  touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#vignette{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 35%,transparent 45%,rgba(0,0,0,.55) 100%)}
#bar{position:fixed;left:0;right:0;bottom:0;padding:20px 24px 26px;
  background:linear-gradient(to top,rgba(6,8,11,.94) 40%,transparent);
  display:flex;flex-direction:column;align-items:center;gap:8px}
#log{width:min(720px,92vw);min-height:0;text-align:center}
#you{opacity:.5;font-size:13px;letter-spacing:.01em;margin-bottom:5px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#her{--caption-lines:1;--caption-folded-height:calc(var(--caption-lines)*1.45em + 20px);
  --caption-expanded-height:min(46vh,420px);width:100%;max-height:var(--caption-folded-height);
  overflow:hidden;overscroll-behavior:contain;scrollbar-gutter:stable;
  padding:9px 12px;border:1px solid rgba(255,255,255,.10);border-radius:13px;
  background:rgba(6,8,11,.78);backdrop-filter:blur(12px);
  font-size:17px;line-height:1.45;letter-spacing:-.01em;text-align:left;text-wrap:pretty;
  scrollbar-width:thin;scrollbar-color:#69717d rgba(255,255,255,.05);
  transition:max-height 400ms cubic-bezier(.22,1,.36,1),border-color 250ms ease,
             background 250ms ease,box-shadow 250ms ease;will-change:max-height}
#her.is-expanded{max-height:var(--caption-expanded-height);overflow-y:auto;
  border-color:rgba(255,255,255,.18);background:rgba(6,8,11,.92);
  box-shadow:0 12px 36px rgba(0,0,0,.24)}
#her:empty{display:none}
#her:focus-visible{outline:1px solid #8b93a0;outline-offset:2px}
#her .caption-summary{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#her .caption-markdown{display:grid;gap:.72em;overflow-wrap:anywhere}
/* `display:grid` outranks the UA rule behind the hidden attribute, so the
   folded caption drew BOTH the summary and the full markdown - every
   reply looked doubled with its second copy clipped (owner screenshot,
   2026-08-02). Hidden means hidden. */
#her .caption-markdown[hidden],#her .caption-summary[hidden]{display:none}
#her .caption-markdown h1,#her .caption-markdown h2,#her .caption-markdown h3,
#her .caption-markdown h4,#her .caption-markdown h5,#her .caption-markdown h6{
  color:#fff;font-weight:680;line-height:1.22;letter-spacing:-.025em}
#her .caption-markdown h1{font-size:1.28em}#her .caption-markdown h2{font-size:1.18em}
#her .caption-markdown h3{font-size:1.08em}
#her .caption-markdown ul,#her .caption-markdown ol{padding-left:1.35em}
#her .caption-markdown li+li{margin-top:.28em}
#her .caption-markdown blockquote{padding-left:.85em;border-left:3px solid #d81f4a;color:#c8ced7}
#her .caption-markdown code{padding:.12em .35em;border-radius:5px;background:#20242b;
  color:#ffd6df;font:500 .88em/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}
#her .caption-markdown pre{overflow-x:auto;padding:11px 12px;border:1px solid #292f38;
  border-radius:9px;background:#0e1116;white-space:pre}
#her .caption-markdown pre code{padding:0;background:transparent;color:#e8ebef}
#her .caption-markdown a{color:#ff8aa5;text-decoration-color:rgba(255,138,165,.5);
  text-underline-offset:2px}
#her .caption-markdown hr{height:1px;border:0;background:rgba(255,255,255,.12)}
#her .caption-markdown table{width:100%;border-collapse:collapse;font-size:.92em}
#her .caption-markdown th,#her .caption-markdown td{padding:6px 8px;
  border:1px solid #303641;text-align:left;vertical-align:top}
#her .caption-markdown th{background:#181c22;color:#fff;font-weight:650}
#her::-webkit-scrollbar{width:6px}
#her::-webkit-scrollbar-track{background:rgba(255,255,255,.05);border-radius:6px}
#her::-webkit-scrollbar-thumb{background:#69717d;border-radius:6px}
@media (prefers-reduced-motion:reduce){#her{transition:none}}
/* Bottom-aligned so a grown field rises upward past the EnConvo mark. */
#row{display:flex;align-items:flex-end;gap:12px;width:min(720px,92vw)}
#manual{flex:1;min-width:0;display:flex;align-items:flex-end;gap:12px}
#monitor{display:none;position:relative;flex:none;width:46px;height:46px;padding:0;align-items:center;justify-content:center;gap:9px;
  border:1px solid rgba(255,255,255,.14);border-radius:23px;
  background:rgba(14,16,20,.55);backdrop-filter:blur(18px);color:#c8ced7;
  font:600 13px/1 inherit;letter-spacing:.01em;cursor:pointer;white-space:nowrap;
  transition:flex .2s ease,width .2s ease,color .2s ease,border-color .2s ease,background .2s ease}
html.electron #monitor{display:flex}
#monitor:hover{color:#fff;border-color:rgba(255,255,255,.30)}
#monitor[disabled]{cursor:wait;opacity:.7}
#monitor.pending{color:#e8b13a;border-color:rgba(232,177,58,.42)}
#monitor.error{color:#f07a86;border-color:rgba(240,122,134,.4)}
#monitor.active{color:#85e4ad;border-color:rgba(56,209,122,.48);background:rgba(25,58,42,.72)}
#monitorWave{height:18px;display:flex;align-items:center;gap:2px}
#monitorWave span{display:block;width:2px;height:5px;border-radius:2px;background:currentColor;opacity:.72}
#monitor.active #monitorWave span{animation:monitorWave .56s ease-in-out infinite alternate}
#monitor.active #monitorWave span:nth-child(2){animation-delay:-.22s}
#monitor.active #monitorWave span:nth-child(3){animation-delay:-.38s}
@keyframes monitorWave{to{height:17px}}

#monitor:hover #monitorMark{opacity:1}
/* The hover label is our own element: native title tooltips are unreliable
   over a transparent window whose click-through flag flips with the cursor. */
#monitorTip{position:absolute;bottom:calc(100% + 9px);left:0;
  padding:5px 9px;border-radius:6px;border:1px solid rgba(255,255,255,.12);
  background:rgba(20,22,26,.94);backdrop-filter:blur(12px);color:#e8e7e4;
  font-family:inherit;font-size:11.5px;font-weight:500;line-height:1;
  letter-spacing:.01em;white-space:nowrap;
  pointer-events:none;opacity:0;transform:translateY(3px);
  transition:opacity .15s ease,transform .15s ease}
#monitor:hover #monitorTip{opacity:1;transform:none}
#row.monitoring #monitorTip{display:none}
#monitorWave,#monitorText{display:none}
#row.monitoring #monitorWave{display:flex}
#row.monitoring #monitorText{display:inline}
#row.monitoring #manual{display:none}
#row.monitoring #monitor{flex:1;width:auto}
/* The talk button is gone: her head IS the hold-to-talk control (and Space
   still records). The element stays in the DOM because the recording flow
   reads its disabled/rec state. */
#ptt{display:none}
/* A textarea that behaves like a one-line field until the text needs more:
   it auto-grows (JS keeps height at scrollHeight) up to ~4 lines, then
   scrolls. Padding centres a single line inside the 46px pill. */
#txt{flex:1.1;min-width:0;box-sizing:border-box;height:46px;min-height:46px;max-height:132px;
  border-radius:23px;resize:none;overflow-y:auto;
  border:1px solid rgba(255,255,255,.14);background:rgba(14,16,20,.55);
  backdrop-filter:blur(18px);color:#f2efe9;padding:12px 20px;
  font:inherit;font-size:14px;line-height:1.4;font-weight:400;
  outline:none;scrollbar-width:none;
  transition:border-color .2s ease,background .2s ease}
#txt::-webkit-scrollbar{display:none}
#txt::placeholder{color:rgba(242,239,233,.42)}
#txt:focus{border-color:rgba(255,255,255,.30);background:rgba(14,16,20,.68)}
/* With the talk button gone, the field is the recording indicator. */
#txt.rec{border-color:rgba(244,60,102,.72);
  box-shadow:0 0 0 3px rgba(244,60,102,.14);animation:recPulse 1.1s infinite}
@keyframes recPulse{50%{border-color:rgba(244,60,102,.34)}}
/* The listening hint: a quiet Notion-style chip above the input - one small
   recording dot, five slim monochrome bars, and the word itself. Same glass
   language as the bar and bubble, none of the old neon. */
#listenWave{display:none;position:fixed;z-index:75;left:50%;
  bottom:calc(var(--txt-h,46px) + 26px);
  transform:translateX(-50%);align-items:center;gap:9px;height:32px;
  padding:0 13px;border-radius:8px;border:1px solid rgba(255,255,255,.12);
  background:rgba(20,22,26,.9);backdrop-filter:blur(20px) saturate(1.1);
  box-shadow:0 8px 24px rgba(0,0,0,.26);pointer-events:none}
html.listening #listenWave{display:flex}
#listenWaveDot{width:6px;height:6px;border-radius:50%;background:#e2483a;
  animation:listenDot 1.6s ease-in-out infinite}
@keyframes listenDot{50%{opacity:.35}}
#listenWaveBars{display:flex;align-items:center;gap:2.5px;height:16px}
/* The bars are driven by the REAL microphone level (owner: a static loop
   is a hint, not a meter) - heights come from script, not keyframes. */
#listenWaveBars span{width:2px;height:3px;border-radius:1px;
  background:rgba(255,255,255,.82);transition:height 80ms ease}
#listenWaveText{color:rgba(255,255,255,.6);font-family:inherit;font-size:11px;
  font-weight:500;line-height:1;letter-spacing:.02em}
#status{position:fixed;top:20px;left:24px;font-size:12px;letter-spacing:.08em;
  text-transform:uppercase;opacity:.55;display:flex;align-items:center;gap:9px}
#st{max-width:calc(100vw - 190px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#dot{width:7px;height:7px;border-radius:50%;background:#5b6472;transition:background .25s}
#dot.on{background:#38d17a;box-shadow:0 0 10px #38d17a}
#dot.busy{background:#e8b13a;box-shadow:0 0 10px #e8b13a}
#dot.rec{background:#f43c66;box-shadow:0 0 10px #f43c66;animation:p 1s infinite}
@keyframes p{50%{opacity:.35}}
#vz{position:fixed;top:52px;right:26px;font:500 11px/1 ui-monospace,SFMono-Regular,monospace;
  letter-spacing:.14em;opacity:0;transition:opacity .3s;color:#8b93a0}
#vz.on{opacity:.5}
#gear{position:fixed;top:14px;right:18px;display:flex;align-items:center;gap:8px;
  padding:8px 13px;border-radius:20px;color:#8b93a0;text-decoration:none;opacity:.5;
  font:500 11px/1 inherit;letter-spacing:.14em;text-transform:uppercase;
  border:1px solid transparent;transition:opacity .2s,color .2s,border-color .2s,background .2s}
#gear:hover{opacity:1;color:#f2efe9;border-color:#262b33;background:rgba(18,21,26,.72)}
#gear svg{width:14px;height:14px;flex:none}
#gear.alert{opacity:1;color:#e8b13a;border-color:rgba(232,177,58,.32)}
#emptyState{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:32px;
  background:radial-gradient(circle at 50% 28%,rgba(216,31,74,.16),transparent 38%),#0b0d10}
#emptyState[hidden]{display:none}
#emptyCard{width:min(440px,88vw);padding:38px;border:1px solid #292d34;border-radius:28px;
  background:rgba(18,21,26,.92);text-align:center;box-shadow:0 28px 80px rgba(0,0,0,.38)}
#emptyMark{width:72px;height:72px;margin:0 auto 22px;border-radius:22px;display:grid;place-items:center;
  background:linear-gradient(145deg,#ee5b4f,#d81f6a);font-size:30px;box-shadow:0 14px 38px rgba(216,31,74,.25)}
#emptyCard h1{font-size:28px;letter-spacing:-.04em;margin-bottom:10px}
#emptyCard p{color:#9ba2ad;line-height:1.65;margin-bottom:24px}
#emptyAction{display:inline-flex;height:48px;align-items:center;padding:0 24px;border-radius:24px;
  color:#fff;text-decoration:none;background:#d81f4a;font-weight:650;box-shadow:0 8px 28px rgba(216,31,74,.3)}
#shell{display:none}
html.electron,html.electron body{background:transparent}
html.electron body{border-radius:0;overflow:hidden}
html.electron body:after{content:"";position:fixed;inset:0;border-radius:22px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.10);pointer-events:none;z-index:99}
html.electron.pet body:after{display:none}
html.electron.pet #vignette,html.electron.pet #shell,html.electron.pet #status,
html.electron.pet #gear,html.electron.pet #vz,html.electron.pet #bar{display:none}
/* The open bar must never swallow her: only the actual controls take the
   pointer, so drag, taps, head-hold, and the right-click menu keep working
   on every visible part of the avatar - including the feet behind the bar. */
html.electron.pet.chat-open #bar{display:flex;left:12px;right:12px;bottom:10px;
  padding:0;background:transparent;pointer-events:none;
  opacity:0;visibility:hidden;transition:opacity .25s ease,visibility .25s ease}
html.electron.pet.chat-open.chat-visible #bar{opacity:1;visibility:visible}
html.electron.pet.chat-open #bar #manual{pointer-events:auto}
/* De-coupled pet mode keeps the bar minimal: no EnConvo mark - coupling

function safeMarkdownHref(value){
  try{
    const url=new URL(value,location.href);
    return ['http:','https:','mailto:'].includes(url.protocol)?url.href:'';
  }catch(e){return'';}

function appendInlineMarkdown(parent,source){
  const text=String(source||'');
  const tokens=/(`[^`\n]+`|\*\*[^*\n]+\*\*|__[^_\n]+__|~~[^~\n]+~~|\[[^\]\n]+\]\([^)\s]+(?:\s+"[^"]*")?\)|\*[^*\n]+\*|_[^_\n]+_)/g;
  let cursor=0,match;
  while((match=tokens.exec(text))){
    if(match.index>cursor)parent.append(document.createTextNode(text.slice(cursor,match.index)));
    const raw=match[0];let node=null,inner='';
    if(raw.startsWith('`')){
      node=document.createElement('code');node.textContent=raw.slice(1,-1);
    }else if(raw.startsWith('**')||raw.startsWith('__')){
      node=document.createElement('strong');inner=raw.slice(2,-2);
    }else if(raw.startsWith('~~')){
      node=document.createElement('del');inner=raw.slice(2,-2);
    }else if(raw.startsWith('[')){
      const parts=raw.match(/^\[([^\]]+)\]\(([^)\s]+)(?:\s+"[^"]*")?\)$/);
      const href=parts&&safeMarkdownHref(parts[2]);
      if(href){
        node=document.createElement('a');node.href=href;node.target='_blank';
        node.rel='noopener noreferrer';appendInlineMarkdown(node,parts[1]);
      }else{
        parent.append(document.createTextNode(parts?parts[1]:raw));
      }
    }else{
      node=document.createElement('em');inner=raw.slice(1,-1);
    }
    if(node){
      if(inner)appendInlineMarkdown(node,inner);
      parent.append(node);
    }
    cursor=tokens.lastIndex;
  }
  if(cursor<text.length)parent.append(document.createTextNode(text.slice(cursor)));
}
function markdownCells(line){
  return line.trim().replace(/^\||\|$/g,'').split('|').map(cell=>cell.trim());
}
function isMarkdownTableDivider(line){
  return /^\s*\|?\s*:?-{3,}:?\s*(?:\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(line);
}
function renderMarkdown(source,target){
  const lines=String(source||'').replace(/\r\n?/g,'\n').split('\n');
  let index=0;
  while(index<lines.length){
    const line=lines[index];
    if(!line.trim()){index++;continue;}
    const fence=line.match(/^\s*```([\w+-]*)\s*$/);
    if(fence){
      const code=[];index++;
      while(index<lines.length&&!/^\s*```\s*$/.test(lines[index]))code.push(lines[index++]);
      if(index<lines.length)index++;
      const pre=document.createElement('pre'),body=document.createElement('code');
      if(fence[1])body.dataset.language=fence[1];
      body.textContent=code.join('\n');pre.append(body);target.append(pre);continue;
    }
    const heading=line.match(/^\s{0,3}(#{1,6})\s+(.+)$/);
    if(heading){
      const node=document.createElement('h'+heading[1].length);
      appendInlineMarkdown(node,heading[2]);target.append(node);index++;continue;
    }
    if(/^\s{0,3}(?:-{3,}|\*{3,}|_{3,})\s*$/.test(line)){
      target.append(document.createElement('hr'));index++;continue;
    }
    if(/^\s{0,3}>/.test(line)){
      const quoted=[];
      while(index<lines.length&&/^\s{0,3}>/.test(lines[index]))
        quoted.push(lines[index++].replace(/^\s{0,3}>\s?/,''));
      const quote=document.createElement('blockquote');
      renderMarkdown(quoted.join('\n'),quote);target.append(quote);continue;
    }
    const listItem=line.match(/^\s{0,3}([-+*]|\d+[.)])\s+(.+)$/);
    if(listItem){
      const ordered=/^\d/.test(listItem[1]),list=document.createElement(ordered?'ol':'ul');
      while(index<lines.length){
        const item=lines[index].match(/^\s{0,3}([-+*]|\d+[.)])\s+(.+)$/);
        if(!item||/^\d/.test(item[1])!==ordered)break;
        const child=document.createElement('li');appendInlineMarkdown(child,item[2]);
        list.append(child);index++;
      }
      target.append(list);continue;
    }
    if(index+1<lines.length&&line.includes('|')&&isMarkdownTableDivider(lines[index+1])){
      const table=document.createElement('table'),head=document.createElement('thead');
      const headRow=document.createElement('tr');
      for(const cell of markdownCells(line)){
        const th=document.createElement('th');appendInlineMarkdown(th,cell);headRow.append(th);
      }
      head.append(headRow);table.append(head);index+=2;
      const body=document.createElement('tbody');
      while(index<lines.length&&lines[index].trim()&&lines[index].includes('|')){
        const row=document.createElement('tr');
        for(const cell of markdownCells(lines[index++])){
          const td=document.createElement('td');appendInlineMarkdown(td,cell);row.append(td);
        }
        body.append(row);
      }
      table.append(body);target.append(table);continue;
    }
    const paragraph=[];
    while(index<lines.length&&lines[index].trim()){
      if(paragraph.length&&(/^\s{0,3}(?:```|#{1,6}\s|>|[-+*]\s+|\d+[.)]\s+)/.test(lines[index])||
         /^\s{0,3}(?:-{3,}|\*{3,}|_{3,})\s*$/.test(lines[index])))break;
      paragraph.push(lines[index++].trim());
    }
    const node=document.createElement('p');appendInlineMarkdown(node,paragraph.join(' '));
    target.append(node);
  }
}

  const rawTimestamp=Number(value.timestamp);

    rawTimestamp:Date.now();
  externalAudio={
    rms:Math.max(0,+value.rms||0),peak:Math.max(0,+value.peak||0),

  const anchor=cursorFeed&&now-cursorFeed.at<400?faceAnchorCss():null;
  if(anchor){
    dx=cursorFeed.x-anchor.x;dy=cursorFeed.y-anchor.y;
    if(!speaking&&(petHit||now-cursorMovedAt<2600))target=1;
  }
  gazeAttn+=(target-gazeAttn)*(target>gazeAttn?0.10:0.03);
  if(gazeAttn<0.02)return null;
  const dirX=Math.tanh(dx/90),dirY=Math.tanh(dy/130);
  cursorDir.x+=(dirX-cursorDir.x)*0.18; // head turn follows a beat behind the eyes
  cursorDir.y+=(dirY-cursorDir.y)*0.18;
  // Very subtle on purpose: cursor-following uses only a sliver of the
  // baked travel - a glance is a couple of pixels, and the degraded outer
  // tiles are never reached.
  const rangeX=(M.gaze?Math.max(...M.gaze.dxs.map(Math.abs)):1.5)*0.28;
  const rangeY=(M.gaze?Math.max(...M.gaze.dys.map(Math.abs)):0.75)*0.38;
  const gx=dirX*rangeX,gy=dirY*rangeY;
  cursorEye.x+=(gx-cursorEye.x)*0.30;   // saccade-quick, but never a teleport
  cursorEye.y+=(gy-cursorEye.y)*0.30;
  return {x:cursorEye.x,y:cursorEye.y,w:gazeAttn};
}
function cursorHeadFor(h){
  /* The head carries the glance now, not the silhouette: it turns toward the
     cursor together with the eyes. This composes with the VOR naturally - at
     low attention the counter-rotation keeps the eyes on the lens while the
     head drifts, and at full attention the gaze blend hands the eyes to the
     cursor as the head arrives. */
  const attend=gazeAttn>.02?Math.min(1,gazeAttn):0;
  if(!attend)return h;
  // Subtle by design: the IRIS carries the cursor, the head only hints at
  // it. Tuned DOWN twice against the live desktop - 12/5/1.0 swung the
  // whole head, and even 4.5/2/0.4 slid the head visibly against the
  // static body plate, so the mask contour itself read as moving (owner,
  // 2026-08-01: "looks like there is a head contour"). A real person
  // mostly moves their eyes; the head barely breathes toward the pointer.
  h.x+=attend*cursorDir.x*1.4;
  h.y+=attend*cursorDir.y*0.6;
  h.r+=attend*cursorDir.x*0.12;
  return h;
}

/* ---- head on neck ----------------------------------------------------------
   The first version translated the WHOLE FRAME - head, shoulders, jacket and
   backdrop as one block. That is not a head moving, it is a camera moving, and
   it is precisely why she read as stiff-necked. A nod is not a nod if the
   shoulders come with it.

   A head moves by turning ON THE NECK, so the motion must TAPER: crown most,
   chin far less, collar not at all. And because a rigid rotation about a pivot
   is linear in y, that taper is exactly an AFFINE transform - one setTransform,
   no bands, no seams, no cost. The nod's foreshortening falls out of it free:
   the chin travels less than the brow, so the face shortens as it drops.

   Motion is value noise, not a sum of sines. Detuned sines never repeat, but
   they also never PAUSE, and that unbroken glide is the other half of why the
   old head felt mechanical. Noise holds still sometimes. */
function vn(t,seed){
  const i=Math.floor(t),f=t-i,u=f*f*(3-2*f);
  const h=n=>{const x=Math.sin(n*127.1+seed*311.7)*43758.5453;
              return (x-Math.floor(x))*2-1;};
  return h(i)*(1-u)+h(i+1)*u;
}

/* Nods and tilts are EVENTS, not waveforms: a damped down-and-back, and a cant
   of the head held for a beat before it relaxes. Both fire far more often while
   talking than while listening. */
const ease=t=>t*t*(3-2*t);
let nods=[],nextNod=performance.now()+1500;
let tilt={a:0,t0:-1e9,ti:400,hold:1200,to:700},nextTilt=performance.now()+3000;
let presence=.38,presenceFrom=.38,presenceTarget=.38,presenceT0=performance.now(),nextPresence=performance.now()+4200;
let weight={from:0,to:0,t0:performance.now(),duration:4200},nextWeight=performance.now()+6200;

function planPresence(now){
  presenceFrom=presence;
  const roll=Math.random();
  presenceTarget=speaking?(0.78+Math.random()*.22):
    roll<.42?(0.08+Math.random()*.16):roll<.88?(0.30+Math.random()*.32):(0.68+Math.random()*.22);
  presenceT0=now;
  nextPresence=now+(speaking?1800+Math.random()*3400:3800+Math.random()*9200);
}
function presenceAt(now){
  if(now>nextPresence)planPresence(now);
  const u=Math.min(1,(now-presenceT0)/1400);
  presence=presenceFrom+(presenceTarget-presenceFrom)*ease(u);
  return presence;
}
function planWeight(now){
  weight={from:weight.to,to:(Math.random()*2-1),t0:now,duration:3200+Math.random()*4200};
  nextWeight=now+7000+Math.random()*15000;
}
function bodyAt(now,width,height){
  if(now>nextWeight)planWeight(now);
  const u=Math.min(1,Math.max(0,(now-weight.t0)/weight.duration));
  const shift=weight.from+(weight.to-weight.from)*ease(u);
  const energy=presenceAt(now),t=now/1000;
  const breath=(.5+.5*vn(t*.19,21))*(.55+.45*vn(t*.073,22));
  return {
    x:shift*width*.0045+vn(t*.12,23)*width*.0016*energy,
    y:-breath*height*.0018,
    r:(shift*.11+vn(t*.09,24)*.055*energy)*Math.PI/180,
    sx:1+breath*.0018,
    sy:1+breath*.0034,
  };
}

/* Amplitude is in px AT THE EYES, and it has to be sized in degrees or it comes
   out invisible: the lever from eye to neck pivot is ~580px, so even a slight
   0.6 deg nod carries the eyes ~6px. A first pass at ~1px looked like nothing
   at all - that is 0.1 deg, ten times under a real one. */
function planNod(now){
  nods.push({t0:now,a:(speaking?1.0:0.6)*(4.1+Math.random()*4.7),
             d:360+Math.random()*240,n:Math.random()<0.3?2:1});
  nextNod=now+(speaking?1500+Math.random()*2800:4500+Math.random()*9000);
}
function nodAt(now){
  let v=0;
  for(const g of nods){
    const t=(now-g.t0)/g.d;
    if(t>=0&&t<g.n)v+=g.a*Math.sin(2*Math.PI*t)*Math.exp(-1.5*t);
  }
  return v;
}
function planTilt(now){
  tilt={a:(Math.random()<0.5?-1:1)*(0.25+Math.random()*0.45),t0:now,
        ti:380+Math.random()*320,hold:700+Math.random()*2300,
        to:600+Math.random()*700};
  nextTilt=now+5000+Math.random()*11000;
}
function tiltAt(now){
  const e=now-tilt.t0;if(e<0)return 0;
  if(e<tilt.ti)return tilt.a*ease(e/tilt.ti);
  if(e<tilt.ti+tilt.hold)return tilt.a;
  const k=(e-tilt.ti-tilt.hold)/tilt.to;
  return k>=1?0:tilt.a*(1-ease(k));
}
function headAt(now){
  const t=now/1000,energy=presenceAt(now);
  // The presence envelope deliberately spends long periods near stillness.
  // Noise supplies variation; the envelope supplies restraint and prevents
  // the familiar always-bobbing desktop-mascot cadence.
  return {x:energy*(3.4*vn(t*0.17,1)+1.5*vn(t*0.43,2)+0.55*vn(t*1.05,3)),
          y:energy*(2.3*vn(t*0.21,4)+1.0*vn(t*0.51,5)+0.35*vn(t*1.25,6))
            +nodAt(now),
          r:energy*(0.40*vn(t*0.11,7)+0.15*vn(t*0.33,8))+tiltAt(now)};   // degrees
}

/* ---- brow -----------------------------------------------------------------
   Humans punctuate speech with their brows almost continuously - a raise on a
   stressed word, a knit while weighing something. A frozen brow over a moving
   mouth is the second corpse tell. Two drivers: a fast follower on the audio
   level for per-syllable accents, and scheduled gestures for the deliberate
   ones. The two brows are deliberately not identical.                        */
let browAmp=0,browT0=-1e9,browDur=1,browEnv=0,nextBrow=performance.now()+2200;
let browBeat=false;   // every OTHER stressed vowel fires an accent
const BROW_ASYM=0.86+Math.random()*0.1;
// Calibration's Eyebrows / Forehead sliders are SEPARATE live runtime
// amplitudes: 55% is the tuned default, 0 stills the tissue, 100 nearly
// doubles it. They apply INSTANTLY: the calibration panel shares the
// dragged values through localStorage (same origin), so the desk answers
// while the slider moves - no rebuild, and the published profile takes
// over as the baseline whenever no live override is present.
let LIVE_RIG=null;
try{LIVE_RIG=JSON.parse(localStorage.getItem('vivieen-live-rig')||'null');}catch(e){}
addEventListener('storage',event=>{
  if(event.key!=='vivieen-live-rig')return;
  try{LIVE_RIG=JSON.parse(event.newValue||'null');}catch(error){LIVE_RIG=null;}
});
const liveRig=key=>{
  if(LIVE_RIG&&M&&M.avatar&&LIVE_RIG.slug===M.avatar.slug
     &&Number.isFinite(Number(LIVE_RIG[key])))return Number(LIVE_RIG[key]);
  return (M&&M.rig_profile&&Number(M.rig_profile[key]))||55;
};
const browGain=()=>Math.max(0,Math.min(3,liveRig('brows')/55));
const foreheadGain=()=>Math.max(0,Math.min(3,liveRig('forehead')/55));
const browRange=()=>(M&&M.brow&&M.brow.dys?Math.max(...M.brow.dys):3.5)/3.5;

// Per-gesture side bias: most gestures move both brows, some favour one -
// a single raised brow is the most human thing a face does.
let browBiasL=1,browBiasR=1;
// The knit/spread axis, independent of the raise.
let browSqAmp=0,browSqT0=-1e9,browSqDur=1;
function planBrow(now){
  const r=Math.random();
  const solo=Math.random();
  browBiasL=solo<0.16?1.35:solo>0.84?0.4:1;
  browBiasR=solo<0.16?0.4:solo>0.84?1.35:1;
  if(speaking){
    if(r<0.52){browAmp=0.9+Math.random()*1.1;browDur=260+Math.random()*360;}
    else if(r<0.80){browAmp=2.0+Math.random()*1.3;browDur=340+Math.random()*460;}
    else{browAmp=-(0.5+Math.random()*0.9);browDur=380+Math.random()*560;}
    // Sometimes the pair knits toward centre or opens instead of lifting.
    const sq=Math.random();
    if(sq<0.20){browSqAmp=1.5+Math.random()*0.9;browSqDur=420+Math.random()*520;browSqT0=now;}
    else if(sq<0.30){browSqAmp=-(1.0+Math.random()*0.7);browSqDur=460+Math.random()*540;browSqT0=now;}
    // A livelier brow also gestures more OFTEN, not only harder.
    nextBrow=now+(650+Math.random()*1700)/Math.max(0.55,browGain());
  }else{
    if(r<0.55){browAmp=0.5+Math.random()*0.8;browDur=420+Math.random()*700;}
    else if(r<0.82){browAmp=-(0.4+Math.random()*0.7);browDur=600+Math.random()*900;}
    else{browAmp=1.4+Math.random()*1.1;browDur=350+Math.random()*450;}
    nextBrow=now+2400+Math.random()*4600;
  }
  browT0=now;
}
function browGesture(now){
  const ms=now-browT0;
  if(ms<0||ms>browDur+320)return 0;
  const u=Math.min(1,ms/130),rise=u*u*(3-2*u);   // muscle, not a step function
  const f=ms>browDur?Math.max(0,1-(ms-browDur)/300):1;
  return browAmp*rise*f*f;
}
function browSqueezeFor(now){
  const ms=now-browSqT0;
  if(ms<0||ms>browSqDur+420)return 0;
  const u=Math.min(1,ms/170),rise=u*u*(3-2*u);
  const f=ms>browSqDur?Math.max(0,1-(ms-browSqDur)/400):1;
  return browSqAmp*rise*f*f*browGain();
}
function browFor(now,side,lid){
  const t=now/1000,k=side==='l'?BROW_ASYM:1,gain=browGain();
  const drift=0.20*Math.sin(t*0.31+(side==='l'?1.7:0))+0.11*Math.sin(t*0.73);
  const reach=browRange(),bias=side==='l'?browBiasL:browBiasR;
  const v=((browGesture(now)*bias+1.1*browEnv)*k*gain+drift*(0.5+0.5*gain))*reach-0.4*lid;
  const top=3.5*reach*Math.max(1,gain);
  return v<-1.5*reach?-1.5*reach:v>top?top:v;

/* The forehead is NOT the brow: heavier skin that only engages past a real
   raise (small flicks stay brow-only), saturates instead of tracking
   linearly, barely follows a frown, and both rises and settles a beat
   behind. Two tissues, two behaviours - not one sliding plate. */
let foreheadLift=0;
function foreheadFor(bv){
  const reach=browRange(),engage=0.8*reach;
  const b=(bv.l+bv.r)/2,gain=foreheadGain();
  const target=(b>engage?Math.tanh((b-engage)*0.5/reach)*1.8*reach
    :b<-0.6*reach?Math.tanh((b+0.6*reach)*0.4/reach)*0.7*reach:0)*gain;
  foreheadLift+=(target-foreheadLift)*(target>foreheadLift?0.10:0.045);
  return foreheadLift;

/* ---- cheek ----------------------------------------------------------------
   The warmth cue, and the one layer that could not be built the obvious way: a
   warp of bare cheek skin is invisible, because there is no texture there to
   carry a two-pixel shift. What actually shows a cheek raise is the structure
   along its TOP edge - the lower lid margin lifting, the lash line with it - so
   the layer is anchored there and fades downward over the malar.

   SECOND CUT. The first version drove this off LOUDNESS, through two more
   low-passes stacked on an already smoothed level, then snapped the result to a
   0.65px ladder. Through continuous speech the value sat at sd 0.27px - under
   half a step - so the painted state never moved: 0.51 changes per second
   against the brow's 4.98. A cheek that holds still while the mouth works is
   the tell, and no amount of extra gain on a DC signal fixes it.

   Loudness was the wrong driver anyway. The malar is dragged by the LIP
   CORNERS, so the apple follows the SHAPE of the mouth: wide spreads (E, ih,
   SS, CH) haul it up, an open aa stretches it up and out over the zygomatic,
   rounded oh/ou hollow it, and PP/FF recruit no cheek at all. Loudness only
   decides how hard each shape is hit. So the target is a per-viseme
   coefficient riding the same cross-fade the lips ride, and the follower is
   quick enough to keep up with a syllable - about 55ms to recruit and 130ms to
   let go, because muscle pulls faster than it releases.

   It idles just off zero rather than at zero: a face held at dead neutral is
   the resting state of someone who has stopped listening. */
const CHEEK_V={sil:0,PP:.05,FF:.10,TH:.22,DD:.26,kk:.30,CH:.62,SS:.58,nn:.24,
               RR:.14,aa:.55,E:.85,ih:.72,oh:.20,ou:.06};
const CHEEK_ASYM=0.93+Math.random()*0.06;  // two cheeks are never a matched pair
let cheek=0,cheekT=-1;
const JAW_V={sil:0,PP:0,FF:.10,TH:.16,DD:.18,kk:.28,CH:.16,SS:.12,nn:.14,
             RR:.13,aa:1,E:.62,ih:.38,oh:.56,ou:.20};
let jaw=0,jawT=-1;
/* ---- idle life -------------------------------------------------------------
   A standing-by face that only blinks reads as a photograph. Between replies
   the mouth keeps living at whisper level: a breathing-rate sway in the jaw,
   and every so often a soft lip press / parting / swallow - one of the real
   viseme plates washed over the resting mouth at 15-30% alpha. Subtle enough
   to read as presence, never as speech.                                     */
let idleShape=null,idleT0=-1e9,idleDur=1,idleAmp=0;
let nextIdleMouth=performance.now()+3000+Math.random()*3000;
function idleEnv(now){
  const t=(now-idleT0)/idleDur;
  return (t>0&&t<1)?Math.sin(Math.PI*t):0;
}
function idleMouthFor(now){
  if(speaking||recording){nextIdleMouth=now+3000+Math.random()*4000;return null;}
  if(now>=nextIdleMouth){
    const r=Math.random();
    // Presses, swallows and tension carry the strongest wash; the parted
    // shapes ('ih', 'E') run strong enough that a hint of teeth shows
    // through the opening - deliberate now, but still under half opacity
    // so it reads as a breath apart, never the start of a word.
    idleShape=r<0.25?'PP':r<0.50?'ih':r<0.65?'E':r<0.85?'SS':'nn';
    idleAmp=(idleShape==='ih'||idleShape==='E')
      ?0.32+Math.random()*0.16:0.42+Math.random()*0.22;
    idleDur=1000+Math.random()*1300;
    idleT0=now;
    nextIdleMouth=now+3800+Math.random()*6000;
  }
  const env=idleEnv(now);
  if(!env||!idleShape||!IMG[idleShape])return null;
  return {img:IMG[idleShape].open,a:idleAmp*env*env};
}
function idleJawDrift(now){
  // breathing sway around half a pixel, leaning firmly into each gesture
  return 0.17+0.12*vn(now/1000*0.09,17)+0.34*idleEnv(now);
}
function jawFor(now,mix){
  const a=JAW_V[prevV]||0,b=JAW_V[curV]||0;
  const shape=a+(b-a)*mix;
  const target=(speaking?shape:idleJawDrift(now))*(0.70+0.30*Math.min(1,lvl*6));
  const dt=jawT<0?16:Math.min(80,now-jawT);jawT=now;
  jaw+=(target-jaw)*(1-Math.exp(-dt/(target>jaw?55:95)));
  return jaw*2.4;
}
function cheekFor(now,lid,mix){
  const top=(M.cheek&&M.cheek.ups[M.cheek.ups.length-1])||2.7;
  let tgt;
  if(speaking){
    const a=CHEEK_V[prevV]||0,b=CHEEK_V[curV]||0;
    const shape=a+(b-a)*mix;                 // the same dissolve the lips ride
    tgt=top*(0.14+0.86*shape)*(0.55+0.65*Math.min(1,lvl*7))+0.22*browEnv;
  }else{
    // idle: a slow wander plus a lift that rides each mouth micro-gesture,
    // so the cheeks visibly live between replies instead of freezing
    tgt=top*(0.10+0.24*(vn(now/1000*0.20,11)+1)/2+0.38*idleEnv(now));
  }
  const dt=cheekT<0?16:Math.min(80,now-cheekT);cheekT=now;
  cheek+=(tgt-cheek)*(1-Math.exp(-dt/(tgt>cheek?55:130)));
  const v=cheek+0.30*lid;              // a blink squeezes the lower lid up too
  return v<0?0:v>top?top:v;
}

/* Nearest baked state, no cross-fade. Blending two baked warps doubles every
   hard edge inside the patch at partial alpha - the limbus for gaze, the brow
   hairs for brow. Both grids are fine enough (a quarter pixel, half a pixel)
   that snapping is below the threshold for seeing steps but well above the
   threshold for seeing a double image. */
function nearest(vals,v){
  let i=0,d=1e9;
  for(let j=0;j<vals.length;j++){const e=Math.abs(vals[j]-v);if(e<d){d=e;i=j;}}
  return i;

/* Everything below draws in KEYFRAME pixels. The canvas fit and the head-on-neck
   affine are already on the context, so a patch just goes at its own box and is
   carried, sheared and tapered exactly as the face under it is. */
function drawSnap(img,geom,vals,v,row){
  if(!img)return;
  const g=geom.box,ew=g[2],eh=g[3];
  ctx.drawImage(img,0,(nearest(vals,v)+(row||0)*vals.length)*eh,ew,eh,
                g[0],g[1],ew,eh);
}

/* Anatomical order, and it matters: the brow slides the skin, the cheek lifts
   the lid margin from below, the eyeball turns under both, and the lid occludes
   the eyeball. Paint them in any other order and a blink stamps the eyes back
   to centre. */
function drawFace(lids,gv,bv,ck){
  if(M.brow){
    // Row = the knit/spread state (older banks carry a single row).
    const sqs=M.brow.sqs||[0];
    const sqRow=sqs.length>1?nearest(sqs,browSqueezeFor(performance.now())):0;
    for(const s of ['l','r'])
      drawSnap(BW[s],M.brow[s],M.brow.dys,bv[s],sqRow);
  }
  // The infraorbital band rides the cheek envelope, scaled into its own
  // shallower travel table - the one patch of face no layer used to touch.
  if(M.eyebag){
    const ebTop=(M.eyebag.ups&&M.eyebag.ups[M.eyebag.ups.length-1])||2.3;
    const ckTop=(M.cheek&&M.cheek.ups&&M.cheek.ups[M.cheek.ups.length-1])||2.7;
    for(const s of ['l','r'])
      drawSnap(EB[s],M.eyebag[s],M.eyebag.ups,ck[s]*ebTop/ckTop,0);
  }
  if(M.cheek)for(const s of ['l','r'])
    drawSnap(CK[s],M.cheek[s],M.cheek.ups,ck[s],0);

    const row=nearest(M.gaze.dys,gv.y);
    for(const s of ['l','r'])drawSnap(GZ[s],M.gaze[s],M.gaze.dxs,gv.x,row);
  }
  drawEyes(lids);
}

function drawEyes(lids){
  const st=M.eyes.states,n=st.length;
  for(const side of ['l','r']){
    const img=EYE[side],L=lids[side];
    if(!img||L<=0.004)continue;
    const g=M.eyes[side].box,ew=g[2],eh=g[3];
    let hi=0;while(hi<n-1&&st[hi]<L)hi++;         // straddle the two nearest states
    const lo=hi-1,a=lo<0?L/st[0]:(L-st[lo])/(st[hi]-st[lo]);
    if(lo>=0)ctx.drawImage(img,0,lo*eh,ew,eh,g[0],g[1],ew,eh);
    ctx.globalAlpha=a<0?0:a>1?1:a;
    ctx.drawImage(img,0,hi*eh,ew,eh,g[0],g[1],ew,eh);
    ctx.globalAlpha=1;
  }
}
const td=new Uint8Array(2048),fd=new Uint8Array(512);

function level(){
  if(monitorEnabled)return externalAudio.rms;
  if(!analyser)return 0;
  analyser.getByteTimeDomainData(td);
  let s=0;for(let i=0;i<td.length;i++){const v=(td[i]-128)/128;s+=v*v;}
  return Math.sqrt(s/td.length);
}

function availablePose(...names){
  const valid=new Set((M&&M.visemes)||[]);
  return names.find(name=>valid.has(name))||'sil';
}
function byExternalEnergy(){
  /* Spectral ratios only decide the shape. Loudness must never pick viseme
     identity - volume ripple inside a single vowel would flip the mouth and
     reset the vote (51 of the 234 measured flips came from RMS crossing
     0.045 while the spectrum stayed put). Loudness already drives jaw
     opening through lvl in jawFor(); the 0.0025 floor only gates silence. */
  if(!externalAudio.active||externalAudio.rms<0.0025)return'sil';
  const total=externalAudio.low+externalAudio.mid+externalAudio.high+1e-6;
  const low=externalAudio.low/total,mid=externalAudio.mid/total,high=externalAudio.high/total;
  if(high>0.43||externalAudio.zcr>0.16)
    return availablePose(high>0.54?'SS':'CH','E','ih');
  if(low>0.58)return availablePose(mid>0.24?'aa':'oh','ou','ih');
  if(mid>0.40)return availablePose(high>0.22?'E':'ih','aa');
  return availablePose(low>0.45?'oh':'ou','ih');
}

/* fallback only: no track, so infer a coarse shape from spectrum */
function byEnergy(){
  if(lvl<0.035)return'sil';
  analyser.getByteFrequencyData(fd);

   real iPhone her voice decoded, scheduled and lip-synced in perfect time
   with nothing reaching the speaker. The Simulator hid it entirely.
   Where the native player exists, WebAudio keeps the job it is good at,
   the CLOCK that drives her mouth, and the samples go to the app.  */
const NATIVE_SPEECH=()=>Boolean(window.webkit&&webkit.messageHandlers&&

/* WAV in, raw PCM16 out: the native player wants samples, not a header. */
function pcmFromWav(bytes){
  let at=12;
  while(at+8<=bytes.length){
    const id=String.fromCharCode(bytes[at],bytes[at+1],bytes[at+2],bytes[at+3]);
    const size=bytes[at+4]|(bytes[at+5]<<8)|(bytes[at+6]<<16)|(bytes[at+7]<<24);
    if(id==='data')return bytes.subarray(at+8,Math.min(bytes.length,at+8+size));
    at+=8+size+(size&1);
  }
  return bytes.subarray(44);
}

async function speak(b64,tr){
  actx=actx||new AudioContext();

  src.connect(analyser);analyser.connect(audioSink());

  audioT0=actx.currentTime+0.06;

/* ---- the coupled channel ----------------------------------------------
   An EnConvo agent can work for minutes. Telegram's channel shows "typing"
   and, in verbose mode, narrates each step; the pocket thread does exactly
   that, and takes the same slash commands. */
function threadWorking(){
  const container=document.getElementById('thread');
  const card=document.createElement('div');
  card.className='msg her working';
  const dots=document.createElement('div');
  dots.className='typing';
  dots.innerHTML='<span></span><span></span><span></span>';
  card.append(dots);
  if(IS_IOS){container.append(card);threadToBottom(false);}
  card.addStep=label=>{
    if(ENCONVO.verbose===false)return;
    const line=document.createElement('div');
    line.className='step';line.textContent=label;
    card.append(line);
    if(threadNearBottom(container))threadToBottom(false);
  };
  // Her sentence as she writes it - a channel sends the reply in pieces,
  // it does not sit silent and then paste a wall.
  let live=null,written='';
  card.addText=piece=>{
    // A step after some prose starts a NEW paragraph; she is narrating in
    // order, so the card has to read in order too.
    if(live&&live!==card.lastElementChild){live=null;written='';}
    written+=piece;
    if(!live){
      live=document.createElement('div');
      live.className='live';card.append(live);
      dots.remove();
    }
    live.textContent=written;
    if(threadNearBottom(container))threadToBottom(false);
  };
  return card;
}
async function enconvoStream(body,work,attempt=0){
  let response;
  try{
    response=await fetch('api/enconvo/chat',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body),signal:ENCONVO.abort&&ENCONVO.abort.signal});
  }catch(error){
    // "Load failed" is WebKit's word for a dropped connection - a long
    // agent turn over the LAN, a moment of Wi-Fi, a backgrounded app.
    // The agent kept its session, so one quiet retry usually lands
    // (owner, 2026-08-03).
    if(attempt<1&&error.name!=='AbortError'){
      work.addStep('reconnecting…');
      await new Promise(r=>setTimeout(r,1200));
      return enconvoStream(body,work,attempt+1);
    }
    throw new Error(error.name==='AbortError'?'stopped'
      :'the line to the Mac dropped ('+(error.message||error)+')');
  }
  if(!response.body)return await response.json();
  const reader=response.body.getReader(),decoder=new TextDecoder();
  let buffer='',result=null;
  for(;;){
    const{done,value}=await reader.read();
    if(done)break;
    buffer+=decoder.decode(value,{stream:true});
    let cut;
    while((cut=buffer.indexOf('\n\n'))>=0){
      const frame=buffer.slice(0,cut);buffer=buffer.slice(cut+2);
      if(!frame.startsWith('data:'))continue;
      let event;try{event=JSON.parse(frame.slice(5).trim());}catch(x){continue;}
      if(event.type==='step')work.addStep(event.text);
      else if(event.type==='say')work.addText(event.text);
      else if(event.type==='error')throw new Error(event.detail||'agent failed');
      else if(event.type==='done')result=event;
    }
  }
  if(!result)throw new Error('the agent closed without answering');
  return result;
}
// The same commands EnConvo's own channels take (launch_channel.js):
// /new · /stop · /audio · /verbose · /status.
function enconvoSlash(text){
  const[word,...rest]=String(text).trim().toLowerCase().split(/\s+/);
  const onOff=value=>value==='off'?false:value==='on'?true:null;
  const say=line=>{threadPush('her',line);setCaption(line);};
  if(word==='/new'||word==='/newsession'){
    ENCONVO.sessions[ENCONVO.agent]='';
    say('· new session with '+(ENCONVO.title||ENCONVO.agent)+' ·');
  }else if(word==='/stop'){
    if(ENCONVO.abort){ENCONVO.abort.abort();}
    else say('· nothing running ·');
  }else if(word==='/audio'){
    const want=onOff(rest[0]);
    ENCONVO.audio=want===null?ENCONVO.audio===false:want;
    say('· voice '+(ENCONVO.audio===false?'off':'on')+' ·');
  }else if(word==='/verbose'){
    const want=onOff(rest[0]);
    ENCONVO.verbose=want===null?ENCONVO.verbose===false:want;
    say('· step updates '+(ENCONVO.verbose===false?'off':'on')+' ·');
  }else if(word==='/status'){
    say(['**'+(ENCONVO.title||ENCONVO.agent)+'**','',
      '- session · '+(ENCONVO.sessions[ENCONVO.agent]?'open':'new on next message'),
      '- voice · '+(ENCONVO.audio===false?'off':'on'),
      '- step updates · '+(ENCONVO.verbose===false?'off':'on'),
      '- running · '+(ENCONVO.abort?'yes':'no')].join('\n'));
  }else return false;
  ptt.disabled=monitorEnabled;
  return true;
}
async function turn(text,spoken=false){
  ptt.disabled=true;elYou.textContent=text;setCaption('');
  threadPush('user',text);
  setStatus('thinking','busy');
  // Coupled to an EnConvo agent: the message goes to that brain through
  // the Mac's gateway, and the reply comes home in HER voice.
  if(window.ENCONVO&&ENCONVO.agent){
    if(enconvoSlash(text)){ptt.disabled=monitorEnabled;return;}
    const work=threadWorking();
    try{
      setStatus('asking '+(ENCONVO.title||'the agent'),'busy');
      ENCONVO.abort=new AbortController();
      const r=await enconvoStream({agent:ENCONVO.agent,message:text,
        session_id:ENCONVO.sessions[ENCONVO.agent]||'',
        context_files:ENCONVO.pending||[]},work);
      ENCONVO.pending=[];
      work.remove();
      if(r.detail)throw new Error(r.detail);
      if(r.session_id)ENCONVO.sessions[ENCONVO.agent]=r.session_id;
      setCaption(r.text);
      threadPush('her',r.text);
      // Anything she made or fetched arrives as a card you can play right
      // here - the prose may never have read like a link.
      threadAttachments(r.media);
      if(r.audio&&ENCONVO.audio!==false){
        setStatus('speaking','on');await speak(r.audio,r.track);}
      setStatus('coupled · '+(ENCONVO.title||ENCONVO.agent),'on');
    }catch(e){
      work.remove();
      if(e.name==='AbortError'){
        threadPush('her','· stopped ·');setStatus('coupled','on');
      }else{
        setCaption('(agent trouble: '+e.message+')');
        threadPush('her','(agent trouble: '+e.message+')');
        setStatus('ready','on');
      }
    }
    ENCONVO.abort=null;
    ptt.disabled=monitorEnabled;
    return;
  }
  history.push({role:'user',content:text});
  let llmRoute=null;
  try{
    const r=await(await fetch('reply',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({history})})).json();
    llmRoute=r.llm_route||null;
    history.push({role:'assistant',content:r.text});
    // A pet-initiated question deserves a spoken answer even while the
    // monitor is lip-syncing EnConvo; only unspoken chat turns defer to it.
    if(monitorEnabled&&!spoken){renderMonitorStatus();return;}
    setCaption(r.text);
    threadPush('her',r.text);
    // Her own hands, uncoupled: an image or clip she made this turn
    // arrives as a playable card, same as the coupled lane.
    threadAttachments(r.media);
    setStatus('speaking','on');
    await speak(r.audio,r.track);
  }catch(e){setCaption('(something broke: '+e.message+')');
    threadPush('her','(something broke: '+e.message+')');}
  if(monitorEnabled)renderMonitorStatus();else setStatus(routedStatus(llmRoute),'on');
  ptt.disabled=monitorEnabled;
}

let rec=null,chunks=[],recording=false,recWanted=false,providerReady=false;
async function startRec(force=false){
  // Monitor mode locks the chat button, but head push-to-talk on the pet
  // must still work while she lip-syncs EnConvo, so it forces past the lock.
  if(recording||(!force&&(monitorEnabled||ptt.disabled)))return;
  // On the phone the page is an insecure origin, so getUserMedia is not
  // there at all - the native microphone bridge is the only real one.
  if(NATIVE_MIC()){startNativeRec();return;}
  recWanted=true;
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:true});}
  catch(e){
    // The refusal must be unmissable: the wave just flashed and died, and a
    // silent reset here reads as "nothing happened". In dev launches macOS
    // attributes the microphone to the TERMINAL that spawned Electron, so
    // name the launching app, not just Vivieen.
    document.documentElement.classList.remove('listening');
    setStatus('microphone blocked','');
    flashPrompt('Microphone blocked · System Settings → Privacy & Security → Microphone');
    if(SHELL&&SHELL.isElectron&&typeof SHELL.showSpeechBubble==='function'){
      SHELL.showSpeechBubble('I could not reach the microphone. In System '
        +'Settings → Privacy & Security → Microphone, allow Vivieen - or, if '
        +'you launched me from a terminal, allow that terminal app - then '
        +'hold my head again.');
    }
    return;
  }
  if(!recWanted){
    // Released before the microphone resolved: do not start a ghost take.
    // Bluetooth microphones can take seconds to open, so say why nothing
    // was heard instead of resetting silently.
    stream.getTracks().forEach(t=>t.stop());
    document.documentElement.classList.remove('listening');
    flashPrompt('Released too soon · hold while the wave pulses, speak, then release');
    return;
  }
  rec=new MediaRecorder(stream);chunks=[];
  // The chip's bars follow the real take: a light analyser rides the same
  // stream the recorder captures, feeding MIC_LEVEL until the take ends.
  try{
    actx=actx||new AudioContext();
    const meterSrc=actx.createMediaStreamSource(stream);
    const meter=actx.createAnalyser();meter.fftSize=512;
    meterSrc.connect(meter);
    const sample=new Uint8Array(meter.fftSize);
    const pump=()=>{
      if(!rec||rec.state!=='recording'&&rec.state!=='paused'){
        try{meterSrc.disconnect();}catch(e){}
        window.MIC_LEVEL=0;return;
      }
      meter.getByteTimeDomainData(sample);
      let sum=0;
      for(let i=0;i<sample.length;i+=2){
        const v=(sample[i]-128)/128;sum+=v*v;
      }
      window.MIC_LEVEL=Math.sqrt(sum/(sample.length>>1));
      requestAnimationFrame(pump);
    };
    setTimeout(pump,60);
  }catch(e){}
  openDictationStream();
  rec.ondataavailable=e=>{
    chunks.push(e.data);
    // The WebM header lives in the FIRST chunk, so the stream must always
    // start from chunk zero: while the socket is connecting the chunks
    // accumulate and flush in order on open. Only a dead socket falls back
    // to batch interim transcription.
    if(dictationSocket&&dictationSocket.readyState<=1)flushDictationStream();
    else interimTranscribe();
  };
  rec.onstop=async()=>{
    stream.getTracks().forEach(t=>t.stop());
    if(recDiscard){
      // Slide-up cancel on the talk bar: the take dies here, nothing is
      // transcribed, nothing is sent.
      recDiscard=false;
      closeDictationStream();
      txt.value='';autoSizeTxt();
      setStatus('ready','on');ptt.disabled=monitorEnabled;
      return;
    }
    const blob=new Blob(chunks,{type:rec.mimeType||'audio/webm'});
    if(blob.size<3000){
      closeDictationStream();
      setStatus('ready','on');ptt.disabled=monitorEnabled;
      flashPrompt('Too short · hold, speak while the wave pulses, then release');
      return;
    }
    ptt.disabled=true;setStatus('transcribing','busy');
    try{
      // The realtime stream already heard everything; ask it to finish.
      // Anything else - stream unavailable, errored, or slow to finalise -
      // falls back to one batch pass over the whole take.
      let heard=await finishDictationStream();
      if(!heard){
        const fd2=new FormData();fd2.append('audio',blob,'a.webm');
        const r=await(await fetch('stt',{method:'POST',body:fd2})).json();
        heard=String(r.text||'').trim()||txt.value.trim();
      }
      if(!heard){
        setStatus('ready','on');ptt.disabled=monitorEnabled;
        flashPrompt('I could not hear words in that · try again');
        return;
      }
      txt.value='';autoSizeTxt();
      await turn(heard,true);
    }catch(e){setStatus('ready','on');ptt.disabled=monitorEnabled;}
    finally{closeDictationStream();}
  };
  // Timesliced so dictation can stream: chunks feed the realtime socket (or
  // the batch fallback) and the words land live in the input field.
  rec.start(280);recording=true;ptt.classList.add('rec');txt.classList.add('rec');
  document.documentElement.classList.add('listening');
  setStatus('listening','rec');
}
/* ---- live dictation stream ------------------------------------------------
   The server bridges to the dictation provider's realtime WebSocket API
   (Soniox stt-rt); the words stream into the input field while the head is
   held. When the bridge is unavailable the batch interim path takes over. */
let dictationSocket=null,dictationLive=false,dictationFinish=null,dictationSent=0;
function flushDictationStream(){
  if(!dictationSocket||dictationSocket.readyState!==1)return;
  while(dictationSent<chunks.length)dictationSocket.send(chunks[dictationSent++]);
}
function openDictationStream(){
  if(monitorEnabled||dictationSocket)return;
  dictationSent=0;
  try{
    const ws=new WebSocket(
      (location.protocol==='https:'?'wss://':'ws://')+location.host+'/stt/stream');
    ws.binaryType='arraybuffer';
    ws.onmessage=event=>{
      let payload=null;
      try{payload=JSON.parse(event.data);}catch(error){return;}
      if(payload.error){dictationLive=false;return;}
      dictationLive=true;
      if(typeof payload.text==='string'&&recording&&payload.text){
        txt.value=payload.text;autoSizeTxt();
      }
      if(payload.finished&&dictationFinish)dictationFinish(String(payload.final||'').trim());
    };
    ws.onerror=()=>{dictationLive=false;};
    ws.onclose=()=>{
      if(dictationFinish)dictationFinish('');
      if(dictationSocket===ws)dictationSocket=null;
    };
    ws.onopen=()=>{dictationLive=true;flushDictationStream();};
    dictationSocket=ws;
  }catch(error){dictationSocket=null;dictationLive=false;}
}
function finishDictationStream(){
  if(!dictationSocket||!dictationLive||dictationSocket.readyState!==1){
    return Promise.resolve('');
  }
  return new Promise(resolve=>{
    const settle=value=>{dictationFinish=null;clearTimeout(timer);resolve(value);};
    const timer=setTimeout(()=>settle(''),6000);
    dictationFinish=settle;
    try{
      flushDictationStream();
      dictationSocket.send(new ArrayBuffer(0));
    }catch(error){settle('');}
  });
}
function closeDictationStream(){
  dictationFinish=null;
  dictationLive=false;
  if(dictationSocket){
    try{dictationSocket.close();}catch(error){}
    dictationSocket=null;
  }
}
let interimBusy=false;
async function interimTranscribe(){
  // Live dictation: while the head is held, keep sending the take so far
  // through the configured dictation model and show the words in the input
  // field. One request in flight at a time; the final pass on release is
  // authoritative. WebM slices only decode from the first chunk, so the
  // accumulated blob is always sent whole.
  if(!recording||interimBusy||monitorEnabled)return;
  const blob=new Blob(chunks,{type:(rec&&rec.mimeType)||'audio/webm'});
  if(blob.size<3000)return;
  interimBusy=true;
  try{
    const fd=new FormData();fd.append('audio',blob,'a.webm');
    const r=await(await fetch('stt',{method:'POST',body:fd})).json();
    if(recording&&r.text){txt.value=String(r.text).trim();autoSizeTxt();}
  }catch(e){/* interim only; the final pass reports real failures */}
  interimBusy=false;
}
/* ---- hold-to-talk, natively ------------------------------------------
   The phone loads the Mac over plain http on a LAN address, which is an
   INSECURE ORIGIN: navigator.mediaDevices simply does not exist there, so
   every hold fell into the getUserMedia catch and showed a macOS-worded
   "microphone blocked" while iOS permission was plainly granted (owner
   screenshot, 2026-08-03). The native bridge already has the real
   microphone - use it, collect PCM, and post one WAV when the finger
   lifts. */
const NATIVE_MIC=()=>Boolean(window.webkit&&webkit.messageHandlers&&
  webkit.messageHandlers.mic);
const PTT={on:false,chunks:[],rate:16000};
function wavFromPcm(chunks,rate){
  let total=0;
  chunks.forEach(c=>{total+=c.length;});
  const pcm=new Int16Array(total);
  let at=0;
  chunks.forEach(c=>{pcm.set(c,at);at+=c.length;});
  const bytes=pcm.length*2,buffer=new ArrayBuffer(44+bytes);
  const view=new DataView(buffer);
  const ascii=(off,text)=>{for(let i=0;i<text.length;i++)
    view.setUint8(off+i,text.charCodeAt(i));};
  ascii(0,'RIFF');view.setUint32(4,36+bytes,true);ascii(8,'WAVE');
  ascii(12,'fmt ');view.setUint32(16,16,true);
  view.setUint16(20,1,true);view.setUint16(22,1,true);
  view.setUint32(24,rate,true);view.setUint32(28,rate*2,true);
  view.setUint16(32,2,true);view.setUint16(34,16,true);
  ascii(36,'data');view.setUint32(40,bytes,true);
  new Int16Array(buffer,44).set(pcm);

}
function startNativeRec(){
  PTT.on=true;PTT.chunks=[];

  document.documentElement.classList.add('listening');
  ptt.classList.add('rec');txt.classList.add('rec');
  window.__vivMicData=chunk=>{
    if(!PTT.on)return;
    const bin=atob(chunk),n=bin.length&~1;
    const pcm=new Int16Array(n>>1);
    let sum=0;
    for(let i=0;i<pcm.length;i++){
      pcm[i]=(bin.charCodeAt(2*i)|(bin.charCodeAt(2*i+1)<<8))<<16>>16;
      const v=pcm[i]/32768;sum+=v*v;
    }
    window.MIC_LEVEL=Math.sqrt(sum/Math.max(1,pcm.length));
    PTT.chunks.push(pcm);
  };

}
async function stopNativeRec(){
  if(!PTT.on)return;
  PTT.on=false;recording=false;recWanted=false;

  let frames=0;
  chunks.forEach(c=>{frames+=c.length;});
  if(frames<PTT.rate*0.25){

    setStatus('ready','on');return;
  }
  setStatus('transcribing','busy');
  try{
    const body=new FormData();
    body.append('audio',wavFromPcm(chunks,PTT.rate),'take.wav');
    const r=await(await fetch('stt',{method:'POST',body})).json();
    const heard=String(r.text||'').trim();
    if(!heard){flashPrompt('I did not catch that');setStatus('ready','on');return;}
    await turn(heard,true);
  }catch(error){
    flashPrompt('Could not transcribe: '+String(error.message||error).slice(0,70));

  const box=controlRow.getBoundingClientRect();

  const classes=document.documentElement.classList;

  if(!classes.contains('chat-open')||!classes.contains('chat-visible'))return false;
  if(pointer.x<0||pointer.y<0)return false;
  for(const id of ['monitor','manual']){
    const control=document.getElementById(id);
    if(!control)continue;

function updatePetHit(force=false){
  if((!SHELL||!SHELL.isElectron)&&!IS_IOS)return;
  if(!PET.enabled)return;
  const now=performance.now();if(!force&&now-lastHitCheck<34)return;lastHitCheck=now;
  // `recording` pins the claim: mid-hold the cursor may slip off the body,
  // and losing interactivity there loses the release that ends the take.
  const modalHit=pointerOverChatControls()||recording||!document.getElementById('emptyState').hidden;
  let sample=modalHit;
  if(!sample&&domVideo.el&&pointer.x>=0){
    // Clip mode: the canvas is empty, the figure IS the video element.
    const box=domVideo.el.getBoundingClientRect();
    sample=pointer.x>=box.left&&pointer.x<=box.right&&
      pointer.y>=box.top&&pointer.y<=box.bottom;
  }else if(!sample&&ready&&pointer.x>=0&&pointer.y>=0&&pointer.x<innerWidth&&pointer.y<innerHeight){
    // getImageData is a GPU->CPU readback that stalls the whole canvas
    // pipeline - at 30Hz it was a measurable slice of the standby burn. A
    // stationary cursor reuses its last sample; only movement pays.
    const still=Math.abs(pointer.x-hitSamplePoint.x)<2&&
      Math.abs(pointer.y-hitSamplePoint.y)<2;
    if(still&&now-hitSampleAt<250){
      sample=hitSampleValue;
    }else{
      const ratio=cvScale(),x=Math.floor(pointer.x*ratio),y=Math.floor(pointer.y*ratio);
      try{sample=ctx.getImageData(x,y,1,1).data[3]>14;}catch(error){sample=false;}
      hitSampleAt=now;hitSamplePoint={x:pointer.x,y:pointer.y};hitSampleValue=sample;
    }
  }
  if(modalHit)hitConfidence=1;
  else if(force)hitConfidence=sample?1:0;
  else hitConfidence=Math.max(0,Math.min(1,hitConfidence+(sample?.32:-.08)));
  const hit=hitConfidence>=.56?true:hitConfidence<=.18?false:petHit;
  if(hit===petHit){
    if(hit)petHoverUntil=now+1400;
    // Heartbeat: the shell can flip the window to click-through on its own
    // (cursor left the window, focus dances) while this side sees "no
    // change" and stays silent - which once left the input field dead until
    // a drag jolted things. Re-sending the unchanged flag is free (the
    // shell ignores no-ops) and heals any desync within half a second.
    if(now-lastHitSentAt>500){lastHitSentAt=now;
      if(SHELL&&typeof SHELL.setPetHit==='function')SHELL.setPetHit(petHit);}
    return;
  }
  petHit=hit;if(hit)petHoverUntil=now+1400;
  lastHitSentAt=now;
  if(SHELL&&typeof SHELL.setPetHit==='function')SHELL.setPetHit(hit);
  syncPetEngagement(now);
  // Hovering her mid-walk brings her home to the standing avatar: a short
  // dwell so a cursor merely passing through does not end the stroll.

  if(hit&&PET.roam&&typeof SHELL.setPetRoam==='function'){

   move past the slop and it is a drag (origin at the press point, so nothing
   jumps); hold the HEAD still and it is push-to-talk, released to send; a
   quick release is a tap and she acknowledges it. The head is resolved
   pixel-exactly by drawing the real head mask through the same camera and
   face transforms as the visible scene and sampling one pixel - no hit boxes,
   so a hand in front of the chest still counts as body. */
let gesture=null,petHitCanvas=null,petHitCtx=null,lastTapAt=0;

function pointerOnHead(x,y){
  if(!ready||!(BODY&&HEADMASK&&M.body))return false;
  const matrix=M.body.face_transform;
  if(!matrix||matrix.length!==2)return false;
  const ratio=cvScale();
  const px=Math.floor(x*ratio),py=Math.floor(y*ratio);
  if(px<0||py<0||px>=cv.width||py>=cv.height)return false;
  if(!petHitCanvas){
    petHitCanvas=document.createElement('canvas');
    petHitCtx=petHitCanvas.getContext('2d',{willReadFrequently:true});
  }
  petHitCanvas.width=cv.width;petHitCanvas.height=cv.height;
  const width=BODY.width,height=BODY.height;
  const camera=petCamera(M.body,width,height);
  const motion=bodyAt(performance.now(),width,height);
  const bounds=M.body.bounds||[0,0,width,height];
  const pivotX=bounds[0]+bounds[2]/2,pivotY=bounds[1]+bounds[3];
  petHitCtx.setTransform(camera.scale,0,0,camera.scale,camera.x,camera.y);
  petHitCtx.translate(pivotX+motion.x,pivotY+motion.y);
  petHitCtx.rotate(motion.r);petHitCtx.scale(motion.sx,motion.sy);
  petHitCtx.translate(-pivotX,-pivotY);
  petHitCtx.transform(matrix[0][0],matrix[1][0],matrix[0][1],matrix[1][1],matrix[0][2],matrix[1][2]);
  petHitCtx.drawImage(HEADMASK,0,0,headSurface.width,headSurface.height);
  try{return petHitCtx.getImageData(px,py,1,1).data[3]>40;}catch(error){return false;}

   answer through the monitor. Unfollowed: she is fully her own - the hold
   records through Vivieen's configured ASR, the reply comes from the models
   set in her own Settings (LLM + TTS), the answer speaks into the bubble,
   and the chat bar (Hold to talk + a text field) opens under her feet for

  // Phone voice lives in the talk bar; head push-to-talk is desk-only.

/* ---- body-part hit testing -------------------------------------------------
   The skeleton baked at export classifies a click by its nearest bone
   segment, in plate coordinates recovered by inverting the same camera and
   sway transforms the scene is drawn with. The head stays mask-exact. */
function canvasToBody(x,y){
  if(!(BODY&&M.body))return null;
  const ratio=cvScale();
  const width=BODY.width,height=BODY.height;
  const camera=petCamera(M.body,width,height);
  let px=(x*ratio-camera.x)/camera.scale;
  let py=(y*ratio-camera.y)/camera.scale;
  const motion=bodyAt(performance.now(),width,height);
  const bounds=M.body.bounds||[0,0,width,height];
  const pivotX=bounds[0]+bounds[2]/2,pivotY=bounds[1]+bounds[3];
  const dx=px-(pivotX+motion.x),dy=py-(pivotY+motion.y);
  const c=Math.cos(-motion.r),s=Math.sin(-motion.r);
  return {x:(dx*c-dy*s)/motion.sx+pivotX,
          y:(dx*s+dy*c)/motion.sy+pivotY};
}
function petBodyPart(x,y){
  if(pointerOnHead(x,y))return 'head';
  // A portrait-mode avatar (no generated body yet) is essentially a face,
  // so the whole cutout counts as head and hold-to-talk works from day one.
  if(!(BODY&&HEADMASK&&M.body))return 'head';
  const joints=M.body&&M.body.pose&&M.body.pose.joints;
  const point=joints?canvasToBody(x,y):null;
  if(!point)return 'body';
  const at=name=>{const j=joints[name];return j?[j.x,j.y]:null;};
  // The mask is face-exact, but people aim for the top of the head: the
  // crown ring outside the mask is HAIR - it arms hold-to-talk exactly like
  // the head, and a double-tap there is the Show Me Some Moves gesture. A
  // circle around the nose sized by the nose-to-neck span covers it.
  {
    const nose=at('nose'),neck=at('neck');
    if(nose&&neck){
      const radius=Math.hypot(nose[0]-neck[0],nose[1]-neck[1])*1.2;
      if(Math.hypot(point.x-nose[0],point.y-nose[1])<=radius)return 'hair';
    }
  }
  const segdist=(p,a,b)=>{
    const abx=b[0]-a[0],aby=b[1]-a[1];
    const t=Math.max(0,Math.min(1,
      ((p.x-a[0])*abx+(p.y-a[1])*aby)/Math.max(1e-6,abx*abx+aby*aby)));
    return Math.hypot(p.x-(a[0]+t*abx),p.y-(a[1]+t*aby));
  };
  const candidates=[];
  for(const side of ['left','right']){
    const key='arm_'+side[0],leg='leg_'+side[0];
    const shoulder=at(side+'_shoulder'),elbow=at(side+'_elbow'),
      wrist=at(side+'_wrist'),hip=at(side+'_hip'),
      knee=at(side+'_knee'),ankle=at(side+'_ankle');
    if(elbow&&wrist){
      const tip=[wrist[0]+(wrist[0]-elbow[0])*.4,
                 wrist[1]+(wrist[1]-elbow[1])*.4];
      candidates.push([key,Math.min(segdist(point,elbow,wrist),
                                    segdist(point,wrist,tip))]);
    }
    if(shoulder&&elbow)candidates.push([key,segdist(point,shoulder,elbow)]);
    if(hip&&knee)candidates.push([leg,segdist(point,hip,knee)]);
    if(knee&&ankle)candidates.push([leg,segdist(point,knee,ankle)]);
    if(ankle){
      // The foot hangs below the ankle; favoured slightly so clicks at shoe
      // level classify as foot rather than shin.
      const heightRef=(M.body.bounds||[0,0,0,BODY.height])[3];
      const toe=[ankle[0],ankle[1]+heightRef*.055];
      candidates.push(['foot_'+side[0],segdist(point,ankle,toe)*.85]);
    }
  }
  const ls=at('left_shoulder'),rs=at('right_shoulder'),
    lh=at('left_hip'),rh=at('right_hip');
  if(ls&&rs&&lh&&rh){
    const top=[(ls[0]+rs[0])/2,(ls[1]+rs[1])/2];
    const bottom=[(lh[0]+rh[0])/2,(lh[1]+rh[1])/2];
    // The spine is favoured slightly so central clicks read as torso even
    // though the hanging arms run close beside it.
    candidates.push(['torso',segdist(point,top,bottom)*.8]);
  }
  if(!candidates.length)return 'body';
  candidates.sort((a,b)=>a[1]-b[1]);
  const bodyHeight=(M.body.bounds||[0,0,0,BODY.height])[3];
  return candidates[0][1]<=bodyHeight*.14?candidates[0][0]:'body';
}

      node=document.createElement('video');

      const name=document.createElement('div');
      name.className='name';name.textContent=item.name||item.slug;
      card.append(face,name);
      card.addEventListener('click',()=>{
        if(i!==AVFAN.front){AVFAN.front=i;avfanLayout();}
      });
      avfanDeck.append(card);
    });
    avfan.hidden=false;
    avfanLayout();
  }
  function closeAvfan(){AVFAN.open=false;avfan.hidden=true;}
  document.getElementById('avfanClose').addEventListener('click',closeAvfan);
  avfanStyle.addEventListener('click',()=>{
    AVFAN.style=AVFAN.style==='sorbet'?'noir':'sorbet';
    localStorage.setItem('viv-carousel',AVFAN.style);
    avfanLayout();
  });
  // Drag anywhere on the deck to spin it.
  let avfanDrag=null;
  avfanDeck.addEventListener('pointerdown',e=>{
    avfanDrag={x:e.clientX,moved:false};
  });
  avfanDeck.addEventListener('pointermove',e=>{
    if(!avfanDrag)return;
    const dx=e.clientX-avfanDrag.x;
    if(Math.abs(dx)>46){
      const n=AVFAN.list.length;
      AVFAN.front=((AVFAN.front-(dx>0?1:-1))%n+n)%n;
      avfanDrag={x:e.clientX,moved:true};
      avfanLayout();
    }
  });
  avfanDeck.addEventListener('pointerup',()=>{avfanDrag=null;});
  // The way in: a clean horizontal swipe across her - not a tap (face
  // play), not a vertical scroll (thread).
  let stageSwipe=null;
  cv.addEventListener('pointerdown',e=>{
    stageSwipe={x:e.clientX,y:e.clientY,t:performance.now()};
  },true);
  cv.addEventListener('pointerup',e=>{
    if(!stageSwipe||!IS_IOS)return;
    const dx=e.clientX-stageSwipe.x,dy=e.clientY-stageSwipe.y;
    const dt=performance.now()-stageSwipe.t;
    stageSwipe=null;
    if(Math.abs(dx)>70&&Math.abs(dy)<48&&dt<650)openAvfan();
  },true);
  // The rail whispers: it fades to a quarter after a few idle seconds so
  // the thread owns the full width, and any touch wakes it (owner,
  // 2026-08-02).
  const railBox=document.getElementById('rail');
  let railDimTimer=0;
  const wakeRail=()=>{
    railBox.classList.remove('dim');
    clearTimeout(railDimTimer);
    railDimTimer=setTimeout(()=>railBox.classList.add('dim'),3800);
  };
  addEventListener('pointerdown',wakeRail,true);
  wakeRail();
  // Action rail: live call, dance, walk, rest - one tap each, states lit.
  const railLive=document.getElementById('rail-live');
  const railMove=document.getElementById('rail-move');
  const railIdle=document.getElementById('rail-idle');
  railMove.addEventListener('click',()=>toggleMoveShow());
  railIdle.addEventListener('click',()=>toggleIdleShow());
  railLive.addEventListener('click',()=>{
    if(LIVE)stopLiveTalk('ended');else void startLiveTalk();
  });
  // EnConvo lane: the rail's bolt opens the agent sheet - every EnConvo
  // agent is a contact. Coupled, the thread routes to that agent through
  // the Mac's gateway and the reply leaves through HER voice.
  const railEnconvo=document.getElementById('rail-enconvo');
  const agentSheet=document.getElementById('agentsheet');
  const agentList=document.getElementById('agentlist');
  // audio and verbose default on, the way a fresh EnConvo channel starts;
  // /audio and /verbose flip them, /status reports them.
  window.ENCONVO={agent:'',title:'',sessions:{},
    audio:true,verbose:true,abort:null,pending:[]};
  const closeAgents=()=>document.documentElement.classList.remove('agents-open');
  railEnconvo.addEventListener('click',async()=>{
    if(document.documentElement.classList.contains('agents-open')){closeAgents();return;}
    document.documentElement.classList.add('agents-open');
    agentList.innerHTML='<div class="agent"><div class="who"><b>Looking for EnConvo…</b></div></div>';
    try{
      const r=await(await fetch('api/enconvo/agents')).json();
      if(!r.agents)throw new Error(r.detail||'no agents');
      agentList.replaceChildren();
      const off=document.createElement('button');
      off.type='button';off.className='agent'+(ENCONVO.agent?'':' on');
      off.innerHTML='<div class="who"><b>Vivieen herself</b><span>her own model - uncoupled</span></div>';
      off.addEventListener('click',()=>{ENCONVO.agent='';ENCONVO.title='';closeAgents();
        flashPrompt('Talking to Vivieen herself');});
      agentList.append(off);
      r.agents.forEach(agent=>{
        const row=document.createElement('button');
        row.type='button';
        row.className='agent'+(ENCONVO.agent===agent.name?' on':'');
        const face=agent.portrait?'<img src="api/enconvo/portrait?name='+
          encodeURIComponent(agent.name)+'" alt="">':'<img alt="">';
        row.innerHTML=face+'<div class="who"><b></b><span></span></div>';
        row.querySelector('b').textContent=agent.title;
        row.querySelector('span').textContent=agent.description||'EnConvo agent';
        row.addEventListener('click',()=>{
          ENCONVO.agent=agent.name;ENCONVO.title=agent.title;closeAgents();
          flashPrompt('Coupled to '+agent.title+' · she speaks for the agent now');
        });
        agentList.append(row);
      });
    }catch(error){
      agentList.innerHTML='';
      const sad=document.createElement('div');sad.className='agent';
      sad.innerHTML='<div class="who"><b>EnConvo not reachable</b><span></span></div>';
      sad.querySelector('span').textContent=String(error.message||error).slice(0,120);
      agentList.append(sad);
    }
  });
  // Zoom: the slider tops out AT the face closeup, and the closeup button
  // jumps straight there - one calibrated destination, computed from this
  // avatar's own face box so every face fills the glass the same way.
  // Tap the button again to reset (all Cmd+Shift+0 ever promised).
  const railClose=document.getElementById('rail-close');
  const railZoom=document.getElementById('rail-zoom');
  const zoomRange=document.getElementById('zoomrange');
  const faceCloseupZoom=()=>{
    if(!(BODY&&M.body))return 6;
    const width=BODY.width,height=BODY.height;
    const crop=viewCrop(M.body,width,height,'full');
    const lane=petLaneNow<1?0:petLaneNow;
    const avail=Math.max(cv.height*0.35,cv.height-lane);
    const s0=Math.min(cv.width/crop.w,avail/crop.h)*0.94;
    const face=(M.body.alignment&&M.body.alignment.face_bounds)||
      [width*.22,height*.10,width*.56,height*.42];
    // Owner-calibrated (screenshot, 2026-08-02): the ceiling is the WHOLE
    // head with its hair - the face box lands near 40% of the screen
    // height - not an eyes-only crop. Scales itself to any avatar's face
    // box and any phone's glass.
    return Math.max(1.6,Math.min(8,(cv.height*0.40)/(Math.max(1,face[3])*s0)));
  };
  const setZoom=(value,headAnchor)=>{
    IOS_ZOOM=Math.max(.6,Math.min(faceCloseupZoom(),value));
    IOS_HEAD_ANCHOR=Boolean(headAnchor)&&IOS_ZOOM>1.01;
    zoomRange.value=String(Math.round(IOS_ZOOM*100));
  };
  railClose.addEventListener('click',()=>{
    if(IOS_HEAD_ANCHOR)setZoom(1,false);else setZoom(faceCloseupZoom(),true);
  });
  railZoom.addEventListener('click',()=>{
    // One panel at a time - sliders drawn over the emoji grid was two
    // controls fighting for the same corner.
    document.documentElement.classList.remove('emoji-open');
    document.documentElement.classList.toggle('zoom-open');
  });
  zoomRange.addEventListener('input',()=>setZoom(Number(zoomRange.value)/100,
    Number(zoomRange.value)>140));
  // Picture in picture: her canvas becomes a floating video, so a live
  // call keeps its face while you use another app. Where WebKit refuses
  // stream-backed PiP (some simulators), the call STILL survives in the
  // background - the audio session carries it; PiP is just the visual.
  // The native shell owns the floating window: WebKit's own PiP refuses a
  // canvas stream, so the renderer just pumps frames over the bridge and
  // AVPictureInPictureController draws them - a real OS window you can
  // drag, resize, and slide off the edge (owner, 2026-08-02).
  const railPip=document.getElementById('rail-pip');
  const pipBridge=window.webkit&&window.webkit.messageHandlers&&
    window.webkit.messageHandlers.pip;
  let pipOn=false,pipTimer=0,pipCanvas=null;
  const pipActive=()=>pipOn;
  window.__pipStopped=()=>{pipOn=false;clearInterval(pipTimer);pipTimer=0;};
  window.__pipUnsupported=()=>{
    pipOn=false;clearInterval(pipTimer);pipTimer=0;
    // The iOS Simulator reports isPictureInPictureSupported NO - PiP is
    // a real-device feature. The call itself keeps running either way.
    flashPrompt('Floating window needs a real iPhone · your call keeps running in the background');
  };
  const pipPump=()=>{
    if(!pipBridge)return;
    if(!pipCanvas){pipCanvas=document.createElement('canvas');
      pipCanvas.width=360;pipCanvas.height=640;}
    const g=pipCanvas.getContext('2d');
    g.fillStyle='#05070a';g.fillRect(0,0,pipCanvas.width,pipCanvas.height);
    // Letterbox her stage into the little window without distortion.
    const s=Math.min(pipCanvas.width/cv.width,pipCanvas.height/cv.height);
    const w=cv.width*s,h=cv.height*s;
    try{g.drawImage(cv,(pipCanvas.width-w)/2,(pipCanvas.height-h)/2,w,h);}catch(e){}
    pipBridge.postMessage(pipCanvas.toDataURL('image/jpeg',0.6));
  };
  railPip.addEventListener('click',()=>{
    if(!pipBridge){
      flashPrompt('Floating window needs the iPhone app');
      return;
    }
    if(pipOn){pipBridge.postMessage('stop');window.__pipStopped();return;}
    pipOn=true;
    pipPump();
    clearInterval(pipTimer);
    pipTimer=setInterval(pipPump,125);
    pipBridge.postMessage('start');
  });
  // Opacity: her whole stage fades - handy when she sits over your reading.
  const alphaRange=document.getElementById('alpharange');
  const stage=document.getElementById('stage');
  alphaRange.addEventListener('input',()=>{
    IOS_ALPHA=Number(alphaRange.value)/100;
    stage.style.opacity=String(IOS_ALPHA);
    if(domVideo.el)domVideo.el.style.opacity=String(IOS_ALPHA);
  });
  setInterval(()=>{
    const now=performance.now();
    // The slider's right edge IS the face closeup - recalibrated once the
    // body plate lands (its face box sets the ceiling per avatar).
    const ceiling=String(Math.round(faceCloseupZoom()*100));
    if(zoomRange.max!==ceiling)zoomRange.max=ceiling;
    document.documentElement.classList.toggle('stage-mode',
      moveShowActive(now)||idleShowActive(now)||walkShowActive(now)||
      IOS_HEAD_ANCHOR||IOS_ZOOM>1.05||
      document.documentElement.classList.contains('zoom-open'));
    railLive.classList.toggle('on',Boolean(LIVE));
    railMove.classList.toggle('on',moveShowActive(now));
    railIdle.classList.toggle('on',idleShowActive(now));
    railClose.classList.toggle('on',IOS_HEAD_ANCHOR);
    railPip.classList.toggle('on',pipActive());
    railEnconvo.classList.toggle('on',Boolean(ENCONVO.agent)||
      document.documentElement.classList.contains('agents-open'));
    railMute.classList.toggle('on',Boolean(window.IOS_MUTED));
    railZoom.classList.toggle('on',
      document.documentElement.classList.contains('zoom-open'));
  },400);
  // iOS auto-scrolls the page to keep a focused field visible, which
  // shoves her head off the top and leaves the page shifted after the
  // keyboard goes away. The stage never legitimately scrolls - pin it.
  addEventListener('scroll',()=>{if(scrollY||scrollX)scrollTo(0,0);});
  document.addEventListener('focusout',()=>setTimeout(()=>scrollTo(0,0),60));
  if(window.visualViewport){
    const keyboardLane=()=>{
      // The keyboard (and its accessory bar) shrinks the visual viewport;
      // the bar, thread, and toast all climb above it instead of hiding
      // underneath (owner: 'got too close, and overlapped').
      const lift=Math.max(0,innerHeight-visualViewport.height-visualViewport.offsetTop);
      document.documentElement.style.setProperty('--kb',lift+'px');
    };
    visualViewport.addEventListener('resize',()=>{scrollTo(0,0);fitTxtPlaceholder();keyboardLane();});
    keyboardLane();
    // The keyboard also pans the VISUAL viewport, which slid the bar and
    // rail sideways off the glass; snap the layout scroll back each time.
    visualViewport.addEventListener('scroll',()=>{if(scrollX||scrollY)scrollTo(0,0);});
  }
}
addEventListener('keydown',e=>{if(!monitorEnabled&&e.code==='Space'&&document.activeElement!==txt&&!e.repeat){
  e.preventDefault();startRec();}});
addEventListener('keyup',e=>{if(!monitorEnabled&&e.code==='Space'&&document.activeElement!==txt){
  e.preventDefault();stopRec();}});
// The click may arrive while another app is active (acceptFirstMouse): ask
// the shell to make this window KEY, or the caret never blinks and typing
// goes to the previous app.
txt.addEventListener('pointerdown',()=>{
  if(SHELL&&typeof SHELL.focusPetWindow==='function')SHELL.focusPetWindow();
});
txt.addEventListener('keydown',e=>{if(!monitorEnabled&&e.key==='Enter'&&!e.shiftKey){
  // Enter sends, Shift+Enter makes a new line - the field is a textarea now.
  e.preventDefault();
  const v=txt.value.trim();if(!v)return;
  txt.value='';autoSizeTxt();turn(v);}});
</script></body></html>
