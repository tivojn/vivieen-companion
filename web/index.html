<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vivieen</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0b0d10;color:#f2efe9;
  font:400 15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,sans-serif;overflow:hidden}
#stage{position:fixed;inset:0}
canvas{width:100%;height:100%;display:block}
#vignette{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 35%,transparent 45%,rgba(0,0,0,.55) 100%)}
#bar{position:fixed;left:0;right:0;bottom:0;padding:20px 24px 26px;
  background:linear-gradient(to top,rgba(6,8,11,.94) 40%,transparent);
  display:flex;flex-direction:column;align-items:center;gap:8px}
#log{width:min(720px,92vw);min-height:0;text-align:center}
#you{opacity:.5;font-size:13px;letter-spacing:.01em;margin-bottom:5px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#her{--caption-lines:1;--caption-folded-height:calc(var(--caption-lines)*1.45em + 20px);
  --caption-expanded-height:min(46vh,420px);width:100%;max-height:var(--caption-folded-height);
  overflow:hidden;overscroll-behavior:contain;scrollbar-gutter:stable;
  padding:9px 12px;border:1px solid rgba(255,255,255,.10);border-radius:13px;
  background:rgba(6,8,11,.78);backdrop-filter:blur(12px);
  font-size:17px;line-height:1.45;letter-spacing:-.01em;text-align:left;text-wrap:pretty;
  scrollbar-width:thin;scrollbar-color:#69717d rgba(255,255,255,.05);
  transition:max-height 400ms cubic-bezier(.22,1,.36,1),border-color 250ms ease,
             background 250ms ease,box-shadow 250ms ease;will-change:max-height}
#her.is-expanded{max-height:var(--caption-expanded-height);overflow-y:auto;
  border-color:rgba(255,255,255,.18);background:rgba(6,8,11,.92);
  box-shadow:0 12px 36px rgba(0,0,0,.24)}
#her:empty{display:none}
#her:focus-visible{outline:1px solid #8b93a0;outline-offset:2px}
#her .caption-summary{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#her .caption-markdown{display:grid;gap:.72em;overflow-wrap:anywhere}
#her .caption-markdown h1,#her .caption-markdown h2,#her .caption-markdown h3,
#her .caption-markdown h4,#her .caption-markdown h5,#her .caption-markdown h6{
  color:#fff;font-weight:680;line-height:1.22;letter-spacing:-.025em}
#her .caption-markdown h1{font-size:1.28em}#her .caption-markdown h2{font-size:1.18em}
#her .caption-markdown h3{font-size:1.08em}
#her .caption-markdown ul,#her .caption-markdown ol{padding-left:1.35em}
#her .caption-markdown li+li{margin-top:.28em}
#her .caption-markdown blockquote{padding-left:.85em;border-left:3px solid #d81f4a;color:#c8ced7}
#her .caption-markdown code{padding:.12em .35em;border-radius:5px;background:#20242b;
  color:#ffd6df;font:500 .88em/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}
#her .caption-markdown pre{overflow-x:auto;padding:11px 12px;border:1px solid #292f38;
  border-radius:9px;background:#0e1116;white-space:pre}
#her .caption-markdown pre code{padding:0;background:transparent;color:#e8ebef}
#her .caption-markdown a{color:#ff8aa5;text-decoration-color:rgba(255,138,165,.5);
  text-underline-offset:2px}
#her .caption-markdown hr{height:1px;border:0;background:rgba(255,255,255,.12)}
#her .caption-markdown table{width:100%;border-collapse:collapse;font-size:.92em}
#her .caption-markdown th,#her .caption-markdown td{padding:6px 8px;
  border:1px solid #303641;text-align:left;vertical-align:top}
#her .caption-markdown th{background:#181c22;color:#fff;font-weight:650}
#her::-webkit-scrollbar{width:6px}
#her::-webkit-scrollbar-track{background:rgba(255,255,255,.05);border-radius:6px}
#her::-webkit-scrollbar-thumb{background:#69717d;border-radius:6px}
@media (prefers-reduced-motion:reduce){#her{transition:none}}
#row{display:flex;align-items:center;gap:12px;width:min(720px,92vw)}
#manual{flex:1;min-width:0;display:flex;align-items:center;gap:12px}
#monitor{display:none;flex:none;width:54px;height:54px;padding:0;align-items:center;justify-content:center;gap:9px;
  border:1px solid #303641;border-radius:27px;background:rgba(18,21,26,.9);color:#c8ced7;
  font:600 13px/1 inherit;letter-spacing:.01em;cursor:pointer;white-space:nowrap;
  transition:flex .2s ease,width .2s ease,color .2s ease,border-color .2s ease,background .2s ease}
html.electron #monitor{display:flex}
#monitor:hover{color:#fff;border-color:#4a5361}
#monitor[disabled]{cursor:wait;opacity:.7}
#monitor.pending{color:#e8b13a;border-color:rgba(232,177,58,.42)}
#monitor.error{color:#f07a86;border-color:rgba(240,122,134,.4)}
#monitor.active{color:#85e4ad;border-color:rgba(56,209,122,.48);background:rgba(25,58,42,.72)}
#monitorWave{height:18px;display:flex;align-items:center;gap:2px}
#monitorWave span{display:block;width:2px;height:5px;border-radius:2px;background:currentColor;opacity:.72}
#monitor.active #monitorWave span{animation:monitorWave .56s ease-in-out infinite alternate}
#monitor.active #monitorWave span:nth-child(2){animation-delay:-.22s}
#monitor.active #monitorWave span:nth-child(3){animation-delay:-.38s}
@keyframes monitorWave{to{height:17px}}

#monitor:hover #monitorMark{opacity:1}
#monitorWave,#monitorText{display:none}
#row.monitoring #monitorWave{display:flex}
#row.monitoring #monitorText{display:inline}
#row.monitoring #manual{display:none}
#row.monitoring #monitor{flex:1;width:auto}
#ptt{flex:1;min-width:0;height:54px;border:0;border-radius:27px;cursor:pointer;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  background:#d81f4a;color:#fff;font:600 15px/1 inherit;letter-spacing:.02em;
  transition:transform .12s ease,background .2s ease,box-shadow .2s ease;
  box-shadow:0 6px 24px rgba(216,31,74,.32)}
#ptt:active,#ptt.rec{background:#f43c66;transform:scale(.985);
  box-shadow:0 0 0 6px rgba(244,60,102,.16),0 6px 24px rgba(216,31,74,.4)}
#ptt[disabled]{background:#2b2f36;box-shadow:none;cursor:default;color:#7c828c}
#txt{flex:1.1;min-width:0;height:54px;border-radius:27px;border:1px solid #262b33;background:#12151a;
  color:#f2efe9;padding:0 22px;font:400 15px/1 inherit;outline:none}
#txt:focus{border-color:#3a414c}
#status{position:fixed;top:20px;left:24px;font-size:12px;letter-spacing:.08em;
  text-transform:uppercase;opacity:.55;display:flex;align-items:center;gap:9px}
#st{max-width:calc(100vw - 190px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#dot{width:7px;height:7px;border-radius:50%;background:#5b6472;transition:background .25s}
#dot.on{background:#38d17a;box-shadow:0 0 10px #38d17a}
#dot.busy{background:#e8b13a;box-shadow:0 0 10px #e8b13a}
#dot.rec{background:#f43c66;box-shadow:0 0 10px #f43c66;animation:p 1s infinite}
@keyframes p{50%{opacity:.35}}
#vz{position:fixed;top:52px;right:26px;font:500 11px/1 ui-monospace,SFMono-Regular,monospace;
  letter-spacing:.14em;opacity:0;transition:opacity .3s;color:#8b93a0}
#vz.on{opacity:.5}
#gear{position:fixed;top:14px;right:18px;display:flex;align-items:center;gap:8px;
  padding:8px 13px;border-radius:20px;color:#8b93a0;text-decoration:none;opacity:.5;
  font:500 11px/1 inherit;letter-spacing:.14em;text-transform:uppercase;
  border:1px solid transparent;transition:opacity .2s,color .2s,border-color .2s,background .2s}
#gear:hover{opacity:1;color:#f2efe9;border-color:#262b33;background:rgba(18,21,26,.72)}
#gear svg{width:14px;height:14px;flex:none}
#gear.alert{opacity:1;color:#e8b13a;border-color:rgba(232,177,58,.32)}
#emptyState{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:32px;
  background:radial-gradient(circle at 50% 28%,rgba(216,31,74,.16),transparent 38%),#0b0d10}
#emptyState[hidden]{display:none}
#emptyCard{width:min(440px,88vw);padding:38px;border:1px solid #292d34;border-radius:28px;
  background:rgba(18,21,26,.92);text-align:center;box-shadow:0 28px 80px rgba(0,0,0,.38)}
#emptyMark{width:72px;height:72px;margin:0 auto 22px;border-radius:22px;display:grid;place-items:center;
  background:linear-gradient(145deg,#ee5b4f,#d81f6a);font-size:30px;box-shadow:0 14px 38px rgba(216,31,74,.25)}
#emptyCard h1{font-size:28px;letter-spacing:-.04em;margin-bottom:10px}
#emptyCard p{color:#9ba2ad;line-height:1.65;margin-bottom:24px}
#emptyAction{display:inline-flex;height:48px;align-items:center;padding:0 24px;border-radius:24px;
  color:#fff;text-decoration:none;background:#d81f4a;font-weight:650;box-shadow:0 8px 28px rgba(216,31,74,.3)}
#shell{display:none}
html.electron,html.electron body{background:transparent}
html.electron body{border-radius:0;overflow:hidden}
html.electron body:after{content:"";position:fixed;inset:0;border-radius:22px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.10);pointer-events:none;z-index:99}
html.electron.pet body:after{display:none}
html.electron.pet #vignette,html.electron.pet #shell,html.electron.pet #status,
html.electron.pet #gear,html.electron.pet #vz,html.electron.pet #bar{display:none}
html.electron.pet.chat-open #bar{display:flex;left:12px;right:12px;bottom:12px;padding:12px;
  border-radius:24px;background:linear-gradient(to top,rgba(8,9,12,.94),rgba(8,9,12,.62) 58%,transparent)}
html.electron.pet.chat-open #log{display:none}
html.electron.pet.following-enconvo #bar{display:none!important}
html.electron.pet #stage{inset:0}
html.electron.pet canvas{cursor:default}
html.electron.pet.dragging canvas{cursor:grabbing}
#petBubble{display:none;position:fixed;z-index:70;top:7%;left:7%;max-width:min(360px,78vw);
  padding:12px 15px;border:1px solid rgba(255,255,255,.16);border-radius:18px 18px 18px 5px;
  background:rgba(15,17,21,.82);backdrop-filter:blur(16px);color:#f7f4ef;
  font-size:14px;line-height:1.45;letter-spacing:-.01em;box-shadow:0 18px 44px rgba(0,0,0,.24);
  opacity:0;transform:translateY(7px);transition:opacity .3s ease,transform .3s ease;pointer-events:none}
html.electron.pet #petBubble.on{display:block;opacity:1;transform:none}
html.electron #shell{display:flex;position:fixed;z-index:90;left:0;right:0;top:0;
  height:44px;align-items:center;padding:0 11px 0 16px;background:linear-gradient(to bottom,rgba(6,8,11,.72),transparent)}
#drag{height:100%;flex:1;-webkit-app-region:drag}
#shellBtns{display:flex;gap:5px;-webkit-app-region:no-drag}
.shellBtn{width:28px;height:28px;border:0;border-radius:9px;background:rgba(18,21,26,.7);
  color:#8b93a0;font:500 15px/1 inherit;cursor:pointer;transition:.15s}
.shellBtn:hover{color:#fff;background:#292d34}.shellBtn.on{color:#e2483a}
html.electron #status{top:54px}
html.electron #gear{top:8px;right:112px;z-index:95;-webkit-app-region:no-drag}
html.electron #vz{top:84px}
</style></head><body>
<div id="shell"><div id="drag"></div><div id="shellBtns">
  <button class="shellBtn" id="shellPin" title="Always on top">◇</button>
  <button class="shellBtn" id="shellMin" title="Minimize">−</button>
  <button class="shellBtn" id="shellHide" title="Hide avatar">×</button>
</div></div>
<div id="stage"><canvas id="cv"></canvas></div><div id="vignette"></div>
<div id="petBubble" role="status" aria-live="polite"></div>
<div id="emptyState" hidden><div id="emptyCard">
  <div id="emptyMark">◉</div><h1>Create your first avatar</h1>
  <p>Your portrait stays out of the app bundle and Git repository. Add one in Settings, review the crop, then build the local animation assets.</p>
  <a id="emptyAction" href="/settings">Open Settings</a>
</div></div>
<div id="status"><span id="dot"></span><span id="st">booting</span></div>

function safeMarkdownHref(value){
  try{
    const url=new URL(value,location.href);
    return ['http:','https:','mailto:'].includes(url.protocol)?url.href:'';
  }catch(e){return'';}
}
function appendInlineMarkdown(parent,source){
  const text=String(source||'');
  const tokens=/(`[^`\n]+`|\*\*[^*\n]+\*\*|__[^_\n]+__|~~[^~\n]+~~|\[[^\]\n]+\]\([^)\s]+(?:\s+"[^"]*")?\)|\*[^*\n]+\*|_[^_\n]+_)/g;
  let cursor=0,match;
  while((match=tokens.exec(text))){
    if(match.index>cursor)parent.append(document.createTextNode(text.slice(cursor,match.index)));
    const raw=match[0];let node=null,inner='';
    if(raw.startsWith('`')){
      node=document.createElement('code');node.textContent=raw.slice(1,-1);
    }else if(raw.startsWith('**')||raw.startsWith('__')){
      node=document.createElement('strong');inner=raw.slice(2,-2);
    }else if(raw.startsWith('~~')){
      node=document.createElement('del');inner=raw.slice(2,-2);
    }else if(raw.startsWith('[')){
      const parts=raw.match(/^\[([^\]]+)\]\(([^)\s]+)(?:\s+"[^"]*")?\)$/);
      const href=parts&&safeMarkdownHref(parts[2]);
      if(href){
        node=document.createElement('a');node.href=href;node.target='_blank';
        node.rel='noopener noreferrer';appendInlineMarkdown(node,parts[1]);
      }else{
        parent.append(document.createTextNode(parts?parts[1]:raw));
      }
    }else{
      node=document.createElement('em');inner=raw.slice(1,-1);
    }
    if(node){
      if(inner)appendInlineMarkdown(node,inner);
      parent.append(node);
    }
    cursor=tokens.lastIndex;
  }
  if(cursor<text.length)parent.append(document.createTextNode(text.slice(cursor)));
}
function markdownCells(line){
  return line.trim().replace(/^\||\|$/g,'').split('|').map(cell=>cell.trim());
}
function isMarkdownTableDivider(line){
  return /^\s*\|?\s*:?-{3,}:?\s*(?:\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(line);
}
function renderMarkdown(source,target){
  const lines=String(source||'').replace(/\r\n?/g,'\n').split('\n');
  let index=0;
  while(index<lines.length){
    const line=lines[index];
    if(!line.trim()){index++;continue;}
    const fence=line.match(/^\s*```([\w+-]*)\s*$/);
    if(fence){
      const code=[];index++;
      while(index<lines.length&&!/^\s*```\s*$/.test(lines[index]))code.push(lines[index++]);
      if(index<lines.length)index++;
      const pre=document.createElement('pre'),body=document.createElement('code');
      if(fence[1])body.dataset.language=fence[1];
      body.textContent=code.join('\n');pre.append(body);target.append(pre);continue;
    }
    const heading=line.match(/^\s{0,3}(#{1,6})\s+(.+)$/);
    if(heading){
      const node=document.createElement('h'+heading[1].length);
      appendInlineMarkdown(node,heading[2]);target.append(node);index++;continue;
    }
    if(/^\s{0,3}(?:-{3,}|\*{3,}|_{3,})\s*$/.test(line)){
      target.append(document.createElement('hr'));index++;continue;
    }
    if(/^\s{0,3}>/.test(line)){
      const quoted=[];
      while(index<lines.length&&/^\s{0,3}>/.test(lines[index]))
        quoted.push(lines[index++].replace(/^\s{0,3}>\s?/,''));
      const quote=document.createElement('blockquote');
      renderMarkdown(quoted.join('\n'),quote);target.append(quote);continue;
    }
    const listItem=line.match(/^\s{0,3}([-+*]|\d+[.)])\s+(.+)$/);
    if(listItem){
      const ordered=/^\d/.test(listItem[1]),list=document.createElement(ordered?'ol':'ul');
      while(index<lines.length){
        const item=lines[index].match(/^\s{0,3}([-+*]|\d+[.)])\s+(.+)$/);
        if(!item||/^\d/.test(item[1])!==ordered)break;
        const child=document.createElement('li');appendInlineMarkdown(child,item[2]);
        list.append(child);index++;
      }
      target.append(list);continue;
    }
    if(index+1<lines.length&&line.includes('|')&&isMarkdownTableDivider(lines[index+1])){
      const table=document.createElement('table'),head=document.createElement('thead');
      const headRow=document.createElement('tr');
      for(const cell of markdownCells(line)){
        const th=document.createElement('th');appendInlineMarkdown(th,cell);headRow.append(th);
      }
      head.append(headRow);table.append(head);index+=2;
      const body=document.createElement('tbody');
      while(index<lines.length&&lines[index].trim()&&lines[index].includes('|')){
        const row=document.createElement('tr');
        for(const cell of markdownCells(lines[index++])){
          const td=document.createElement('td');appendInlineMarkdown(td,cell);row.append(td);
        }
        body.append(row);
      }
      table.append(body);target.append(table);continue;
    }
    const paragraph=[];
    while(index<lines.length&&lines[index].trim()){
      if(paragraph.length&&(/^\s{0,3}(?:```|#{1,6}\s|>|[-+*]\s+|\d+[.)]\s+)/.test(lines[index])||
         /^\s{0,3}(?:-{3,}|\*{3,}|_{3,})\s*$/.test(lines[index])))break;
      paragraph.push(lines[index++].trim());
    }
    const node=document.createElement('p');appendInlineMarkdown(node,paragraph.join(' '));
    target.append(node);
  }
}

function handleMonitorSample(value){
  if(!monitorEnabled||!value)return;
  const sequence=Number(value.sequence);
  if(Number.isFinite(sequence)&&sequence>0){
    if(sequence<=monitorSampleSequence)return;
    monitorSampleSequence=sequence;
  }
  const rawTimestamp=Number(value.timestamp);
  const sampleTimestamp=Number.isFinite(rawTimestamp)&&rawTimestamp>0?
    rawTimestamp:Date.now();
  externalAudio={
    rms:Math.max(0,+value.rms||0),peak:Math.max(0,+value.peak||0),
    low:Math.max(0,+value.low||0),mid:Math.max(0,+value.mid||0),
    high:Math.max(0,+value.high||0),zcr:Math.max(0,+value.zcr||0),
    active:!!value.active,timestamp:sampleTimestamp,receivedAt:performance.now()
  };
  const candidate=externalAudio.active?byExternalEnergy():'sil';
  stabiliseExternalViseme(candidate,sampleTimestamp,externalAudio.active);
  speaking=externalAudio.active||Boolean(localSource);
  monitorButton.classList.toggle('active',speaking);
  renderMonitorStatus();
}

    const providerOK=h.llm_ok??h.provider_ok??h.ollama;
    // The chat button's disabled state doubles as a monitor-mode lock, so pet
    // push-to-talk needs its own readiness signal.
    providerReady=Boolean(h.warm&&providerOK);

    if(monitorEnabled){
      renderMonitorStatus();
    }else if(h.warm&&providerOK){
      setStatus(routedStatus(h.last_llm,h.llm),'on');ptt.disabled=false;

    if(monitorEnabled)renderMonitorStatus();else setStatus('server offline','');}
  setTimeout(poll,1500);
}

/* ================= face runtime =================
   The mouth is driven by a timed viseme track that the server derives from
   Kokoro's own duration predictor - the same numbers the vocoder used to make
   the audio. So this is a schedule lookup against the audio clock, not a guess
   from the waveform. The analyser is kept only for breath/emphasis, and as a
   graceful fallback if a track ever fails to arrive.                        */
let actx=null,analyser=null,speaking=false,lvl=0;
let track=[],tIdx=0,audioT0=0;
let curV='sil',prevV='sil',switchAt=0;
const XFADE=0.018;                       // timed tracks: never double teeth
const MIN_POSE=0.020;                    // preserve real 25ms consonants
const VISUAL_LEAD=XFADE*0.5;             // dissolve midpoint meets audio event
const LOCKED_POSES=new Set(['sil','PP']);

/* Follow EnConvo receives one coarse spectrum packet every ~32ms (the tap's
   25ms timer quantises to buffer boundaries), not phoneme timestamps. The old
   stabiliser demanded 3 consecutive identical packets before moving the mouth,
   but the measured mean identical-run in real speech is 2.48 packets - most
   articulation could never confirm and whole phrases froze (see
   docs/follow-enconvo-lipsync-diagnosis.md). Instead: keep the last 5
   candidates and render the majority vote centred two packets back. Dither
   runs (1-2 packets) lose the vote; real syllables (~4 packets) win it. Costs
   ~64ms of mouth lag, well under the ~125ms video-late threshold. Ties go to
   the centre packet so a split vote never invents a third shape. */
const EXTERNAL_XFADE=0.065;
const EXTERNAL_VOTE_WINDOW=5;
const EXTERNAL_VOTE_LOOKAHEAD=2;
let externalPose='sil',externalVotes=[];
let externalSampleTimestamp=-Infinity;
function resetExternalViseme(timestampMs=Date.now()){
  externalPose='sil';externalVotes=[];
  externalSampleTimestamp=-Infinity;
}
function stabiliseExternalViseme(candidate,timestampMs=Date.now(),active=true){
  const now=Number(timestampMs);
  if(!Number.isFinite(now)||now<=externalSampleTimestamp)return externalPose;
  externalSampleTimestamp=now;
  externalVotes.push(active?(candidate||'sil'):'sil');
  if(externalVotes.length>EXTERNAL_VOTE_WINDOW)externalVotes.shift();
  const centre=externalVotes.length-1-EXTERNAL_VOTE_LOOKAHEAD;
  if(centre<0)return externalPose;    // window still filling at utterance start
  const tally={};
  for(const vote of externalVotes)tally[vote]=(tally[vote]||0)+1;
  let winner=externalVotes[centre],best=tally[winner];
  for(const vote in tally)if(tally[vote]>best){winner=vote;best=tally[vote];}
  externalPose=winner;
  return externalPose;
}

/* Exact alignment legitimately emits 25ms consonants. Collapse only
   sub-20ms estimator glitches; never erase real articulation. */
function stabiliseTrack(raw,duration){
  const valid=new Set((M&&M.visemes)||[]);
  let ev=(Array.isArray(raw)?raw:[])
    .filter(e=>Array.isArray(e)&&Number.isFinite(+e[0])&&valid.has(e[1]))
    .map(e=>[Math.max(0,+e[0]),e[1]])
    .sort((a,b)=>a[0]-b[0]);
  const compact=events=>{
    const out=[];
    for(const e of events){
      if(out.length&&Math.abs(e[0]-out[out.length-1][0])<1e-4)out[out.length-1]=e;
      else if(!out.length||out[out.length-1][1]!==e[1])out.push(e);
    }
    return out;
  };
  ev=compact(ev);
  for(let pass=0;pass<5;pass++){
    let changed=false;
    for(let i=0;i+1<ev.length;i++){
      const dwell=ev[i+1][0]-ev[i][0],v=ev[i][1];
      if(dwell>=MIN_POSE||LOCKED_POSES.has(v))continue;
      const before=i?ev[i-1][1]:null,after=ev[i+1][1];
      const replacement=after&&after!=='sil'?after:before;
      if(replacement&&replacement!==v){ev[i][1]=replacement;changed=true;}
    }
    ev=compact(ev);
    if(!changed)break;
  }
  if(ev.length&&duration>0&&ev[ev.length-1][0]>duration)
    ev[ev.length-1][0]=duration;
  return ev;
}

/* ---- eyelids -------------------------------------------------------------
   A blink is a trajectory, not a state.  The lid falls in ~85ms with its
   velocity peaking early, rests shut for ~25ms, is levered back up over ~205ms
   - the reopen is always the slow half - and creeps the last few percent home.
   Cutting to a fully-closed frame and back skips every position in between,
   and the eye reads that as a dropped frame rather than an eyelid.  So the
   frames carry no eyes at all now: assets/eye_*.png hold 8 baked lid heights
   per eye, we interpolate between them, and each eye runs on its own clock
   because two real lids are never in perfect lockstep.                      */
let BT={close:85,hold:25,open:205,settle:150,creep:0.09};
let blinks=[],nextBlink=performance.now()+1600;

function lidAt(ms,amp,k){
  if(ms<0)return 0;
  const c=BT.close*k,h=BT.hold*k,o=BT.open*k;
  if(ms<c)return amp*(1-Math.pow(1-ms/c,2.3));   // fall: fastest off the mark
  if(ms<c+h)return amp;                          // contact
  const u=(ms-c-h)/o;
  if(u<1)return amp*((1-u*u*(3-2*u))*(1-BT.creep)+BT.creep);
  const s=(ms-c-h-o)/BT.settle;                  // the last few percent creep home
  return s<1?amp*BT.creep*Math.pow(1-s,2):0;
}
function lidFor(now,side){
  const off=side==='r'?1:0;let L=0;
  for(const b of blinks){const v=lidAt(now-b.t0-off*b.skew,b.amp,b.k);if(v>L)L=v;}
  return L>1?1:L;
}
function planBlink(now){
  const skew=()=>(Math.random()*2-1)*13;          // ms of eye-to-eye asymmetry
  blinks.push({t0:now,k:0.88+Math.random()*0.26,
    amp:0.93+Math.random()*0.07,skew:skew()});
  // people blink noticeably more while they talk, and less while listening
  nextBlink=now+(speaking?1500+Math.random()*3400:2400+Math.random()*5400);
}
/* ---- gaze: locked to the lens ----------------------------------------------
   She is an anchor addressing an audience, not someone scanning a room, so the
   eyes stay on the camera. That is NOT the same as a static iris. When the head
   moves and the target does not, the eyes must counter-rotate to hold the lock -
   the vestibulo-ocular reflex - so the iris slides continuously in the socket,
   always against the head. That coupling is the whole effect: it is what reads
   as "she is looking at me". Eyes that wander on their own schedule read as
   distracted, which is worse than a dead stare; eyes welded to the skull read
   as a doll.

   Gain: idle head movement is mostly rotation about the neck, not translation,
   so an apparent head shift of dx px means a yaw of about dx/L (L = neck to
   eye, 579px for this rig) and the eye must counter-rotate by that plus a
   small parallax term - an in-socket shift of ~0.12*dx. Pure translation would
   only need 0.02*dx; the difference between those two numbers is the difference
   between a person and a mannequin.                                           */
const VOR_X=0.12, VOR_Y=0.10, VOR_T=0.02;
let msX=0,msY=0,msT=0,msNext=0;

/* Fixational micro-saccades: flick off the target, then a corrective flick back.
   Real ones run 0.1-0.5 deg a few times a second, and one degree is only 0.73px
   on this face - so these are deliberately sub-pixel, enough that the iris is
   never a frozen texture, never enough to read as looking somewhere else.

   The magnitude has a FLOOR rather than being uniform around zero. Real
   micro-saccades do too, and here it also matters mechanically: the baked grid
   is quantised at a quarter pixel, so a flick smaller than that paints the
   identical state and the eye visibly parks. 0.22-0.5px is 0.3-0.7 deg - real,
   and always at least one state wide. */
function micro(now){
  if(now>msNext){
    const s=()=>Math.random()<0.5?-1:1;
    msX=s()*(0.22+Math.random()*0.28);msY=s()*(0.12+Math.random()*0.18);
    msT=now;msNext=now+300+Math.random()*620;
  }
  const k=Math.min(1,(now-msT)/420);          // corrective return to the target
  return [msX*(1-k),msY*(1-k)];
}
/* Two gains, because these are two different motions. Drift and nods are the
   head ROTATING, which swings the socket as well as carrying it, so they need
   the full 0.12. A tilt only carries the eye sideways - the socket does not yaw
   - so it needs the parallax term alone, R_eye/D ~ 0.02. Driving the tilt at
   0.12 would over-rotate the iris six-fold and shove it past the baked range. */
function gazeFor(now,h,lever){
  const [mx,my]=micro(now);
  const cant=lever*h.r*Math.PI/180;          // px the cant carries the eye
  return {x:-VOR_X*h.x-VOR_T*cant+mx, y:-VOR_Y*h.y+my};
}

/* ---- cursor gaze -----------------------------------------------------------
   The lens lock above is her resting behaviour; a person also glances at
   nearby motion. When the cursor MOVES, attention eases toward it and the
   iris slides in its direction, saturating at the baked grid's extremes; when
   the cursor goes still the attention decays and the lens lock returns. She
   never tracks while speaking - an anchor holds the camera - and the offsets
   stay inside the grid, so this can never paint an unbaked eye state. */
let cursorFeed=null,cursorMovedAt=0,gazeAttn=0;
const cursorEye={x:0,y:0};
// Normalised -1..1 attention direction, consumed by bodyAt: at pet scale the
// iris grid is a fraction of a screen pixel, so what actually READS as "she
// noticed your cursor" is the whole body leaning toward it.
const cursorDir={x:0,y:0};
function noteCursor(x,y){
  const now=performance.now();
  if(!cursorFeed||Math.abs(x-cursorFeed.x)>1||Math.abs(y-cursorFeed.y)>1)cursorMovedAt=now;
  cursorFeed={x,y,at:now};
}
function faceAnchorCss(){
  if(!ready)return null;
  const hasBody=Boolean(BODY&&HEADMASK&&M.body);
  const source=hasBody?BODY:faceSurface;
  if(!source)return null;
  const width=source.width,height=source.height;
  const fallback={bounds:(M.cutout&&M.cutout.bounds)||[0,0,width,height],
    alignment:{face_bounds:[width*.20,height*.10,width*.60,height*.62]}};
  const camera=petCamera(hasBody?M.body:fallback,width,height);
  let ex,ey;
  if(M.gaze&&M.gaze.l&&M.gaze.r){
    const mid=box=>[box[0]+box[2]/2,box[1]+box[3]/2];
    const l=mid(M.gaze.l.box),r=mid(M.gaze.r.box);
    ex=(l[0]+r[0])/2;ey=(l[1]+r[1])/2;
  }else{
    const N=M.neck||{x:width/2,ref:height*0.3};
    ex=N.x;ey=N.ref;
  }
  const matrix=hasBody?M.body.face_transform:null;
  if(matrix&&matrix.length===2){
    const bx=matrix[0][0]*ex+matrix[0][1]*ey+matrix[0][2];
    const by=matrix[1][0]*ex+matrix[1][1]*ey+matrix[1][2];
    ex=bx;ey=by;
  }
  const ratio=devicePixelRatio||1;
  return {x:(ex*camera.scale+camera.x)/ratio,
          y:(ey*camera.scale+camera.y)/ratio};
}
function cursorGazeFor(now){
  let target=0,dx=0,dy=0;
  const anchor=cursorFeed&&now-cursorFeed.at<400?faceAnchorCss():null;
  if(anchor){
    dx=cursorFeed.x-anchor.x;dy=cursorFeed.y-anchor.y;
    if(!speaking&&(petHit||now-cursorMovedAt<2600))target=1;
  }
  gazeAttn+=(target-gazeAttn)*(target>gazeAttn?0.10:0.03);
  if(gazeAttn<0.02)return null;
  const dirX=Math.tanh(dx/90),dirY=Math.tanh(dy/130);
  cursorDir.x+=(dirX-cursorDir.x)*0.18; // head turn follows a beat behind the eyes
  cursorDir.y+=(dirY-cursorDir.y)*0.18;
  const rangeX=M.gaze?Math.max(...M.gaze.dxs.map(Math.abs)):1.5;
  const rangeY=M.gaze?Math.max(...M.gaze.dys.map(Math.abs)):0.75;
  const gx=dirX*rangeX,gy=dirY*rangeY;
  cursorEye.x+=(gx-cursorEye.x)*0.30;   // saccade-quick, but never a teleport
  cursorEye.y+=(gy-cursorEye.y)*0.30;
  return {x:cursorEye.x,y:cursorEye.y,w:gazeAttn};
}
function cursorHeadFor(h){
  /* The head carries the glance now, not the silhouette: it turns toward the
     cursor together with the eyes. This composes with the VOR naturally - at
     low attention the counter-rotation keeps the eyes on the lens while the
     head drifts, and at full attention the gaze blend hands the eyes to the
     cursor as the head arrives. */
  const attend=gazeAttn>.02?Math.min(1,gazeAttn):0;
  if(!attend)return h;
  h.x+=attend*cursorDir.x*12;
  h.y+=attend*cursorDir.y*5;
  h.r+=attend*cursorDir.x*1.0;
  return h;
}

/* ---- head on neck ----------------------------------------------------------
   The first version translated the WHOLE FRAME - head, shoulders, jacket and
   backdrop as one block. That is not a head moving, it is a camera moving, and
   it is precisely why she read as stiff-necked. A nod is not a nod if the
   shoulders come with it.

   A head moves by turning ON THE NECK, so the motion must TAPER: crown most,
   chin far less, collar not at all. And because a rigid rotation about a pivot
   is linear in y, that taper is exactly an AFFINE transform - one setTransform,
   no bands, no seams, no cost. The nod's foreshortening falls out of it free:
   the chin travels less than the brow, so the face shortens as it drops.

   Motion is value noise, not a sum of sines. Detuned sines never repeat, but
   they also never PAUSE, and that unbroken glide is the other half of why the
   old head felt mechanical. Noise holds still sometimes. */
function vn(t,seed){
  const i=Math.floor(t),f=t-i,u=f*f*(3-2*f);
  const h=n=>{const x=Math.sin(n*127.1+seed*311.7)*43758.5453;
              return (x-Math.floor(x))*2-1;};
  return h(i)*(1-u)+h(i+1)*u;
}

/* Nods and tilts are EVENTS, not waveforms: a damped down-and-back, and a cant
   of the head held for a beat before it relaxes. Both fire far more often while
   talking than while listening. */
const ease=t=>t*t*(3-2*t);
let nods=[],nextNod=performance.now()+1500;
let tilt={a:0,t0:-1e9,ti:400,hold:1200,to:700},nextTilt=performance.now()+3000;
let presence=.38,presenceFrom=.38,presenceTarget=.38,presenceT0=performance.now(),nextPresence=performance.now()+4200;
let weight={from:0,to:0,t0:performance.now(),duration:4200},nextWeight=performance.now()+6200;

function planPresence(now){
  presenceFrom=presence;
  const roll=Math.random();
  presenceTarget=speaking?(0.78+Math.random()*.22):
    roll<.42?(0.08+Math.random()*.16):roll<.88?(0.30+Math.random()*.32):(0.68+Math.random()*.22);
  presenceT0=now;
  nextPresence=now+(speaking?1800+Math.random()*3400:3800+Math.random()*9200);
}
function presenceAt(now){
  if(now>nextPresence)planPresence(now);
  const u=Math.min(1,(now-presenceT0)/1400);
  presence=presenceFrom+(presenceTarget-presenceFrom)*ease(u);
  return presence;
}
function planWeight(now){
  weight={from:weight.to,to:(Math.random()*2-1),t0:now,duration:3200+Math.random()*4200};
  nextWeight=now+7000+Math.random()*15000;
}
let tapPulse=null;
function bodyAt(now,width,height){
  if(now>nextWeight)planWeight(now);
  const u=Math.min(1,Math.max(0,(now-weight.t0)/weight.duration));
  const shift=weight.from+(weight.to-weight.from)*ease(u);
  const energy=presenceAt(now),t=now/1000;
  const breath=(.5+.5*vn(t*.19,21))*(.55+.45*vn(t*.073,22));
  let x=shift*width*.0045+vn(t*.12,23)*width*.0016*energy;
  let y=-breath*height*.0018;
  let r=(shift*.11+vn(t*.09,24)*.055*energy)*Math.PI/180;
  let sx=1+breath*.0018,sy=1+breath*.0034;
  if(tapPulse){
    const k=(now-tapPulse.t0)/420;
    if(k>=1)tapPulse=null;
    else{
      // A quick squash-and-recover: the acknowledgement you can actually see.
      const pulse=Math.sin(Math.PI*k)*Math.exp(-1.6*k);
      y+=height*.0065*pulse;
      sy*=1-.028*pulse;sx*=1+.014*pulse;
      r+=tapPulse.dir*.9*Math.PI/180*pulse;
    }
  }
  return {x,y,r,sx,sy};
}

/* Amplitude is in px AT THE EYES, and it has to be sized in degrees or it comes
   out invisible: the lever from eye to neck pivot is ~580px, so even a slight
   0.6 deg nod carries the eyes ~6px. A first pass at ~1px looked like nothing
   at all - that is 0.1 deg, ten times under a real one. */
function planNod(now){
  nods.push({t0:now,a:(speaking?1.0:0.6)*(4.1+Math.random()*4.7),
             d:360+Math.random()*240,n:Math.random()<0.3?2:1});
  nextNod=now+(speaking?1500+Math.random()*2800:4500+Math.random()*9000);
}
function nodAt(now){
  let v=0;
  for(const g of nods){
    const t=(now-g.t0)/g.d;
    if(t>=0&&t<g.n)v+=g.a*Math.sin(2*Math.PI*t)*Math.exp(-1.5*t);
  }
  return v;
}
function planTilt(now){
  tilt={a:(Math.random()<0.5?-1:1)*(0.25+Math.random()*0.45),t0:now,
        ti:380+Math.random()*320,hold:700+Math.random()*2300,
        to:600+Math.random()*700};
  nextTilt=now+5000+Math.random()*11000;
}
function tiltAt(now){
  const e=now-tilt.t0;if(e<0)return 0;
  if(e<tilt.ti)return tilt.a*ease(e/tilt.ti);
  if(e<tilt.ti+tilt.hold)return tilt.a;
  const k=(e-tilt.ti-tilt.hold)/tilt.to;
  return k>=1?0:tilt.a*(1-ease(k));
}
function headAt(now){
  const t=now/1000,energy=presenceAt(now);
  // The presence envelope deliberately spends long periods near stillness.
  // Noise supplies variation; the envelope supplies restraint and prevents
  // the familiar always-bobbing desktop-mascot cadence.
  return {x:energy*(3.4*vn(t*0.17,1)+1.5*vn(t*0.43,2)+0.55*vn(t*1.05,3)),
          y:energy*(2.3*vn(t*0.21,4)+1.0*vn(t*0.51,5)+0.35*vn(t*1.25,6))
            +nodAt(now),
          r:energy*(0.40*vn(t*0.11,7)+0.15*vn(t*0.33,8))+tiltAt(now)};   // degrees
}

/* ---- brow -----------------------------------------------------------------
   Humans punctuate speech with their brows almost continuously - a raise on a
   stressed word, a knit while weighing something. A frozen brow over a moving
   mouth is the second corpse tell. Two drivers: a fast follower on the audio
   level for per-syllable accents, and scheduled gestures for the deliberate
   ones. The two brows are deliberately not identical.                        */
let browAmp=0,browT0=-1e9,browDur=1,browEnv=0,nextBrow=performance.now()+2200;
const BROW_ASYM=0.86+Math.random()*0.1;

function planBrow(now){
  const r=Math.random();
  if(speaking){
    if(r<0.52){browAmp=0.9+Math.random()*1.1;browDur=260+Math.random()*360;}
    else if(r<0.80){browAmp=2.0+Math.random()*1.3;browDur=340+Math.random()*460;}
    else{browAmp=-(0.5+Math.random()*0.9);browDur=380+Math.random()*560;}
    nextBrow=now+650+Math.random()*1700;
  }else{
    if(r<0.55){browAmp=0.5+Math.random()*0.8;browDur=420+Math.random()*700;}
    else if(r<0.82){browAmp=-(0.4+Math.random()*0.7);browDur=600+Math.random()*900;}
    else{browAmp=1.4+Math.random()*1.1;browDur=350+Math.random()*450;}
    nextBrow=now+2400+Math.random()*4600;
  }
  browT0=now;
}
function browGesture(now){
  const ms=now-browT0;
  if(ms<0||ms>browDur+320)return 0;
  const u=Math.min(1,ms/130),rise=u*u*(3-2*u);   // muscle, not a step function
  const f=ms>browDur?Math.max(0,1-(ms-browDur)/300):1;
  return browAmp*rise*f*f;
}
function browFor(now,side,lid){
  const t=now/1000,k=side==='l'?BROW_ASYM:1;
  const drift=0.20*Math.sin(t*0.31+(side==='l'?1.7:0))+0.11*Math.sin(t*0.73);
  const v=(browGesture(now)+1.1*browEnv)*k+drift-0.4*lid;
  return v<-1.5?-1.5:v>3.5?3.5:v;
}

/* ---- cheek ----------------------------------------------------------------
   The warmth cue, and the one layer that could not be built the obvious way: a
   warp of bare cheek skin is invisible, because there is no texture there to
   carry a two-pixel shift. What actually shows a cheek raise is the structure
   along its TOP edge - the lower lid margin lifting, the lash line with it - so
   the layer is anchored there and fades downward over the malar.

   SECOND CUT. The first version drove this off LOUDNESS, through two more
   low-passes stacked on an already smoothed level, then snapped the result to a
   0.65px ladder. Through continuous speech the value sat at sd 0.27px - under
   half a step - so the painted state never moved: 0.51 changes per second
   against the brow's 4.98. A cheek that holds still while the mouth works is
   the tell, and no amount of extra gain on a DC signal fixes it.

   Loudness was the wrong driver anyway. The malar is dragged by the LIP
   CORNERS, so the apple follows the SHAPE of the mouth: wide spreads (E, ih,
   SS, CH) haul it up, an open aa stretches it up and out over the zygomatic,
   rounded oh/ou hollow it, and PP/FF recruit no cheek at all. Loudness only
   decides how hard each shape is hit. So the target is a per-viseme
   coefficient riding the same cross-fade the lips ride, and the follower is
   quick enough to keep up with a syllable - about 55ms to recruit and 130ms to
   let go, because muscle pulls faster than it releases.

   It idles just off zero rather than at zero: a face held at dead neutral is
   the resting state of someone who has stopped listening. */
const CHEEK_V={sil:0,PP:.05,FF:.10,TH:.22,DD:.26,kk:.30,CH:.62,SS:.58,nn:.24,
               RR:.14,aa:.55,E:.85,ih:.72,oh:.20,ou:.06};
const CHEEK_ASYM=0.93+Math.random()*0.06;  // two cheeks are never a matched pair
let cheek=0,cheekT=-1;
const JAW_V={sil:0,PP:0,FF:.10,TH:.16,DD:.18,kk:.28,CH:.16,SS:.12,nn:.14,
             RR:.13,aa:1,E:.62,ih:.38,oh:.56,ou:.20};
let jaw=0,jawT=-1;
function jawFor(now,mix){
  const a=JAW_V[prevV]||0,b=JAW_V[curV]||0;
  const shape=a+(b-a)*mix;
  const target=(speaking?shape:0)*(0.70+0.30*Math.min(1,lvl*6));
  const dt=jawT<0?16:Math.min(80,now-jawT);jawT=now;
  jaw+=(target-jaw)*(1-Math.exp(-dt/(target>jaw?55:95)));
  return jaw*2.4;
}
function cheekFor(now,lid,mix){
  const top=(M.cheek&&M.cheek.ups[M.cheek.ups.length-1])||2.7;
  let tgt;
  if(speaking){
    const a=CHEEK_V[prevV]||0,b=CHEEK_V[curV]||0;
    const shape=a+(b-a)*mix;                 // the same dissolve the lips ride
    tgt=top*(0.14+0.86*shape)*(0.55+0.65*Math.min(1,lvl*7))+0.22*browEnv;
  }else{
    tgt=top*(0.10+0.14*(vn(now/1000*0.13,11)+1)/2);
  }
  const dt=cheekT<0?16:Math.min(80,now-cheekT);cheekT=now;
  cheek+=(tgt-cheek)*(1-Math.exp(-dt/(tgt>cheek?55:130)));
  const v=cheek+0.30*lid;              // a blink squeezes the lower lid up too
  return v<0?0:v>top?top:v;
}

/* Nearest baked state, no cross-fade. Blending two baked warps doubles every
   hard edge inside the patch at partial alpha - the limbus for gaze, the brow
   hairs for brow. Both grids are fine enough (a quarter pixel, half a pixel)
   that snapping is below the threshold for seeing steps but well above the
   threshold for seeing a double image. */
function nearest(vals,v){
  let i=0,d=1e9;
  for(let j=0;j<vals.length;j++){const e=Math.abs(vals[j]-v);if(e<d){d=e;i=j;}}
  return i;
}
/* Everything below draws in KEYFRAME pixels. The canvas fit and the head-on-neck
   affine are already on the context, so a patch just goes at its own box and is
   carried, sheared and tapered exactly as the face under it is. */
function drawSnap(img,geom,vals,v,row){
  if(!img)return;
  const g=geom.box,ew=g[2],eh=g[3];
  ctx.drawImage(img,0,(nearest(vals,v)+(row||0)*vals.length)*eh,ew,eh,
                g[0],g[1],ew,eh);
}

/* Anatomical order, and it matters: the brow slides the skin, the cheek lifts
   the lid margin from below, the eyeball turns under both, and the lid occludes
   the eyeball. Paint them in any other order and a blink stamps the eyes back
   to centre. */
function drawFace(lids,gv,bv,ck){
  if(M.brow)for(const s of ['l','r'])
    drawSnap(BW[s],M.brow[s],M.brow.dys,bv[s],0);
  if(M.cheek)for(const s of ['l','r'])
    drawSnap(CK[s],M.cheek[s],M.cheek.ups,ck[s],0);
  if(M.gaze){
    const row=nearest(M.gaze.dys,gv.y);
    for(const s of ['l','r'])drawSnap(GZ[s],M.gaze[s],M.gaze.dxs,gv.x,row);
  }
  drawEyes(lids);
}

function drawEyes(lids){
  const st=M.eyes.states,n=st.length;
  for(const side of ['l','r']){
    const img=EYE[side],L=lids[side];
    if(!img||L<=0.004)continue;
    const g=M.eyes[side].box,ew=g[2],eh=g[3];
    let hi=0;while(hi<n-1&&st[hi]<L)hi++;         // straddle the two nearest states
    const lo=hi-1,a=lo<0?L/st[0]:(L-st[lo])/(st[hi]-st[lo]);
    if(lo>=0)ctx.drawImage(img,0,lo*eh,ew,eh,g[0],g[1],ew,eh);
    ctx.globalAlpha=a<0?0:a>1?1:a;
    ctx.drawImage(img,0,hi*eh,ew,eh,g[0],g[1],ew,eh);
    ctx.globalAlpha=1;
  }
}
const td=new Uint8Array(2048),fd=new Uint8Array(512);

function level(){
  if(monitorEnabled)return externalAudio.rms;
  if(!analyser)return 0;
  analyser.getByteTimeDomainData(td);
  let s=0;for(let i=0;i<td.length;i++){const v=(td[i]-128)/128;s+=v*v;}
  return Math.sqrt(s/td.length);
}

function availablePose(...names){
  const valid=new Set((M&&M.visemes)||[]);
  return names.find(name=>valid.has(name))||'sil';
}
function byExternalEnergy(){
  /* Spectral ratios only decide the shape. Loudness must never pick viseme
     identity - volume ripple inside a single vowel would flip the mouth and
     reset the vote (51 of the 234 measured flips came from RMS crossing
     0.045 while the spectrum stayed put). Loudness already drives jaw
     opening through lvl in jawFor(); the 0.0025 floor only gates silence. */
  if(!externalAudio.active||externalAudio.rms<0.0025)return'sil';
  const total=externalAudio.low+externalAudio.mid+externalAudio.high+1e-6;
  const low=externalAudio.low/total,mid=externalAudio.mid/total,high=externalAudio.high/total;
  if(high>0.43||externalAudio.zcr>0.16)
    return availablePose(high>0.54?'SS':'CH','E','ih');
  if(low>0.58)return availablePose(mid>0.24?'aa':'oh','ou','ih');
  if(mid>0.40)return availablePose(high>0.22?'E':'ih','aa');
  return availablePose(low>0.45?'oh':'ou','ih');
}

/* fallback only: no track, so infer a coarse shape from spectrum */
function byEnergy(){
  if(lvl<0.035)return'sil';
  analyser.getByteFrequencyData(fd);
  const bin=(actx.sampleRate/2)/fd.length;let lo=0,hi=0;
  for(let i=0;i<fd.length;i++){const f=i*bin;
    if(f>=120&&f<900)lo+=fd[i];else if(f>=1400&&f<4200)hi+=fd[i];}
  const hr=hi/(lo+hi+1e-6);
  if(lvl>0.20&&hr<0.30)return'aa';
  if(hr>0.42)return'E';
  if(lvl>0.10)return'oh';
  return'ou';
}

function timedPose(){
  const t=actx.currentTime-audioT0+VISUAL_LEAD;
  if(t<0)return'sil';
  while(tIdx+1<track.length&&track[tIdx+1][0]<=t)tIdx++;
  return track[tIdx][1];
}
function wanted(now=performance.now()/1000){
  // Her own reply owns the mouth while it plays, even in monitor mode:
  // a push-to-talk answer must not be mimed to EnConvo's audio.
  if(localSource&&track.length)return timedPose();
  if(monitorEnabled)return externalPose;
  if(!speaking)return'sil';
  if(track.length)return timedPose();
  return byEnergy();
}

function renderFaceSurface(ref,eyes,mix,h,lids,gv,bv,ck,jawPx,ts){
  if(faceSurface.width!==ref.width||faceSurface.height!==ref.height){
    faceSurface.width=ref.width;faceSurface.height=ref.height;
    headSurface.width=ref.width;headSurface.height=ref.height;
  }
  const mainContext=ctx;ctx=faceCtx;
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  ctx.clearRect(0,0,faceSurface.width,faceSurface.height);
  const N=M.neck||{ref:406,pivot:985,x:512};
  const lever=N.pivot-N.ref,th=h.r*Math.PI/180,kx=h.x/lever,dy=h.y;
  const Yj=N.jaw||(N.pivot-0.32*lever),Ym=N.mouth||(N.ref+0.42*lever),HK=ref.height;
  const br=-0.9*(0.5+0.5*vn(ts*0.21,12))*(0.55+0.45*vn(ts*0.07,13));
  ctx.translate(N.x,N.pivot);ctx.rotate(th);ctx.translate(-N.x,-N.pivot);
  ctx.transform(1,0,-kx,1,kx*N.pivot,0);
  const bands=[[0,Ym,dy,Ym+dy],[Ym,Yj,Ym+dy,Yj+dy+jawPx],
               [Yj,N.pivot,Yj+dy+jawPx,N.pivot+br],[N.pivot,HK,N.pivot+br,HK]];
  const plate=image=>{for(const band of bands){
    const sourceHeight=band[1]-band[0],destinationHeight=band[3]-band[2];
    const scaleY=destinationHeight/sourceHeight;
    const sourceY=Math.max(0,band[0]-1),endY=Math.min(image.height,band[1]+1);
    const destinationY=band[2]+(sourceY-band[0])*scaleY;
    ctx.drawImage(image,0,sourceY,image.width,endY-sourceY,
                  0,destinationY,image.width,(endY-sourceY)*scaleY);
  }};
  if(mix<1&&IMG[prevV]){
    plate(IMG[prevV][eyes]||IMG[prevV].open);ctx.globalAlpha=mix;
  }
  plate(ref);ctx.globalAlpha=1;
  if(M.eyes){ctx.translate(0,dy);drawFace(lids,gv,bv,ck);}
  ctx.setTransform(1,0,0,1,0,0);
  if(CUTOUT){
    ctx.globalCompositeOperation='destination-in';ctx.drawImage(CUTOUT,0,0,faceSurface.width,faceSurface.height);
    ctx.globalCompositeOperation='source-over';
  }
  ctx=mainContext;

  if(BODY&&HEADMASK){
    headCtx.setTransform(1,0,0,1,0,0);headCtx.globalAlpha=1;
    headCtx.globalCompositeOperation='source-over';
    headCtx.clearRect(0,0,headSurface.width,headSurface.height);
    headCtx.drawImage(faceSurface,0,0);
    headCtx.globalCompositeOperation='destination-in';
    headCtx.drawImage(HEADMASK,0,0,headSurface.width,headSurface.height);
    headCtx.globalCompositeOperation='source-over';
  }
}

function clampCrop(crop,width,height){
  crop.w=Math.max(1,Math.min(width,crop.w));crop.h=Math.max(1,Math.min(height,crop.h));
  crop.x=Math.max(0,Math.min(width-crop.w,crop.x));
  crop.y=Math.max(0,Math.min(height-crop.h,crop.y));
  return crop;
}
function viewCrop(meta,width,height){
  const bounds=meta.bounds||[0,0,width,height],faceBounds=(meta.alignment&&meta.alignment.face_bounds)||
    [width*.22,height*.10,width*.56,height*.42];
  const [bx,by,bw,bh]=bounds,[fx,fy,fw,fh]=faceBounds;
  const view=PET.roam?'full':(PET.view||'half');
  let crop;
  if(view==='full')crop={x:bx-bw*.05,y:by-bh*.025,w:bw*1.10,h:bh*1.05};
  else if(view==='three-quarter')crop={x:bx-bw*.04,y:by-bh*.025,w:bw*1.08,h:bh*.82};
  else if(view==='half')crop={x:bx-bw*.035,y:by-bh*.02,w:bw*1.07,h:bh*.62};
  else if(view==='bust')crop={x:fx-fw*.72,y:fy-fh*.48,w:fw*2.44,h:fh*2.85};
  else if(view==='face')crop={x:fx-fw*.27,y:fy-fh*.25,w:fw*1.54,h:fh*1.48};
  else crop={x:fx-fw*.52,y:fy-fh*.42,w:fw*2.04,h:fh*2.10};
  /* Hair volume varies far more than skull geometry does, so on any frame that
     claims to show the whole head the SILHOUETTE top - not the face box - owns
     the top edge.  A face box sits at the hairline: 0.42 face-heights above it
     covers a flat crop and decapitates a blow-dry. */
  if(view==='bust'||view==='head'||!['full','three-quarter','half','face'].includes(view)){
    const crown=by-Math.max(4,crop.h*.03);
    if(crop.y>crown){crop.h+=crop.y-crown;crop.y=crown;}
  }
  return clampCrop(crop,width,height);
}
function petCamera(meta,width,height){
  const crop=viewCrop(meta,width,height);
  const margin=PET.roam?0.985:(PET.view==='full'?0.94:0.98);
  const scale=Math.min(cv.width/crop.w,cv.height/crop.h)*margin;
  const x=cv.width/2-(crop.x+crop.w/2)*scale;
  const y=PET.roam?cv.height*.995-(crop.y+crop.h)*scale:
    cv.height/2-(crop.y+crop.h/2)*scale;
  return {scale,x,y,crop};
}
const ROAM_BOX={width:250,height:340};
const ROAM_ZOOM={min:.5,max:3};
function roamZoomValue(){
  const value=Number(PET.roamZoom);
  return Math.max(ROAM_ZOOM.min,Math.min(ROAM_ZOOM.max,
    Number.isFinite(value)&&value>0?value:1));
}
// Walk speed and stride length live in the same CSS space as the roam window,
// so a resized animation has to re-publish its profile or she moonwalks.
function syncMotionProfile(){
  if(!SHELL||!SHELL.isElectron||typeof SHELL.setPetMotionReady!=='function')return;
  if(!MOTION||!MOTION.walk)return;
  const zoom=roamZoomValue();
  if(motionProfileZoom!==null&&Math.abs(motionProfileZoom-zoom)<.001)return;
  motionProfileZoom=zoom;
  SHELL.setPetMotionReady(motionPlaybackProfile());
}
function motionPlaybackProfile(){
  const clip=MOTION&&MOTION.walk;if(!clip)return{ready:false};
  const bounds=clip.bounds||[0,0,clip.frame_width||256,clip.frame_height||384];
  const roamZoom=roamZoomValue();
  const cssScale=Math.min(ROAM_BOX.width*roamZoom/Math.max(1,bounds[2]),
    ROAM_BOX.height*roamZoom/Math.max(1,bounds[3]))*.985;
  const cycleSeconds=Number(clip.cycle_seconds)||Math.max(.1,Number(clip.frames||1)/Math.max(1,Number(clip.fps||1)));
  const groundSpeed=Number(clip.ground_speed)||64/cssScale;
  const cycleDistance=(Number(clip.cycle_distance)||groundSpeed*cycleSeconds)*cssScale;
  const travelOffsets=Array.isArray(clip.travel_offsets)?
    clip.travel_offsets.map(value=>Number(value)*cssScale).filter(Number.isFinite):[];
  return{ready:true,walkSpeed:groundSpeed*cssScale,cycleSeconds,cycleDistance,travelOffsets};
}

function motionFrameAt(kind,now){
  const clip=MOTION[kind];if(!clip||!clip.frames)return null;
  const phase=kind==='walk'&&ROAM.enabled?((Number(ROAM.phase)||0)%1+1)%1:null;
  const index=phase===null?Math.floor(now/1000*(clip.fps||12))%clip.frames:Math.min(clip.frames-1,Math.floor(phase*clip.frames));
  const sheet=clip.sheets.find(candidate=>index>=candidate.first&&index<candidate.first+candidate.count);
  if(!sheet)return null;
  const local=index-sheet.first,column=local%sheet.columns,row=Math.floor(local/sheet.columns);
  return {clip,sheet,index,sx:column*clip.frame_width,sy:row*clip.frame_height};
}
function drawMotionClip(kind,now){
  const frame=motionFrameAt(kind,now);if(!frame)return false;
  const clip=frame.clip,width=clip.frame_width,height=clip.frame_height;
  const meta={bounds:clip.bounds||[0,0,width,height]};
  const camera=petCamera(meta,width,height);
  const mirror=kind==='walk'?ROAM.direction<0:ROAM.edge==='right';
  if(kind==='idle'&&ROAM.edge){
    const anchors=clip.edge_anchors||{left:(clip.bounds||[0])[0]||0};
    const frameSupports=Array.isArray(anchors.left_frames)?anchors.left_frames:[];
    const frameSupport=Number(frameSupports[frame.index]);
    const support=Number.isFinite(frameSupport)?frameSupport:(Number(anchors.left)||0);
    const wallPadding=3;
    camera.x=ROAM.edge==='left'?wallPadding-support*camera.scale:
      cv.width-wallPadding-(width-support)*camera.scale;
  }
  ctx.save();ctx.setTransform(camera.scale,0,0,camera.scale,camera.x,camera.y);
  if(mirror){ctx.translate(width,0);ctx.scale(-1,1);}
  ctx.drawImage(frame.sheet.image,frame.sx,frame.sy,width,height,0,0,width,height);
  ctx.restore();return true;
}
function drawPetScene(now){
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  ctx.clearRect(0,0,cv.width,cv.height);
  const motionKind=PET.roam&&ROAM.enabled?
    (ROAM.mode==='walk'?'walk':ROAM.mode.startsWith('ledge-')?'idle':null):null;
  if(motionKind&&drawMotionClip(motionKind,now))return;
  const hasBody=Boolean(BODY&&HEADMASK&&M.body);
  const source=hasBody?BODY:faceSurface;
  const width=source.width,height=source.height;
  const fallback={bounds:(M.cutout&&M.cutout.bounds)||[0,0,width,height],
    alignment:{face_bounds:[width*.20,height*.10,width*.60,height*.62]}};
  const meta=hasBody?M.body:fallback,camera=petCamera(meta,width,height);
  const motion=bodyAt(now,width,height),bounds=meta.bounds||[0,0,width,height];
  const pivotX=bounds[0]+bounds[2]/2,pivotY=bounds[1]+bounds[3];
  ctx.save();ctx.setTransform(camera.scale,0,0,camera.scale,camera.x,camera.y);
  ctx.translate(pivotX+motion.x,pivotY+motion.y);ctx.rotate(motion.r);ctx.scale(motion.sx,motion.sy);
  ctx.translate(-pivotX,-pivotY);
  if(hasBody){
    ctx.drawImage(BODY,0,0);
    drawLimbReaction(now);
    const matrix=M.body.face_transform;
    if(matrix&&matrix.length===2){
      ctx.save();ctx.transform(matrix[0][0],matrix[1][0],matrix[0][1],matrix[1][1],matrix[0][2],matrix[1][2]);
      ctx.drawImage(headSurface,0,0);ctx.restore();
    }
  }else ctx.drawImage(faceSurface,0,0);
  ctx.restore();
}

function syncPetEngagement(now=performance.now()){
  if(!SHELL||!SHELL.isElectron||typeof SHELL.setPetEngaged!=='function')return;
  if(petHit)petHoverUntil=now+1400;
  const chatOpen=document.documentElement.classList.contains('chat-open');
  const engaged=Boolean(PET.roam&&(speaking||recording||petHit||now<petHoverUntil||chatOpen));
  if(engaged===petEngaged)return;
  petEngaged=engaged;SHELL.setPetEngaged(engaged);
}
function loop(now){
  requestAnimationFrame(loop);if(!ready)return;
  syncPetEngagement(now);
  const ts=now/1000;
  lvl=lvl*0.55+level()*0.45;
  if(monitorEnabled&&externalAudio.receivedAt&&now-externalAudio.receivedAt>550){
    externalAudio.active=false;externalAudio.receivedAt=0;speaking=false;
    resetExternalViseme(Date.now());
    monitorButton.classList.remove('active');renderMonitorStatus();
  }

  const w=wanted(ts);
  if(w!==curV){prevV=curV;curV=w;switchAt=ts;}
  const xfade=monitorEnabled?EXTERNAL_XFADE:XFADE;
  const mu=xfade?Math.min(1,(ts-switchAt)/xfade):1;
  const mix=mu*mu*(3-2*mu);

  if(now>nextBlink)planBlink(now);
  while(blinks.length&&now-blinks[0].t0>1500)blinks.shift();
  if(now>nextBrow)planBrow(now);
  // brow accent follower: fires only on the louder moments, and relaxes slower
  // than it fires, the way muscle does
  const bt=speaking?Math.max(0,Math.min(1,lvl*8-0.35)):0;
  browEnv+=(bt-browEnv)*(bt>browEnv?0.18:0.05);

  // Head movement, held in KEYFRAME px because the eye counter-rotation below
  // is derived from it and must not change with the window size. Never drive
  // this from discrete visemes: that steps the lash position at every switch.
  if(now>nextNod)planNod(now);
  while(nods.length&&now-nods[0].t0>2200)nods.shift();
  if(now>nextTilt)planTilt(now);
  const h=cursorHeadFor(headAt(now));

  const N=M.neck||{ref:406,pivot:985,x:512};
  const lever=N.pivot-N.ref;               // eyes to neck pivot, in keyframe px
  const gv=gazeFor(now,h,lever);           // eyes hold the lens while that moves
  const cg=cursorGazeFor(now);             // ...unless your cursor is moving nearby
  if(cg){gv.x+=(cg.x-gv.x)*cg.w;gv.y+=(cg.y-gv.y)*cg.w;}

  const lids={l:lidFor(now,'l'),r:lidFor(now,'r')};
  const bv={l:browFor(now,'l',lids.l),r:browFor(now,'r',lids.r)};
  const c0=cheekFor(now,(lids.l+lids.r)/2,mix);
  const ck={l:c0*CHEEK_ASYM,r:c0};
  const jawPx=jawFor(now,mix);
  const legacy=!M.eyes;                    // pre-v2 asset set: two states, no travel
  const eyes=legacy&&(lids.l+lids.r)/2>0.5?'shut':'open';

  const ref=IMG[curV][eyes]||IMG[curV].open;
  renderFaceSurface(ref,eyes,mix,h,lids,gv,bv,ck,jawPx,ts);
  drawPetScene(now);updatePetHit();
  if(false){
  const cw=cv.width,ch=cv.height;
  /* The head band travels on its own now, so the plate has to sit far enough
     off the top of the canvas that a nod cannot expose backdrop above the
     crown. Solve the fit for that headroom instead of guessing an overscan. */
  const HEADROOM=20;                                       // keyframe px
  const sc=Math.max(Math.max(cw/ref.width,ch/ref.height)*1.06,
                    0.455*ch/(ref.height/2-HEADROOM));
  const x0=(cw-ref.width*sc)/2, y0=(ch-ref.height*sc)/2-ch*0.045;

  /* ---- head on neck, second cut -------------------------------------------
     The first cut did all three channels with ONE affine, and that is exactly
     where the periodic squash came from. In an affine the y-translation
     GRADIENT and the y-SCALE are the same coefficient: asking the crown to
     travel 1.49x the chin is literally asking for d=1-h.y/lever. Measured, the
     skull ran 678px crown-to-chin down to 670px and back on every nod - 1.46%
     peak to peak, cycling with the nod schedule. That is what reads as a hand
     pressing down on the head. A skull is bone; it cannot shorten.

     What shortens in a real nod is the NECK - the chin closes toward the chest.
     And the vertical motion itself is very nearly rigid: a nod turns about the
     ear axis, OUT of the image plane, so to first order every point of the face
     drops by the same amount and the shape change is second order, a few tenths
     of a percent. The old model put 1.5% of squash on a motion whose true
     squash is ~0.4%, and spread it across the skull instead of the neck.

     So the vertical channel is now piecewise: rigid across the skull, the whole
     taper spent in the neck, zero at the collar. Canvas samples cropped
     drawImage rectangles independently, so mathematically touching edges can
     expose a one-device-pixel antialias crack. Each band therefore overscans
     its neighbours by one source pixel, guaranteeing opaque coverage.

     the neck pivot, then a shear in x. Both have determinant 1, so neither one

  const th=h.r*Math.PI/180, kx=h.x/lever, dy=h.y;
  const Yj=N.jaw||(N.pivot-0.32*lever);    // jaw line: bottom of the rigid skull
  const Ym=N.mouth||(N.ref+0.42*lever);    // upper-lip hinge stays skull-rigid
  const HK=ref.height;
  /* Breathing is the chest, not the camera. The old build scaled the ENTIRE
     plate - backdrop included - on a 7.4s sine, which is a zoom, and a
     metronome. This lifts the collar under a shorter noise instead, and the
     neck band carries it up to the jaw. */
  const br=-0.9*(0.5+0.5*vn(ts*0.21,12))*(0.55+0.45*vn(ts*0.07,13));

  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#0b0d10';ctx.fillRect(0,0,cw,ch);
  ctx.save();
  ctx.setTransform(sc,0,0,sc,x0,y0);                       // keyframe px -> canvas
  ctx.translate(N.x,N.pivot);ctx.rotate(th);ctx.translate(-N.x,-N.pivot);
  ctx.transform(1,0,-kx,1,kx*N.pivot,0);                   // sway: x taper only
  const BND=[[0,Ym,dy,Ym+dy],
             [Ym,Yj,Ym+dy,Yj+dy+jawPx],
             [Yj,N.pivot,Yj+dy+jawPx,N.pivot+br],
             [N.pivot,HK,N.pivot+br,HK]];

  const plate=img=>{for(const b of BND){
    const srcH=b[1]-b[0],dstH=b[3]-b[2],scaleY=dstH/srcH;
    const sy=Math.max(0,b[0]-BAND_PAD);
    const ey=Math.min(img.height,b[1]+BAND_PAD);
    const dy0=b[2]+(sy-b[0])*scaleY;
    ctx.drawImage(img,0,sy,img.width,ey-sy,
                  0,dy0,img.width,(ey-sy)*scaleY);
  }};
  // Every frame shares an identical background, so a straight cross-dissolve
  // between two full frames reads purely as the mouth morphing.
  if(mix<1&&IMG[prevV]){ctx.globalAlpha=1;
                        plate(IMG[prevV][eyes]||IMG[prevV].open);
                        ctx.globalAlpha=mix;}
  plate(ref);
  ctx.globalAlpha=1;
  // Eyes go on last, so a mouth cross-dissolve can never ghost them - and they
  // sit on the skull, so they ride the rigid band with it.
  if(!legacy){ctx.translate(0,dy);drawFace(lids,gv,bv,ck);}
  ctx.restore();
  }

  elVz.textContent=speaking?curV:'';
  elVz.className=speaking?'on':'';
}

const history=[];
let localSource=null;

async function speak(b64,tr){
  actx=actx||new AudioContext();
  if(actx.state==='suspended')await actx.resume();
  const bin=atob(b64),u8=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
  const buf=await actx.decodeAudioData(u8.buffer);
  const src=actx.createBufferSource();src.buffer=buf;localSource=src;
  analyser=actx.createAnalyser();analyser.fftSize=2048;analyser.smoothingTimeConstant=0.6;
  src.connect(analyser);analyser.connect(actx.destination);
  track=stabiliseTrack(tr,buf.duration);tIdx=0;
  // Schedule slightly ahead so the audio clock and the first shape agree.
  audioT0=actx.currentTime+0.06;
  speaking=true;src.start(audioT0);
  await new Promise(r=>{src.onended=r});
  if(localSource===src)localSource=null;
  speaking=monitorEnabled&&externalAudio.active;track=[];curV='sil';
}

  ptt.disabled=true;elYou.textContent=text;setCaption('');

  history.push({role:'user',content:text});

  try{
    const r=await(await fetch('reply',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({history})})).json();
    llmRoute=r.llm_route||null;
    history.push({role:'assistant',content:r.text});
    // A pet-initiated question deserves a spoken answer even while the
    // monitor is lip-syncing EnConvo; only unspoken chat turns defer to it.
    if(monitorEnabled&&!spoken){renderMonitorStatus();return;}
    setCaption(r.text);
    setStatus('speaking','on');
    await speak(r.audio,r.track);
  }catch(e){setCaption('(something broke: '+e.message+')');}
  if(monitorEnabled)renderMonitorStatus();else setStatus(routedStatus(llmRoute),'on');
  ptt.disabled=monitorEnabled;
}

let rec=null,chunks=[],recording=false,providerReady=false;
async function startRec(force=false){
  // Monitor mode locks the chat button, but head push-to-talk on the pet
  // must still work while she lip-syncs EnConvo, so it forces past the lock.
  if(recording||(!force&&(monitorEnabled||ptt.disabled)))return;
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:true});}
  catch(e){setStatus('microphone blocked','');return;}
  rec=new MediaRecorder(stream);chunks=[];
  rec.ondataavailable=e=>chunks.push(e.data);
  rec.onstop=async()=>{
    stream.getTracks().forEach(t=>t.stop());
    const blob=new Blob(chunks,{type:rec.mimeType||'audio/webm'});
    if(blob.size<3000){setStatus('ready','on');ptt.disabled=monitorEnabled;return;}
    ptt.disabled=true;setStatus('transcribing','busy');
    try{
      const fd2=new FormData();fd2.append('audio',blob,'a.webm');
      const r=await(await fetch('stt',{method:'POST',body:fd2})).json();
      if(!r.text){setStatus('ready','on');ptt.disabled=monitorEnabled;return;}
      await turn(r.text,true);
    }catch(e){setStatus('ready','on');ptt.disabled=monitorEnabled;}
  };
  rec.start();recording=true;ptt.classList.add('rec');setStatus('listening','rec');
}
function stopRec(){if(!recording)return;recording=false;ptt.classList.remove('rec');rec.stop();}

function updatePetHit(force=false){
  if(!SHELL||!SHELL.isElectron||!PET.enabled)return;
  const now=performance.now();if(!force&&now-lastHitCheck<34)return;lastHitCheck=now;
  const chatOpen=document.documentElement.classList.contains('chat-open');
  const modalHit=chatOpen||!document.getElementById('emptyState').hidden;
  let sample=modalHit;
  if(!sample&&ready&&pointer.x>=0&&pointer.y>=0&&pointer.x<innerWidth&&pointer.y<innerHeight){
    const ratio=devicePixelRatio||1,x=Math.floor(pointer.x*ratio),y=Math.floor(pointer.y*ratio);
    try{sample=ctx.getImageData(x,y,1,1).data[3]>14;}catch(error){sample=false;}
  }
  if(modalHit)hitConfidence=1;
  else if(force)hitConfidence=sample?1:0;
  else hitConfidence=Math.max(0,Math.min(1,hitConfidence+(sample?.32:-.08)));
  const hit=hitConfidence>=.56?true:hitConfidence<=.18?false:petHit;
  if(hit===petHit){if(hit)petHoverUntil=now+1400;return;}
  petHit=hit;if(hit)petHoverUntil=now+1400;
  SHELL.setPetHit(hit);syncPetEngagement(now);
}
function closePetChat(){
  document.documentElement.classList.remove('chat-open');
  updatePetHit(true);
}
if(HAS_GLOBAL_PET_POINTER)SHELL.onPetPointer(point=>{
  if(!point)return;
  noteCursor(Number(point.x),Number(point.y));
  if(dragging)return;
  // Off-window coordinates feed the gaze only; hit testing keeps its
  // in-window sentinel so click-through behaviour is unchanged.
  const inside=point.inside!==undefined
    ?Boolean(point.inside)
    :point.x>=0&&point.y>=0;
  pointer=inside?{x:Number(point.x),y:Number(point.y)}:{x:-1,y:-1};
  updatePetHit();
});
addEventListener('pointermove',event=>{
  if(!HAS_GLOBAL_PET_POINTER)noteCursor(event.clientX,event.clientY);
},{passive:true});
cv.addEventListener('pointermove',event=>{
  if(!HAS_GLOBAL_PET_POINTER)pointer={x:event.clientX,y:event.clientY};
  if(gesture&&!dragging&&!gesture.ptt&&
     Math.hypot(event.clientX-gesture.x0,event.clientY-gesture.y0)>TAP_SLOP_PX){
    if(gesture.timer){clearTimeout(gesture.timer);gesture.timer=0;}
    dragging=true;document.documentElement.classList.add('dragging');
    SHELL.beginPetDrag({screenX:gesture.sx,screenY:gesture.sy});
  }
  if(dragging){SHELL.movePetDrag({screenX:event.screenX,screenY:event.screenY});return;}
  if(!HAS_GLOBAL_PET_POINTER)updatePetHit();
});
cv.addEventListener('pointerleave',()=>{
  if(HAS_GLOBAL_PET_POINTER)return;
  pointer={x:-1,y:-1};
  if(!dragging&&!document.documentElement.classList.contains('chat-open'))updatePetHit(true);
});
function confirmPetEventHit(event){
  pointer={x:event.clientX,y:event.clientY};
  updatePetHit(true);
  return petHit;
}

/* ---- pet gestures ----------------------------------------------------------
   One mouse button carries three verbs, so pointerdown only ARMS a gesture:
   move past the slop and it is a drag (origin at the press point, so nothing
   jumps); hold the HEAD still and it is push-to-talk, released to send; a
   quick release is a tap and she acknowledges it. The head is resolved
   pixel-exactly by drawing the real head mask through the same camera and
   face transforms as the visible scene and sampling one pixel - no hit boxes,
   so a hand in front of the chest still counts as body. */
let gesture=null,petHitCanvas=null,petHitCtx=null,lastTapAt=0;
const TAP_SLOP_PX=4,HEAD_HOLD_MS=200,TAP_MS=350;
function pointerOnHead(x,y){
  if(!ready||!(BODY&&HEADMASK&&M.body))return false;
  const matrix=M.body.face_transform;
  if(!matrix||matrix.length!==2)return false;
  const ratio=devicePixelRatio||1;
  const px=Math.floor(x*ratio),py=Math.floor(y*ratio);
  if(px<0||py<0||px>=cv.width||py>=cv.height)return false;
  if(!petHitCanvas){
    petHitCanvas=document.createElement('canvas');
    petHitCtx=petHitCanvas.getContext('2d',{willReadFrequently:true});
  }
  petHitCanvas.width=cv.width;petHitCanvas.height=cv.height;
  const width=BODY.width,height=BODY.height;
  const camera=petCamera(M.body,width,height);
  const motion=bodyAt(performance.now(),width,height);
  const bounds=M.body.bounds||[0,0,width,height];
  const pivotX=bounds[0]+bounds[2]/2,pivotY=bounds[1]+bounds[3];
  petHitCtx.setTransform(camera.scale,0,0,camera.scale,camera.x,camera.y);
  petHitCtx.translate(pivotX+motion.x,pivotY+motion.y);
  petHitCtx.rotate(motion.r);petHitCtx.scale(motion.sx,motion.sy);
  petHitCtx.translate(-pivotX,-pivotY);
  petHitCtx.transform(matrix[0][0],matrix[1][0],matrix[0][1],matrix[1][1],matrix[0][2],matrix[1][2]);
  petHitCtx.drawImage(HEADMASK,0,0,headSurface.width,headSurface.height);
  try{return petHitCtx.getImageData(px,py,1,1).data[3]>40;}catch(error){return false;}
}
/* Holding her head presses EnConvo's voice hotkey (right Option) for real -
   held down while the head is held, released on release - so the question
   goes to EnConvo's own voice command and she lip-syncs the answer through
   the monitor, exactly like any other EnConvo reply. Vivieen's local
   hold-to-talk stays on the chat panel button only. */
function canPetTalk(){
  return Boolean(SHELL&&SHELL.isElectron&&typeof SHELL.petVoiceKey==='function');
}
/* ---- body-part hit testing -------------------------------------------------
   The skeleton baked at export classifies a click by its nearest bone
   segment, in plate coordinates recovered by inverting the same camera and
   sway transforms the scene is drawn with. The head stays mask-exact. */
function canvasToBody(x,y){
  if(!(BODY&&M.body))return null;
  const ratio=devicePixelRatio||1;
  const width=BODY.width,height=BODY.height;
  const camera=petCamera(M.body,width,height);
  let px=(x*ratio-camera.x)/camera.scale;
  let py=(y*ratio-camera.y)/camera.scale;
  const motion=bodyAt(performance.now(),width,height);
  const bounds=M.body.bounds||[0,0,width,height];
  const pivotX=bounds[0]+bounds[2]/2,pivotY=bounds[1]+bounds[3];
  const dx=px-(pivotX+motion.x),dy=py-(pivotY+motion.y);
  const c=Math.cos(-motion.r),s=Math.sin(-motion.r);
  return {x:(dx*c-dy*s)/motion.sx+pivotX,
          y:(dx*s+dy*c)/motion.sy+pivotY};
}
function petBodyPart(x,y){
  if(pointerOnHead(x,y))return 'head';
  const joints=M.body&&M.body.pose&&M.body.pose.joints;
  const point=joints?canvasToBody(x,y):null;
  if(!point)return 'body';
  const at=name=>{const j=joints[name];return j?[j.x,j.y]:null;};
  const segdist=(p,a,b)=>{
    const abx=b[0]-a[0],aby=b[1]-a[1];
    const t=Math.max(0,Math.min(1,
      ((p.x-a[0])*abx+(p.y-a[1])*aby)/Math.max(1e-6,abx*abx+aby*aby)));
    return Math.hypot(p.x-(a[0]+t*abx),p.y-(a[1]+t*aby));
  };
  const candidates=[];
  for(const side of ['left','right']){
    const key='arm_'+side[0],leg='leg_'+side[0];
    const shoulder=at(side+'_shoulder'),elbow=at(side+'_elbow'),
      wrist=at(side+'_wrist'),hip=at(side+'_hip'),
      knee=at(side+'_knee'),ankle=at(side+'_ankle');
    if(elbow&&wrist){
      const tip=[wrist[0]+(wrist[0]-elbow[0])*.4,
                 wrist[1]+(wrist[1]-elbow[1])*.4];
      candidates.push([key,Math.min(segdist(point,elbow,wrist),
                                    segdist(point,wrist,tip))]);
    }
    if(shoulder&&elbow)candidates.push([key,segdist(point,shoulder,elbow)]);
    if(hip&&knee)candidates.push([leg,segdist(point,hip,knee)]);
    if(knee&&ankle)candidates.push([leg,segdist(point,knee,ankle)]);
  }
  const ls=at('left_shoulder'),rs=at('right_shoulder'),
    lh=at('left_hip'),rh=at('right_hip');
  if(ls&&rs&&lh&&rh){
    const top=[(ls[0]+rs[0])/2,(ls[1]+rs[1])/2];
    const bottom=[(lh[0]+rh[0])/2,(lh[1]+rh[1])/2];
    // The spine is favoured slightly so central clicks read as torso even
    // though the hanging arms run close beside it.
    candidates.push(['torso',segdist(point,top,bottom)*.8]);
  }
  if(!candidates.length)return 'body';
  candidates.sort((a,b)=>a[1]-b[1]);
  const bodyHeight=(M.body.bounds||[0,0,0,BODY.height])[3];
  return candidates[0][1]<=bodyHeight*.14?candidates[0][0]:'body';
}

/* ---- limb reactions --------------------------------------------------------
   Baked warp states of the standing plate: rest -> peak -> rest over ~0.6s.
   Each state is a full replacement tile for its box, so the player clears
   the box and stamps the tile; first and last states ARE the plate. */
let REACT=null;
function startLimbReaction(name){
  const meta=M.body&&M.body.reactions&&M.body.reactions[name];
  if(!meta||!RB[name]||REACT)return false;
  REACT={name,meta,image:RB[name],start:performance.now(),dur:620};
  return true;
}
function drawLimbReaction(now){
  if(!REACT)return;
  const t=(now-REACT.start)/REACT.dur;
  if(t>=1){REACT=null;return;}
  const states=Math.max(1,REACT.meta.states||1);
  const index=Math.min(states-1,Math.round(Math.sin(Math.PI*t)*(states-1)));
  const box=REACT.meta.box;
  ctx.clearRect(box[0],box[1],box[2],box[3]);
  ctx.drawImage(REACT.image,0,index*box[3],box[2],box[3],
                box[0],box[1],box[2],box[3]);
}

function startPetTalk(){
  if(canPetTalk())SHELL.petVoiceKey('down');
}
function stopPetTalk(){
  if(canPetTalk())SHELL.petVoiceKey('up');
}
function petTapReaction(part){
  const now=performance.now();
  if(now-lastTapAt<700)return;
  lastTapAt=now;
  // Every tap gets an acknowledging nod; the touched part answers with its
  // own motion: arms lift their hand, the torso shrugs over a squash, legs
  // shift her weight onto the tapped side.
  nods.push({t0:now,a:part==='head'?7.6:5.6,d:part==='head'?460:400,n:1});
  nextNod=now+2400+Math.random()*2000;
  if(part==='arm_l'||part==='arm_r'){
    if(!startLimbReaction(part))tapPulse={t0:now,dir:part==='arm_l'?1:-1};
    return;
  }
  if(part==='torso'){
    startLimbReaction('shrug');
    tapPulse={t0:now,dir:cursorDir.x>=0?-1:1};
    return;
  }
  if(part==='leg_l'||part==='leg_r'){
    // Vision's left_* joints sit at higher x on this front plate, so her
    // tapped-side lean is positive shift for the left leg.
    weight={from:weight.from+(weight.to-weight.from)*
      Math.min(1,Math.max(0,(now-weight.t0)/weight.duration)),
      to:part==='leg_l'?0.95:-0.95,t0:now,duration:520};
    nextWeight=now+2600+Math.random()*1800;
    tapPulse={t0:now,dir:part==='leg_l'?-1:1};
    return;
  }
  tapPulse={t0:now,dir:cursorDir.x>=0?-1:1};
}
function clearGesture(){
  if(gesture&&gesture.timer)clearTimeout(gesture.timer);
  gesture=null;
}
cv.addEventListener('pointerdown',event=>{
  if(!SHELL||!PET.enabled||event.button!==0||PET.locked||PET.roam||!confirmPetEventHit(event))return;
  clearGesture();
  const part=petBodyPart(event.clientX,event.clientY);
  gesture={x0:event.clientX,y0:event.clientY,
    sx:event.screenX,sy:event.screenY,
    t0:performance.now(),ptt:false,
    part,head:part==='head'};
  cv.setPointerCapture(event.pointerId);
  if(gesture.head&&canPetTalk()){
    gesture.timer=setTimeout(()=>{
      if(!gesture||dragging)return;
      gesture.timer=0;gesture.ptt=true;
      startPetTalk();
    },HEAD_HOLD_MS);
  }
});
cv.addEventListener('pointerup',event=>{
  const active=gesture;
  clearGesture();
  try{cv.releasePointerCapture(event.pointerId);}catch(error){}
  if(dragging){
    dragging=false;document.documentElement.classList.remove('dragging');
    SHELL.endPetDrag();updatePetHit(true);
    return;
  }
  if(!active)return;
  if(active.ptt){stopPetTalk();return;}
  if(performance.now()-active.t0<=TAP_MS)petTapReaction(active.part||'body');
});
cv.addEventListener('pointercancel',event=>{
  const active=gesture;
  clearGesture();
  try{cv.releasePointerCapture(event.pointerId);}catch(error){}
  if(dragging){
    dragging=false;document.documentElement.classList.remove('dragging');
    SHELL.endPetDrag();updatePetHit(true);
  }
  if(active&&active.ptt)stopPetTalk();
});
cv.addEventListener('contextmenu',event=>{
  if(!SHELL||!PET.enabled||!confirmPetEventHit(event))return;
  event.preventDefault();SHELL.showPetMenu({x:event.screenX,y:event.screenY});
});
cv.addEventListener('dblclick',async event=>{
  if(!SHELL||!PET.enabled||PET.roam||!confirmPetEventHit(event)||typeof SHELL.setPetRoam!=='function')return;
  event.preventDefault();
  try{syncShellState(await SHELL.setPetRoam(true));}catch(error){}
});
const STAND_ZOOM={min:.25,max:4};
const ZOOM_SETTLE_MS=140;
function zoomRange(){return PET.roam?ROAM_ZOOM:STAND_ZOOM;}
function zoomValue(){
  const range=zoomRange(),value=Number(PET.roam?PET.roamZoom:PET.zoom);
  return Math.max(range.min,Math.min(range.max,
    Number.isFinite(value)&&value>0?value:1));
}
function holdZoom(value){if(PET.roam)PET.roamZoom=value;else PET.zoom=value;}
function wheelZoomFactor(event){
  const unit=event.deltaMode===1?16:event.deltaMode===2?innerHeight:1;
  const delta=Math.max(-90,Math.min(90,event.deltaY*unit));
  // macOS reports a trackpad pinch as a small ctrl-wheel: it needs more gain
  // than a scroll or the gesture feels like it is dragging through syrup.
  return Math.exp(-delta*(event.ctrlKey?.0075:.0016));
}
function publishZoom(phase){
  if(!SHELL||typeof SHELL.setPetZoomLive!=='function')return;
  SHELL.setPetZoomLive({value:zoomValue(),phase,roam:Boolean(PET.roam)});
}
function settleZoomGesture(){
  if(!zoomGesture)return;
  cancelAnimationFrame(zoomGesture.frame);
  zoomGesture=null;
  zoomEchoUntil=performance.now()+260;
  publishZoom('end');
}
cv.addEventListener('wheel',event=>{
  if(!SHELL||!PET.enabled)return;
  // The alpha probe is a GPU readback; run it once per gesture, not per event.
  if(!zoomGesture&&!confirmPetEventHit(event))return;
  event.preventDefault();
  const range=zoomRange();
  holdZoom(Math.max(range.min,Math.min(range.max,zoomValue()*wheelZoomFactor(event))));
  zoomEchoUntil=performance.now()+260;
  if(!zoomGesture){zoomGesture={frame:0};publishZoom('start');}
  else if(!zoomGesture.frame)zoomGesture.frame=requestAnimationFrame(()=>{
    if(!zoomGesture)return;
    zoomGesture.frame=0;publishZoom('move');
  });
  clearTimeout(zoomSaveTimer);zoomSaveTimer=setTimeout(settleZoomGesture,ZOOM_SETTLE_MS);
},{passive:false});
addEventListener('blur',settleZoomGesture);
if(SHELL&&SHELL.isElectron&&typeof SHELL.onPetChat==='function')SHELL.onPetChat(()=>{
  if(monitorEnabled){
    closePetChat();
    SHELL.triggerEnconvoVoiceCommand();
    return;
  }
  document.documentElement.classList.add('chat-open');SHELL.setPetHit(true);
  setTimeout(()=>txt.focus(),60);
});
addEventListener('keydown',event=>{
  if(event.key==='Escape'&&document.documentElement.classList.contains('chat-open'))closePetChat();
});

monitorButton.addEventListener('click',async()=>{
  if(!SHELL||monitorButton.disabled)return;
  monitorButton.disabled=true;
  try{syncShellState(await SHELL.setEnconvoMonitor(!monitorEnabled));}
  catch(e){setStatus('could not change EnConvo monitor','');}
  finally{monitorButton.disabled=false;}
});
ptt.addEventListener('mousedown',()=>startRec());
addEventListener('mouseup',stopRec);
addEventListener('keydown',e=>{if(!monitorEnabled&&e.code==='Space'&&document.activeElement!==txt&&!e.repeat){
  e.preventDefault();startRec();}});
addEventListener('keyup',e=>{if(!monitorEnabled&&e.code==='Space'&&document.activeElement!==txt){
  e.preventDefault();stopRec();}});
txt.addEventListener('keydown',e=>{if(!monitorEnabled&&e.key==='Enter'&&txt.value.trim()){
  const v=txt.value.trim();txt.value='';turn(v);}});
