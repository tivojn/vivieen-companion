// Pointing at where the bar LIVES wakes it, even while it is invisible -
// before this, the EnConvo mark and the field were only reachable by a
// detour over the avatar (hover her, then travel down inside the grace
// window), and a cursor aimed straight at the icon found nothing at all.
// Waking is free: the hidden bar still claims no clicks (that stays with
// pointerOverChatControls below), it only fades the controls in.
function pointerOverBarZone(){
  if(pointer.x<0||pointer.y<0)return false;
  if(!document.documentElement.classList.contains('chat-open'))return false;
  const box=controlRow.getBoundingClientRect();
  if(!box.width)return false;
  return pointer.x>=box.left&&pointer.x<=box.right&&
         pointer.y>=box.top-10&&pointer.y<=box.bottom+10;
}
// With the bar open, only its actual controls claim the window: an open bar
// that force-claimed EVERYTHING killed Click-Through Gaps for as long as it
// stayed up. Transparent gaps go back to the alpha sample.
function pointerOverChatControls(){
  const classes=document.documentElement.classList;
  // A hidden bar must not claim its screen region.
  if(!classes.contains('chat-open')||!classes.contains('chat-visible'))return false;
  if(pointer.x<0||pointer.y<0)return false;
  for(const id of ['monitor','manual']){
    const control=document.getElementById(id);
    if(!control)continue;
    const box=control.getBoundingClientRect();
    if(!box.width)continue;
    if(pointer.x>=box.left&&pointer.x<=box.right&&
       pointer.y>=box.top&&pointer.y<=box.bottom)return true;
  }
  return false;
}
/* The shell claims the bar controls itself, from its own 32ms cursor poll:
   it just needs to know where they are. Reported only while the bar is
   actually visible - rects for an invisible bar would swallow desktop
   clicks in the gap - and cleared the moment it hides. */
let lastControlRectsSent='';
function reportControlRects(){
  if(!SHELL||typeof SHELL.setPetControlRects!=='function')return;
  const classes=document.documentElement.classList;
  const visible=classes.contains('chat-open')&&classes.contains('chat-visible');
  const rects=[];
  if(visible){
    for(const id of ['monitor','manual']){
      const control=document.getElementById(id);
      if(!control)continue;
      const box=control.getBoundingClientRect();
      if(box.width>0&&box.height>0){
        rects.push({x:Math.floor(box.left),y:Math.floor(box.top),
                    w:Math.ceil(box.width),h:Math.ceil(box.height)});
      }
    }
  }
  const packet=JSON.stringify(rects);
  if(packet===lastControlRectsSent)return;
  lastControlRectsSent=packet;
  SHELL.setPetControlRects(rects);
}
function updatePetHit(force=false){
  if((!SHELL||!SHELL.isElectron)&&!IS_IOS)return;
  if(!PET.enabled)return;
  const now=performance.now();if(!force&&now-lastHitCheck<34)return;lastHitCheck=now;
  // `recording` pins the claim: mid-hold the cursor may slip off the body,
  // and losing interactivity there loses the release that ends the take.
  const modalHit=pointerOverChatControls()||recording||!document.getElementById('emptyState').hidden;
  let sample=modalHit;
  if(!sample&&domVideo.el&&pointer.x>=0){
    // Clip mode: the canvas is empty, the figure IS the video element.
    const box=domVideo.el.getBoundingClientRect();
    sample=pointer.x>=box.left&&pointer.x<=box.right&&
      pointer.y>=box.top&&pointer.y<=box.bottom;
  }else if(!sample&&ready&&pointer.x>=0&&pointer.y>=0&&pointer.x<innerWidth&&pointer.y<innerHeight){
    // getImageData is a GPU->CPU readback that stalls the whole canvas
    // pipeline - at 30Hz it was a measurable slice of the standby burn. A
    // stationary cursor reuses its last sample; only movement pays.
    const still=Math.abs(pointer.x-hitSamplePoint.x)<2&&
      Math.abs(pointer.y-hitSamplePoint.y)<2;
    if(still&&now-hitSampleAt<250){
      sample=hitSampleValue;
    }else{
      const ratio=cvScale(),x=Math.floor(pointer.x*ratio),y=Math.floor(pointer.y*ratio);
      try{sample=ctx.getImageData(x,y,1,1).data[3]>14;}catch(error){sample=false;}
      hitSampleAt=now;hitSamplePoint={x:pointer.x,y:pointer.y};hitSampleValue=sample;
    }
  }
  if(modalHit)hitConfidence=1;
  else if(force)hitConfidence=sample?1:0;
  else hitConfidence=Math.max(0,Math.min(1,hitConfidence+(sample?.32:-.08)));
  const hit=hitConfidence>=.56?true:hitConfidence<=.18?false:petHit;
  if(hit===petHit){
    if(hit)petHoverUntil=now+1400;
    // Heartbeat: the shell can flip the window to click-through on its own
    // (cursor left the window, focus dances) while this side sees "no
    // change" and stays silent - which once left the input field dead until
    // a drag jolted things. Re-sending the unchanged flag is free (the
    // shell ignores no-ops) and heals any desync within half a second.
    if(now-lastHitSentAt>500){lastHitSentAt=now;
      if(SHELL&&typeof SHELL.setPetHit==='function')SHELL.setPetHit(petHit);}
    return;
  }
  petHit=hit;if(hit)petHoverUntil=now+1400;
  lastHitSentAt=now;
  if(SHELL&&typeof SHELL.setPetHit==='function')SHELL.setPetHit(hit);
  syncPetEngagement(now);
  // Hovering her mid-walk brings her home to the standing avatar: a short
  // dwell so a cursor merely passing through does not end the stroll.
  clearTimeout(roamHoverStop);
  if(hit&&PET.roam&&typeof SHELL.setPetRoam==='function'){
    roamHoverStop=setTimeout(()=>{
      if(petHit&&PET.roam)SHELL.setPetRoam(false);
    },ROAM_HOVER_STOP_MS);
  }
}
function closePetChat(){
  document.documentElement.classList.remove('chat-open');
  updatePetHit(true);
}
let pointerWasInside=false;
if(HAS_GLOBAL_PET_POINTER)SHELL.onPetPointer(point=>{
  if(!point)return;
  noteCursor(Number(point.x),Number(point.y));
  if(dragging)return;
  // Off-window coordinates feed the gaze only; hit testing keeps its
  // in-window sentinel so click-through behaviour is unchanged.
  const inside=point.inside!==undefined
    ?Boolean(point.inside)
    :point.x>=0&&point.y>=0;
  // The shell forces click-through whenever the cursor leaves the window.
  // While the chat bar (or any modal state) pins petHit true, this side
  // never notices that flip - petHit "does not change" on re-entry, so the
  // interactive flag was never re-sent and the window stayed dead to every
  // click, drag, keystroke, and menu. Re-assert it on each re-entry.
  if(inside&&!pointerWasInside&&petHit&&typeof SHELL.setPetHit==='function'){
    SHELL.setPetHit(true);
  }
  pointerWasInside=inside;
  pointer=inside?{x:Number(point.x),y:Number(point.y)}:{x:-1,y:-1};
  updatePetHit();
});
addEventListener('pointermove',event=>{
  if(!HAS_GLOBAL_PET_POINTER)noteCursor(event.clientX,event.clientY);
},{passive:true});
cv.addEventListener('pointermove',event=>{
  if(!HAS_GLOBAL_PET_POINTER)pointer={x:event.clientX,y:event.clientY};
  if(SHELL&&gesture&&!dragging&&!gesture.ptt&&
     Math.hypot(event.clientX-gesture.x0,event.clientY-gesture.y0)>TAP_SLOP_PX){
    if(gesture.timer){clearTimeout(gesture.timer);gesture.timer=0;}
    dragging=true;document.documentElement.classList.add('dragging');
    SHELL.beginPetDrag({screenX:gesture.sx,screenY:gesture.sy});
  }
  if(dragging){SHELL.movePetDrag({screenX:event.screenX,screenY:event.screenY});return;}
  if(!HAS_GLOBAL_PET_POINTER)updatePetHit();
});
cv.addEventListener('pointerleave',()=>{
  if(HAS_GLOBAL_PET_POINTER)return;
  pointer={x:-1,y:-1};
  if(!dragging&&!document.documentElement.classList.contains('chat-open'))updatePetHit(true);

function confirmPetEventHit(event){
  pointer={x:event.clientX,y:event.clientY};
  updatePetHit(true);
  return petHit;
}

/* ---- pet gestures ----------------------------------------------------------
   One mouse button carries three verbs, so pointerdown only ARMS a gesture:
   move past the slop and it is a drag (origin at the press point, so nothing
   jumps); hold the HEAD still and it is push-to-talk, released to send; a
   quick release is a tap and she acknowledges it. The head is resolved
   pixel-exactly by drawing the real head mask through the same camera and
   face transforms as the visible scene and sampling one pixel - no hit boxes,
   so a hand in front of the chest still counts as body. */
let gesture=null,petHitCanvas=null,petHitCtx=null,lastTapAt=0;
const TAP_SLOP_PX=4,HEAD_HOLD_MS=200,TAP_MS=350;
function pointerOnHead(x,y){
  if(!ready||!(BODY&&HEADMASK&&M.body))return false;
  const matrix=M.body.face_transform;
  if(!matrix||matrix.length!==2)return false;
  const ratio=cvScale();
  const px=Math.floor(x*ratio),py=Math.floor(y*ratio);
  if(px<0||py<0||px>=cv.width||py>=cv.height)return false;
  if(!petHitCanvas){
    petHitCanvas=document.createElement('canvas');
    petHitCtx=petHitCanvas.getContext('2d',{willReadFrequently:true});
  }
  petHitCanvas.width=cv.width;petHitCanvas.height=cv.height;
  const width=BODY.width,height=BODY.height;
  const camera=petCamera(M.body,width,height);
  const motion=bodyAt(performance.now(),width,height);
  const bounds=M.body.bounds||[0,0,width,height];
  const pivotX=bounds[0]+bounds[2]/2,pivotY=bounds[1]+bounds[3];
  petHitCtx.setTransform(camera.scale,0,0,camera.scale,camera.x,camera.y);
  petHitCtx.translate(pivotX+motion.x,pivotY+motion.y);
  petHitCtx.rotate(motion.r);petHitCtx.scale(motion.sx,motion.sy);
  petHitCtx.translate(-pivotX,-pivotY);
  petHitCtx.transform(matrix[0][0],matrix[1][0],matrix[0][1],matrix[1][1],matrix[0][2],matrix[1][2]);
  petHitCtx.drawImage(HEADMASK,0,0,headSurface.width,headSurface.height);
  try{return petHitCtx.getImageData(px,py,1,1).data[3]>40;}catch(error){return false;}
}
/* Holding her head is always push-to-talk; WHERE the words go follows the
   EnConvo monitor. Following: the hold presses EnConvo's voice hotkey (right
   Option) for real - down while held, up on release - and she lip-syncs the
   answer through the monitor. Unfollowed: she is fully her own - the hold
   records through Vivieen's configured ASR, the reply comes from the models
   set in her own Settings (LLM + TTS), the answer speaks into the bubble,
   and the chat bar (Hold to talk + a text field) opens under her feet for
   typed follow-ups. */
function canPetTalk(){
  // On the phone her head is the talk button too - dictation runs through
  // the same server bridge, no shell needed.
  if(IS_IOS&&!monitorEnabled)return true;
  if(!SHELL||!SHELL.isElectron)return false;
  return monitorEnabled?typeof SHELL.petVoiceKey==='function':true;
}
/* ---- body-part hit testing -------------------------------------------------
   The skeleton baked at export classifies a click by its nearest bone
   segment, in plate coordinates recovered by inverting the same camera and
   sway transforms the scene is drawn with. The head stays mask-exact. */
function canvasToBody(x,y){
  if(!(BODY&&M.body))return null;
  const ratio=cvScale();
  const width=BODY.width,height=BODY.height;
  const camera=petCamera(M.body,width,height);
  let px=(x*ratio-camera.x)/camera.scale;
  let py=(y*ratio-camera.y)/camera.scale;
  const motion=bodyAt(performance.now(),width,height);
  const bounds=M.body.bounds||[0,0,width,height];
  const pivotX=bounds[0]+bounds[2]/2,pivotY=bounds[1]+bounds[3];
  const dx=px-(pivotX+motion.x),dy=py-(pivotY+motion.y);
  const c=Math.cos(-motion.r),s=Math.sin(-motion.r);
  return {x:(dx*c-dy*s)/motion.sx+pivotX,
          y:(dx*s+dy*c)/motion.sy+pivotY};
}
function petBodyPart(x,y){
  if(pointerOnHead(x,y))return 'head';
  // A portrait-mode avatar (no generated body yet) is essentially a face,
  // so the whole cutout counts as head and hold-to-talk works from day one.
  if(!(BODY&&HEADMASK&&M.body))return 'head';
  const joints=M.body&&M.body.pose&&M.body.pose.joints;
  const point=joints?canvasToBody(x,y):null;
  if(!point)return 'body';
  const at=name=>{const j=joints[name];return j?[j.x,j.y]:null;};
  // The mask is face-exact, but people aim for the top of the head: the
  // crown ring outside the mask is HAIR - it arms hold-to-talk exactly like
  // the head, and a double-tap there is the Show Me Some Moves gesture. A
  // circle around the nose sized by the nose-to-neck span covers it.
  {
    const nose=at('nose'),neck=at('neck');
    if(nose&&neck){
      const radius=Math.hypot(nose[0]-neck[0],nose[1]-neck[1])*1.2;
      if(Math.hypot(point.x-nose[0],point.y-nose[1])<=radius)return 'hair';
    }
  }
  const segdist=(p,a,b)=>{
    const abx=b[0]-a[0],aby=b[1]-a[1];
    const t=Math.max(0,Math.min(1,
      ((p.x-a[0])*abx+(p.y-a[1])*aby)/Math.max(1e-6,abx*abx+aby*aby)));
    return Math.hypot(p.x-(a[0]+t*abx),p.y-(a[1]+t*aby));
  };
  const candidates=[];
  for(const side of ['left','right']){
    const key='arm_'+side[0],leg='leg_'+side[0];
    const shoulder=at(side+'_shoulder'),elbow=at(side+'_elbow'),
      wrist=at(side+'_wrist'),hip=at(side+'_hip'),
      knee=at(side+'_knee'),ankle=at(side+'_ankle');
    if(elbow&&wrist){
      const tip=[wrist[0]+(wrist[0]-elbow[0])*.4,
                 wrist[1]+(wrist[1]-elbow[1])*.4];
      candidates.push([key,Math.min(segdist(point,elbow,wrist),
                                    segdist(point,wrist,tip))]);
    }
    if(shoulder&&elbow)candidates.push([key,segdist(point,shoulder,elbow)]);
    if(hip&&knee)candidates.push([leg,segdist(point,hip,knee)]);
    if(knee&&ankle)candidates.push([leg,segdist(point,knee,ankle)]);
    if(ankle){
      // The foot hangs below the ankle; favoured slightly so clicks at shoe
      // level classify as foot rather than shin.
      const heightRef=(M.body.bounds||[0,0,0,BODY.height])[3];
      const toe=[ankle[0],ankle[1]+heightRef*.055];
      candidates.push(['foot_'+side[0],segdist(point,ankle,toe)*.85]);
    }
  }
  const ls=at('left_shoulder'),rs=at('right_shoulder'),
    lh=at('left_hip'),rh=at('right_hip');
  if(ls&&rs&&lh&&rh){
    const top=[(ls[0]+rs[0])/2,(ls[1]+rs[1])/2];
    const bottom=[(lh[0]+rh[0])/2,(lh[1]+rh[1])/2];
    // The spine is favoured slightly so central clicks read as torso even
    // though the hanging arms run close beside it.
    candidates.push(['torso',segdist(point,top,bottom)*.8]);
  }
  if(!candidates.length)return 'body';
  candidates.sort((a,b)=>a[1]-b[1]);
  const bodyHeight=(M.body.bounds||[0,0,0,BODY.height])[3];
  return candidates[0][1]<=bodyHeight*.14?candidates[0][0]:'body';
}

/* ---- limb reactions --------------------------------------------------------
   Baked warp states of the standing plate: rest -> peak -> rest over ~0.6s.
   Each state is a full replacement tile for its box, so the player clears
   the box and stamps the tile; first and last states ARE the plate. */
let REACT=null;
let lastEngagedAt=performance.now(),lastTap={part:'',at:0},roamHoverStop=0,idleDocked=false;

const STANDING_IDLE_AFTER_MS=10000,ROAM_HOVER_STOP_MS=260,
  DOUBLE_TAP_MS=IS_IOS?650:450;
/* Double taps are the deliberate verbs: legs start the Horizon Walk, the
   chest raises opacity, a foot lowers it. Returns true when the part had a
   double-tap action, so the second tap never also fires a reaction. */
/* ---- Show Me Some Moves ---------------------------------------------------
   A short performance loop played in place of the standing avatar: toggled
   by a double-tap on the HAIR (the crown ring outside the face mask), the
   menu row, and cancelled by any tap on her. Runs for four loops. */
let moveShowUntil=0;
function moveShowActive(now=performance.now()){
  return Boolean(MOTION.move&&!PET.roam&&now<moveShowUntil);
}
function toggleMoveShow(){
  const now=performance.now();

  if(!MOTION.move){
    flashPrompt('No moves yet · generate Show Me Some Moves in Character Studio');
    return false;
  }
  const clip=MOTION.move;
  const seconds=Math.max(2,(Number(clip.frames)||1)/Math.max(1,Number(clip.fps)||12));
  moveShowUntil=now+seconds*4000;

}
/* Catwalk: on the phone there is no desktop to roam, so a leg double-tap
   plays the same office-walk take in place - a short strut on her own
   stage, then back to standing (owner design talk, 2026-08-02). */
let walkShowUntil=0;
function walkShowActive(now=performance.now()){

}
function toggleWalkShow(){
  const now=performance.now();

  if(!MOTION.walk)return false;
  const clip=MOTION.walk;
  const seconds=Math.max(2,(Number(clip.frames)||1)/Math.max(1,Number(clip.fps)||24));
  walkShowUntil=now+seconds*3000;
  return true;
}
/* Rest: the edge-idle take leaning on the phone's own right edge, held
   until something touches her - the rail's third verb. */
let idleShowUntil=0;
function idleShowActive(now=performance.now()){
  return Boolean(MOTION.idle&&!PET.roam&&now<idleShowUntil);
}
function toggleIdleShow(){
  const now=performance.now();
  if(idleShowActive(now)){idleShowUntil=0;hideDomVideo();return true;}
  if(!MOTION.idle)return false;
  idleShowUntil=now+120000;
  return true;
}
function petDoubleTap(part){
  if(part==='hair'&&toggleMoveShow())return true;
  if((part==='leg_l'||part==='leg_r')&&IS_IOS&&toggleWalkShow())return true;
  if((part==='leg_l'||part==='leg_r')&&MOTION.walk&&
     SHELL&&typeof SHELL.setPetRoam==='function'){
    Promise.resolve(SHELL.setPetRoam(true))
      .then(state=>syncShellState(state)).catch(()=>{});
    return true;
  }
  if(part==='torso'&&SHELL&&typeof SHELL.setPetOpacity==='function'){
    SHELL.setPetOpacity(Math.min(1,(Number(PET.opacity)||.5)+0.12));
    return true;
  }
  if((part==='foot_l'||part==='foot_r')&&
     SHELL&&typeof SHELL.setPetOpacity==='function'){
    // Floor at 0.15: a fully transparent pet cannot be found to click again.
    SHELL.setPetOpacity(Math.max(.15,(Number(PET.opacity)||.5)-0.12));
    return true;
  }
  return false;
}
function standingIdleActive(now){
  return Boolean(SHELL&&SHELL.isElectron&&PET.enabled&&!PET.roam&&
    MOTION.idle&&now-lastEngagedAt>STANDING_IDLE_AFTER_MS);
}
function startLimbReaction(name){
  const meta=M.body&&M.body.reactions&&M.body.reactions[name];
  if(!meta||!RB[name]||REACT)return false;
  REACT={name,meta,image:RB[name],start:performance.now(),dur:620};
  return true;
}
function drawLimbReaction(now){
  if(!REACT)return;
  const t=(now-REACT.start)/REACT.dur;
  if(t>=1){REACT=null;return;}
  const states=Math.max(1,REACT.meta.states||1);
  const index=Math.min(states-1,Math.round(Math.sin(Math.PI*t)*(states-1)));
  const box=REACT.meta.box;
  ctx.clearRect(box[0],box[1],box[2],box[3]);
  ctx.drawImage(REACT.image,0,index*box[3],box[2],box[3],
                box[0],box[1],box[2],box[3]);
}

function startPetTalk(){
  if(!canPetTalk())return;
  if(monitorEnabled){SHELL.petVoiceKey('down');return;}
  // Unfollowed: the head IS the hold-to-talk button. Open her own chat bar
  // and start recording; release transcribes and answers through the models
  // configured in Settings, spoken into the bubble. Forced, because the
  // hidden chat button's disabled flag stays latched in pet mode until a
  // health poll lands - the head must not wait for it.
  document.documentElement.classList.add('chat-open');
  if(SHELL&&typeof SHELL.setPetHit==='function')SHELL.setPetHit(true);
  // Optimistic wave: microphone acquisition can take a beat (or fail), and
  // the hold needs feedback NOW; startRec's failure paths take it back down.
  document.documentElement.classList.add('listening');
  startRec(true);
}
function stopPetTalk(){
  if(!canPetTalk())return;
  if(monitorEnabled){SHELL.petVoiceKey('up');return;}
  stopRec();
  updatePetHit(true);
}
function petTapReaction(part){
  const now=performance.now();
  if(now-lastTapAt<700)return;
  lastTapAt=now;
  // Every tap gets an acknowledging nod; arms raise their hand and the torso
  // shrugs. Legs and feet only nod on a single tap - their whole-body tilt
  // was cancelled by taste - and answer properly on a double tap instead.
  const headTap=part==='head'||part==='hair';
  nods.push({t0:now,a:headTap?7.6:5.6,d:headTap?460:400,n:1});
  nextNod=now+2400+Math.random()*2000;
  if(part==='arm_l'||part==='arm_r'){
    startLimbReaction(part);
    return;
  }
  if(part==='torso')startLimbReaction('shrug');
}
function clearGesture(){
  if(gesture&&gesture.timer)clearTimeout(gesture.timer);
  gesture=null;
}
cv.addEventListener('pointerdown',event=>{
  if((!SHELL&&!IS_IOS)||!PET.enabled||event.button!==0||PET.locked||PET.roam||!confirmPetEventHit(event))return;
  clearGesture();
  const part=petBodyPart(event.clientX,event.clientY);
  gesture={x0:event.clientX,y0:event.clientY,
    sx:event.screenX,sy:event.screenY,
    t0:performance.now(),ptt:false,
    part,head:part==='head'||part==='hair'};
  cv.setPointerCapture(event.pointerId);
  if(gesture.head&&canPetTalk()){
    gesture.timer=setTimeout(()=>{
      if(!gesture||dragging)return;
      gesture.timer=0;gesture.ptt=true;
      startPetTalk();
    },HEAD_HOLD_MS);
  }
});
cv.addEventListener('pointerup',event=>{
  const active=gesture;
  clearGesture();
  try{cv.releasePointerCapture(event.pointerId);}catch(error){}
  if(dragging){
    dragging=false;document.documentElement.classList.remove('dragging');
    SHELL.endPetDrag();updatePetHit(true);
    return;
  }
  if(!active)return;
  if(active.ptt){stopPetTalk();return;}
  if(performance.now()-active.t0<=TAP_MS){
    let part=active.part||'body';
    // A fingertip cannot aim at the hair strip; on the phone the whole
    // head owns the double-tap dance.
    if(IS_IOS&&part==='head')part='hair';
    const now=performance.now();
    if(lastTap.part===part&&now-lastTap.at<=DOUBLE_TAP_MS&&petDoubleTap(part)){
      lastTap={part:'',at:0};
      return;
    }
    // Any tap off the hair ends a running move show (the hair keeps its
    // double-tap toggle without the first tap eating the performance).
    if(moveShowActive(now)&&part!=='hair')moveShowUntil=0;
    if(walkShowActive(now)&&part!=='leg_l'&&part!=='leg_r')walkShowUntil=0;
    if(idleShowActive(now)){idleShowUntil=0;hideDomVideo();}
    lastTap={part,at:now};
    petTapReaction(part);
  }
});
cv.addEventListener('pointercancel',event=>{
  const active=gesture;
  clearGesture();
  try{cv.releasePointerCapture(event.pointerId);}catch(error){}
  if(dragging){
    dragging=false;document.documentElement.classList.remove('dragging');
    SHELL.endPetDrag();updatePetHit(true);
  }
  if(active&&active.ptt)stopPetTalk();
});
// Rescue net: if the canvas somehow missed the release (its pointerup can
// be lost when the window flips click-through mid-gesture), any release
// reaching the window still ends the drag instead of freezing the feed.
addEventListener('pointerup',()=>{
  if(!dragging)return;
  dragging=false;document.documentElement.classList.remove('dragging');
  SHELL.endPetDrag();updatePetHit(true);
});
cv.addEventListener('contextmenu',event=>{
  if(!SHELL||!PET.enabled||!confirmPetEventHit(event))return;
  event.preventDefault();SHELL.showPetMenu({x:event.screenX,y:event.screenY});
});
// Double-click is part-aware now (legs walk, chest and feet set opacity), so
// the old anywhere-on-her dblclick walk handler is gone: it fired alongside
// the new verbs and sent her walking when a chest tap only meant "brighter".
cv.addEventListener('dblclick',event=>{
  if(SHELL&&PET.enabled)event.preventDefault();
});
const STAND_ZOOM={min:.25,max:4};
const ZOOM_SETTLE_MS=140;
function zoomRange(){return PET.roam?ROAM_ZOOM:STAND_ZOOM;}
function zoomValue(){
  const range=zoomRange(),value=Number(PET.roam?PET.roamZoom:PET.zoom);
  return Math.max(range.min,Math.min(range.max,
    Number.isFinite(value)&&value>0?value:1));
}
function holdZoom(value){if(PET.roam)PET.roamZoom=value;else PET.zoom=value;}
function wheelZoomFactor(event){
  const unit=event.deltaMode===1?16:event.deltaMode===2?innerHeight:1;
  const delta=Math.max(-90,Math.min(90,event.deltaY*unit));
  // macOS reports a trackpad pinch as a small ctrl-wheel: it needs more gain
  // than a scroll or the gesture feels like it is dragging through syrup.
  return Math.exp(-delta*(event.ctrlKey?.0075:.0016));
}
function publishZoom(phase){
  if(!SHELL||typeof SHELL.setPetZoomLive!=='function')return;
  SHELL.setPetZoomLive({value:zoomValue(),phase,roam:Boolean(PET.roam)});
}
function settleZoomGesture(){
  if(!zoomGesture)return;
  cancelAnimationFrame(zoomGesture.frame);
  zoomGesture=null;
  zoomEchoUntil=performance.now()+260;
  publishZoom('end');
}
cv.addEventListener('wheel',event=>{
  if(!SHELL||!PET.enabled)return;
  // The alpha probe is a GPU readback; run it once per gesture, not per event.
  if(!zoomGesture&&!confirmPetEventHit(event))return;
  event.preventDefault();
  const range=zoomRange();
  holdZoom(Math.max(range.min,Math.min(range.max,zoomValue()*wheelZoomFactor(event))));
  zoomEchoUntil=performance.now()+260;
  if(!zoomGesture){zoomGesture={frame:0};publishZoom('start');}
  else if(!zoomGesture.frame)zoomGesture.frame=requestAnimationFrame(()=>{
    if(!zoomGesture)return;
    zoomGesture.frame=0;publishZoom('move');
  });
  clearTimeout(zoomSaveTimer);zoomSaveTimer=setTimeout(settleZoomGesture,ZOOM_SETTLE_MS);
},{passive:false});
addEventListener('blur',settleZoomGesture);
if(SHELL&&SHELL.isElectron&&typeof SHELL.onPetChat==='function')SHELL.onPetChat(()=>{
  if(monitorEnabled){
    closePetChat();
    SHELL.triggerEnconvoVoiceCommand();
    return;
  }
  document.documentElement.classList.add('chat-open');SHELL.setPetHit(true);
  setTimeout(()=>txt.focus(),60);
});
addEventListener('keydown',event=>{
  if(event.key==='Escape'&&document.documentElement.classList.contains('chat-open'))closePetChat();
});
if(SHELL&&SHELL.isElectron&&typeof SHELL.onLiveToggle==='function'){
  SHELL.onLiveToggle(()=>{void startLiveTalk();});
}
if(SHELL&&SHELL.isElectron&&typeof SHELL.onPetMoves==='function'){
  SHELL.onPetMoves(()=>{toggleMoveShow();});
}

monitorButton.addEventListener('click',async()=>{
  if(!SHELL||monitorButton.disabled)return;
  monitorButton.disabled=true;
  try{syncShellState(await SHELL.setEnconvoMonitor(!monitorEnabled));}
  catch(e){setStatus('could not change EnConvo monitor','');}
  finally{monitorButton.disabled=false;}
});
ptt.addEventListener('mousedown',()=>startRec());
addEventListener('mouseup',stopRec);
/* ---- Pocket Mirror talk bar (iOS) --------------------------------------
   WeChat idiom: the mic toggle swaps the field for one big hold-to-talk
   bar. Press records, release sends, slide UP past the threshold cancels.
   recDiscard makes the cancel real: the take is dropped unheard. */
let recDiscard=false;
if(IS_IOS){
  const micmode=document.getElementById('micmode');
  const talkbar=document.getElementById('talkbar');
  const setTalkMode=on=>{
    document.documentElement.classList.toggle('talk-mode',on);
    micmode.setAttribute('aria-pressed',String(on));
    if(!on)talkbar.classList.remove('rec','cancel');
  };
  micmode.addEventListener('click',
    ()=>setTalkMode(!document.documentElement.classList.contains('talk-mode')));
  let holdY=0,holdCancel=false;
  const CANCEL_LIFT_PX=70;
  talkbar.addEventListener('pointerdown',event=>{
    event.preventDefault();
    holdY=event.clientY;holdCancel=false;recDiscard=false;
    try{talkbar.setPointerCapture(event.pointerId);}catch(error){}
    talkbar.classList.add('rec');
    document.documentElement.classList.add('listening');
    startRec(true);
  });
  talkbar.addEventListener('pointermove',event=>{
    if(!recording)return;
    const lifted=holdY-event.clientY>CANCEL_LIFT_PX;
    if(lifted!==holdCancel){
      holdCancel=lifted;
      talkbar.classList.toggle('cancel',lifted);
      talkbar.textContent=lifted?'Release to cancel':'Hold to talk';
    }
  });
  const endHold=()=>{
    talkbar.classList.remove('rec','cancel');
    talkbar.textContent='Hold to talk';
    recDiscard=holdCancel;holdCancel=false;
    stopRec();
  };
  talkbar.addEventListener('pointerup',endHold);
  talkbar.addEventListener('pointercancel',endHold);
  // Action rail: live call, dance, walk, rest - one tap each, states lit.
  const railLive=document.getElementById('rail-live');
  const railMove=document.getElementById('rail-move');
  const railWalk=document.getElementById('rail-walk');
  const railIdle=document.getElementById('rail-idle');
  railMove.addEventListener('click',()=>toggleMoveShow());
  railWalk.addEventListener('click',()=>toggleWalkShow());
  railIdle.addEventListener('click',()=>toggleIdleShow());
  railLive.addEventListener('click',()=>{
    if(LIVE)stopLiveTalk('ended');else void startLiveTalk();
  });
  // Zoom: the slider scales her freely; the closeup button is the desk's
  // Cmd+Shift+9 in pocket form - one tap face-forward, tap again to reset
  // (which is all Cmd+Shift+0 ever promised).
  const railClose=document.getElementById('rail-close');
  const railZoom=document.getElementById('rail-zoom');
  const zoomRange=document.getElementById('zoomrange');
  const setZoom=(value,headAnchor)=>{
    IOS_ZOOM=Math.max(.6,Math.min(2.6,value));
    IOS_HEAD_ANCHOR=Boolean(headAnchor)&&IOS_ZOOM>1.01;
    zoomRange.value=String(Math.round(IOS_ZOOM*100));
  };
  railClose.addEventListener('click',()=>{
    if(IOS_HEAD_ANCHOR)setZoom(1,false);else setZoom(2.4,true);
  });
  railZoom.addEventListener('click',()=>{
    document.documentElement.classList.toggle('zoom-open');
  });
  zoomRange.addEventListener('input',()=>setZoom(Number(zoomRange.value)/100,
    Number(zoomRange.value)>140));
  setInterval(()=>{
    const now=performance.now();
    railLive.classList.toggle('on',Boolean(LIVE));
    railMove.classList.toggle('on',moveShowActive(now));
    railWalk.classList.toggle('on',walkShowActive(now));
    railIdle.classList.toggle('on',idleShowActive(now));
    railClose.classList.toggle('on',IOS_HEAD_ANCHOR);
    railZoom.classList.toggle('on',
      document.documentElement.classList.contains('zoom-open'));
  },400);
  // iOS auto-scrolls the page to keep a focused field visible, which
  // shoves her head off the top and leaves the page shifted after the
  // keyboard goes away. The stage never legitimately scrolls - pin it.
  addEventListener('scroll',()=>{if(scrollY||scrollX)scrollTo(0,0);});
  document.addEventListener('focusout',()=>setTimeout(()=>scrollTo(0,0),60));
  if(window.visualViewport)
    visualViewport.addEventListener('resize',()=>{scrollTo(0,0);fitTxtPlaceholder();});
}
addEventListener('keydown',e=>{if(!monitorEnabled&&e.code==='Space'&&document.activeElement!==txt&&!e.repeat){
  e.preventDefault();startRec();}});
addEventListener('keyup',e=>{if(!monitorEnabled&&e.code==='Space'&&document.activeElement!==txt){
  e.preventDefault();stopRec();}});
// The click may arrive while another app is active (acceptFirstMouse): ask
// the shell to make this window KEY, or the caret never blinks and typing
// goes to the previous app.
txt.addEventListener('pointerdown',()=>{
  if(SHELL&&typeof SHELL.focusPetWindow==='function')SHELL.focusPetWindow();
});
txt.addEventListener('keydown',e=>{if(!monitorEnabled&&e.key==='Enter'&&!e.shiftKey){
  // Enter sends, Shift+Enter makes a new line - the field is a textarea now.
  e.preventDefault();
  const v=txt.value.trim();if(!v)return;
  txt.value='';autoSizeTxt();turn(v);}});
</script></body></html>
