<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vivieen speech</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent}
    body{display:grid;place-items:center;padding:18px 30px 34px;
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
      -webkit-font-smoothing:antialiased}
    /* Same glass language as the avatar's input bar: dark translucency, one
       hairline border, no tail, no badge - the label is a thin line-art rule. */
    .bubble{position:relative;width:min(100%,720px);padding:20px 26px 22px;
      border:1px solid rgba(255,255,255,.14);border-radius:16px;
      background:rgba(14,16,20,.82);backdrop-filter:blur(22px);
      box-shadow:0 18px 48px rgba(0,0,0,.32)}
    .head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
    .mark{flex:none;width:5px;height:5px;border-radius:50%;background:#d81f4a}
    .name{flex:none;font:600 10px/1 inherit;letter-spacing:.3em;color:rgba(242,239,233,.5)}
    .rule{flex:1;height:1px;background:rgba(255,255,255,.10)}
    #text{color:#f2efe9;text-wrap:pretty;font-size:clamp(17px,2vw,24px);
      font-weight:450;line-height:1.45;letter-spacing:-.012em;
      display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden}
    body.medium #text{font-size:clamp(15px,1.75vw,20px)}
    body.long #text{font-size:clamp(14px,1.5vw,17px);line-height:1.5;-webkit-line-clamp:6}
  </style>
</head>
<body>
  <section class="bubble" role="status" aria-live="polite">
    <div class="head" aria-hidden="true"><span class="mark"></span><span class="name">VIVIEEN</span><span class="rule"></span></div>
    <div id="text"></div>
  </section>
  <script>
    const text = document.getElementById('text');
    window.vivieenBubble?.onText((payload = {}) => {
      const value = String(payload.text || '').trim();
      text.textContent = value;
      document.body.classList.toggle('medium', value.length > 130 && value.length <= 260);
      document.body.classList.toggle('long', value.length > 260);
    });
  </script>
</body>
</html>
