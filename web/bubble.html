<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vivieen speech</title>
  <style>
    :root{color-scheme:light}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent}
    body{display:grid;place-items:center;padding:22px 34px 42px;font-family:"Avenir Next","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
    .bubble{position:relative;width:min(100%,760px);min-height:126px;display:grid;place-items:center;padding:28px 42px 30px;border:4px solid #19171c;border-radius:42px;background:linear-gradient(145deg,#fffdf7 0%,#fff8ed 100%);box-shadow:0 16px 0 rgba(20,18,24,.16),0 22px 50px rgba(20,18,24,.24),inset 0 0 0 3px #e91e79;transform:translateY(-8px)}
    .bubble::before{content:"";position:absolute;left:50%;bottom:-33px;width:42px;height:42px;background:#fff9ef;border-right:4px solid #19171c;border-bottom:4px solid #19171c;transform:translateX(-50%) rotate(45deg);border-bottom-right-radius:9px;box-shadow:5px 5px 0 rgba(233,30,121,.9)}
    .bubble::after{content:"VIVIEEN";position:absolute;top:-15px;left:32px;padding:5px 13px 4px;border:3px solid #19171c;border-radius:999px;background:#e91e79;color:white;font:800 12px/1 "Avenir Next",sans-serif;letter-spacing:.16em;box-shadow:3px 3px 0 #19171c}
    #text{position:relative;z-index:1;width:100%;color:#19171c;text-align:center;text-wrap:balance;font-size:clamp(25px,3vw,38px);font-weight:750;line-height:1.22;letter-spacing:-.025em;text-shadow:0 1px 0 white;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden}
    body.medium #text{font-size:clamp(22px,2.6vw,32px)}
    body.long #text{font-size:clamp(18px,2.15vw,27px);line-height:1.26;-webkit-line-clamp:5}
  </style>
</head>
<body>
  <section class="bubble" role="status" aria-live="polite"><div id="text"></div></section>
  <script>
    const text = document.getElementById('text');
    window.vivieenBubble?.onText((payload = {}) => {
      const value = String(payload.text || '').trim();
      text.textContent = value;
      document.body.classList.toggle('medium', value.length > 130 && value.length <= 260);
      document.body.classList.toggle('long', value.length > 260);
    });
  </script>
</body>
</html>
