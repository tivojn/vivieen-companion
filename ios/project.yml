name: Vivieen
options:
  bundleIdPrefix: com.vivieen
  deploymentTarget:
    iOS: "17.0"
targets:
  Vivieen:
    type: application
    platform: iOS
    # The STRUCTURE ships with the app - the page and settings HTML are
    # bundle resources, never fetched from the Mac. Only DATA syncs
    # (owner, 2026-08-05: "each stays on its own"). catalog.json is the
    # provider roster for solo settings; regenerate it with:
    #   .venv/bin/python -c "import sys,json; sys.path.insert(0,'server');
    #     import providers; json.dump(providers.catalog(),
    #     open('ios/Vivieen/Resources/catalog.json','w'), indent=1)"
    sources:
      - Vivieen
      # The keyboard's Soniox streamer, compiled into the APP too: the
      # extension is never handed the microphone, so the app is the one
      # that actually opens this line (see KeyboardEar).
      - path: VivieenKeys/SonioxStream.swift
      - path: ../web/index.html
        buildPhase: resources
      - path: ../web/settings.html
        buildPhase: resources
    dependencies:
      - target: VivieenKeys
        embed: true
      - target: VivieenIsland
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vivieen.pocket
        # App Group only - safe at base for BOTH simulator ad-hoc and a
        # device archive (group ids carry no team prefix). Debug's
        # Vivieen.entitlements REPLACES this file and carries the group
        # too, plus the simulator-only keychain bits.
        CODE_SIGN_ENTITLEMENTS: Vivieen/Shared.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        SWIFT_OBJC_BRIDGING_HEADER: Vivieen/Vivieen-Bridging-Header.h
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Vivieen/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.12.0"
        CURRENT_PROJECT_VERSION: "1" 
        # Ad-hoc signed, not unsigned. An unsigned app carries NO
        # entitlements, so every Keychain write fails -34018 and solo
        # mode silently loses the keys it just decrypted (2026-08-03).
        # TestFlight archives override all of this on the command line.
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
      # Simulator only, and it MUST live under settings: - a bare
      # `configs:` on the target is not a key XcodeGen knows, so this
      # whole block was silently dropped and the app shipped with no
      # entitlements at all. A real signed build gets its Keychain access
      # group from its provisioning profile; an UNSIGNED simulator build
      # gets none, so every Keychain write failed -34018 and solo lost the
      # keys it had just decrypted - offline chat could never start
      # (2026-08-03). Verify with: codesign -d --entitlements - <app>.
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGNING_ALLOWED: YES
          CODE_SIGN_ENTITLEMENTS: Vivieen/Vivieen.entitlements

  # Vivieen Island - her face in the Dynamic Island (owner, 2026-08-06).
  # A Live Activity the app starts from the foreground when the island
  # toggle is on; keyboard takes update it from anywhere. Reads only the
  # small mirrored face from the App Group.
  VivieenIsland:
    type: app-extension
    platform: iOS
    sources:
      - VivieenIsland
      - path: Vivieen/TakeActivity.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vivieen.pocket.island
        INFOPLIST_FILE: VivieenIsland/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "0.12.0"
        CURRENT_PROJECT_VERSION: "1"
        # PARKED until the owner assigns group.com.vivieen.pocket to the
        # island App ID in the portal (Identifiers →
        # com.vivieen.pocket.island → App Groups → Configure) - the ASC
        # API can enable the capability but cannot tick the group, and a
        # TestFlight archive refuses the mismatch. Restore this line
        # after the click and the island reads her face:
        #   CODE_SIGN_ENTITLEMENTS: Vivieen/Shared.entitlements
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGNING_ALLOWED: YES

  # Vivieen Keys - her ears as a keyboard in every app (Wispr Flow's
  # trick on her stack). Shares SonioxTap with the app; the dictation
  # essentials arrive through the App Group mirror, never the keychain.
  VivieenKeys:
    type: app-extension
    platform: iOS
    sources:
      - VivieenKeys
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vivieen.pocket.keys
        INFOPLIST_FILE: VivieenKeys/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "0.12.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: Vivieen/Shared.entitlements
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGNING_ALLOWED: YES
