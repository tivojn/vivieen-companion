name: Vivieen
options:
  bundleIdPrefix: com.vivieen
  deploymentTarget:
    iOS: "17.0"
targets:
  Vivieen:
    type: application
    platform: iOS
    sources: [Vivieen]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vivieen.pocket
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        SWIFT_OBJC_BRIDGING_HEADER: Vivieen/Vivieen-Bridging-Header.h
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Vivieen/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.9.1"
        CURRENT_PROJECT_VERSION: "1" 
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
